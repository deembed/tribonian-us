status  = "todo"
claimed = ""
unlocks = ["NY", "VA", "AL", "AR", "GA", "MS", "TN", "IN"]

[pieces.pdf]
what    = "parser family: PDF text keeping indentation (pdftotext -layout), into the shared ladder"
