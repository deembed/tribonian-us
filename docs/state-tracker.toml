# state-tracker.toml -- where each jurisdiction's statutes stand, and who is working on what.
#
# Shared by agents and conversations. One table per jurisdiction, so two agents editing different
# states never touch the same lines (git merges cleanly). `tribonian state status` prints the tally.
#
# HOW TO TAKE A STATE
#   1. Pick one with status "fits"/"unclear" whose `needs` are all "done" in [pieces] below.
#   2. Set claimed = "<who>" and branch = "<branch>", commit that one change first (on its own branch).
#   3. Work: probe (tribonian state probe <url>), add the formula to src/tribonian/data/state_formulas.toml,
#      fetch, build until verify passes. New parser features go in as general settings, never state code.
#   4. Set status = "working", fill `verified` with the build summary line, clear `claimed`.
# A shared piece (below) is claimed the same way; states that need it wait for it.
#
# status   working   formula in place, a build passes verify
#          fits      static HTML the html-paragraphs family should read (probe + config)
#          unclear   format not confirmed yet: probe first
#          bulk      structured data or an API: needs a family from [pieces]
#          pdf       PDF only: needs the pdf family
#          vendor    vendor viewer or JavaScript-only site: OpenJurist fallback
# Source facts (URLs, terms, official status) live in src/tribonian/data/state_law_sources.toml.
# Status as of 2026-10-26: from that registry's research; only CO, CT, MD have been probed.

# ---------------------------------------------------------------- shared pieces
[pieces.index2]
what    = "fetch strategy: two-level index (title page -> chapter page -> section pages)"
status  = "done"            # todo | claimed | done
how     = "index fetch with links = [regex per level]; save_as = \"path\" when page names repeat across folders"
claimed = ""
unlocks = ["AZ", "KS", "ME", "MT", "OH", "RI", "MN", "WI", "HI", "ID", "IL", "KY", "LA", "MA", "AK"]

[pieces.xml]
what    = "parser family: XML with a config tag map to USLM"
status  = "todo"
claimed = ""
unlocks = ["DC", "UT", "VA"]

[pieces.json_api]
