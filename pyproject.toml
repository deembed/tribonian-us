[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tribonian-us"
version = "0.1.0"
description = "Federal law (US Code, cases, pending Supreme Court dockets) as dense reMarkable PDFs and linked Obsidian notes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Distro packages work too: sudo apt install python3-lxml python3-numpy python3-scipy python3-igraph
# Non-Python tools (pdflatex with XCharter/tcolorbox/ulem, pdftotext, secret-tool, rmapi,
# lbzip2) are listed in README.md; `tribonian check` says which are missing.
dependencies = ["lxml", "numpy", "scipy", "igraph", "tomli; python_version < '3.11'"]   # tomli: state_formulas.toml on 3.10

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tribonian = "tribonian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tribonian = ["data/*.json", "data/*.toml", "data/uslm/*", "data/formulas/*.toml"]
