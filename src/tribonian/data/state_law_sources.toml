# state_law_sources.toml -- where each state's current law is published (statutes, regulations, constitution)
#
# Read by the fetch commands (scope-scotus-law.md §3) and by `tribonian check`. One table per
# jurisdiction, keyed by postal code, with three sub-tables:
#   statutes, regulations: title, cite (the forms courts use), url, publisher, official, format, bulk, terms
#   constitution:          url, format
#   notes.text:            what a downloader must know
#   fallback:              a third-party mirror (provider, covers, current_through, url, api); see the end
#
# Researched 2026-10-25 from the states' own sites, search results and the American Association of
# Law Libraries (AALL) "State Online Legal Information" pages. "unverified" means the research could
# not confirm the field; never build a URL from one. CourtListener has no statutes, so this file is
# ours to keep. Re-check a state before relying on it: sites move (PA retired legis.state.pa.us in
# Jan 2026; DE and MD moved their regulations in 2025-26).
#
# Machine-readable sources found (prefer these over crawling):
#   DC  code: GitHub XML/HTML (dccouncil/law-xml)       MD  COMAR: GitHub XML (maryland-dsd/law-xml-codified)
#   NJ  statutes: bulk zips (pub.njleg.gov/statutes/)   NY  laws: Open Legislation JSON API (key)
#   TX  statutes: per-code zips (Download.aspx)          UT  code + constitution: XML API (token)
#   VA  code, admin code, constitution: JSON/XML API, CSV  CO  C.R.S.: per-title htm/pdf/docx + zips
#   IL  ILCS: FTP static HTML; admin code FTP (robots)  AL  admin code: per-chapter API
#   WA  RCW/WAC: yearly archive directory listings       IA  official PDF volumes

[meta]
checked = "2026-10-25"
schema = 1

