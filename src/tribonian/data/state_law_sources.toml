publisher = "Office of Administrative Law, hosted by Barclays/Thomson Reuters (Westlaw)"
official = "yes (qualified) — OAL: a free online version of the Official CCR; no UELMA authentication"
format = "html only (Westlaw government site, cookies; opaque GUID document ids)"
bulk = "none — print via Barclays; a 2021 records request for XML was refused"
terms = "Thomson Reuters terms: no use that could overburden or impair the site; scraping effectively restricted"
[CA.constitution]
