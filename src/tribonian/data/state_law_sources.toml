format = "html (same viewer); presence in pubinfo as code CONS unverified"
[CA.notes]
text = "Use pubinfo, not the viewer: pubinfo_load.zip + pubinfo_YYYY.zip (odd session start year), then daily deltas. Section text is in .lob files referenced from LAW_SECTION_TBL (mapping undocumented: read the load SQL). CCR has no bulk path: low priority or a mirror."

