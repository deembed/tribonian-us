# MO.toml -- Missouri: Revised Statutes (MO.rsmo) and Constitution (MO.const), from the Revisor of Statutes
# (revisor.mo.gov).
#
# Site layout (from the probes, round 4):
#   Home.aspx                         links OneChapter.aspx?chapter=N for all 468 chapters (plain numbers)
#   OneChapter.aspx?chapter=N         the chapter's table of contents only
#   OneChapter.aspx?chapter=N&idx=v   "View entire chapter": a 2-second meta-refresh "Loading..." stub that
#                                     redirects to ViewChapter.aspx?chapter=N -- so fetch ViewChapter directly
#   ViewChapter.aspx?chapter=I&constit=y   the whole constitution article (probed: 39 sections, all text)
#   PageSelect.aspx?section=1.010&bid=42   one section (same markup as the chapter view; not used)
#
# Markup (identical for statutes and constitution). The page embeds a second <body lang="EN-US"> inside the
# content div; everything outside div.lr-fl-l-all (the first one) is site furniture. Per section:
#   <div class="norm">
#     <p class="norm"><span class="bold">1.010.  Heading — more heading. — </span>1.  Text ...</p>
#     <p class="norm">  2.  Text ...</p>                         law text, one <p> per numbered paragraph
#     <div class="foot">                                          the footnotes
#       <p class="" title="Footnotes follow">--------</p>         a divider (soft hyphens + dashes)
#       <p class="norm">(RSMo 1939 § 645, A.L. 1957 p. 587)</p>  history (statutes) / "Source: ..." (constitution)
#       <p class="norm">Prior revisions: 1929 § 645 ...</p>
#       <p class="norm">(1953) Case note ...</p>                  annotations, one per case
#     </div>
#   </div>
#   <p style="...darkgreen...">----------------- I Section 1 2/27/1945 -----------------</p>   effective-date line
# There are no title/chapter/article headings in the content: each file is wrapped in one level (wrap).

[MO.rsmo]
name    = "Revised Statutes of Missouri"
doc     = "/us-mo/rsmo"                      # /us-mo/rsmo/s1.010/1  (section numbers are unique statewide)
wrap    = { tag = "chapter", id = "ch{item}" }   # the chapter view has no chapter heading of its own
fetch   = "template"
url     = "https://revisor.mo.gov/main/ViewChapter.aspx?chapter={item}"
edition = "current"                          # the site shows the text in force (sections effective 8/28/2026 included)
item    = "%d"                               # chapter=1, chapter=143 (no padding)
file    = "chapter-{item}.htm"               # law/mo/rsmo/chapter-1.htm
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "(c) Missouri Legislature, all rights reserved; Terms of Use 'TBD' (state_law_sources.toml)"

[MO.rsmo.html]
root     = "div.lr-fl-l-all"                 # the first one is the content column (later ones are page footers)
blocks   = ["p"]                             # p.norm law text and notes, the divider p, the effective-date p
headings = []                                # no container headings on the page
opening  = ["span.bold"]                     # "1.010.  Heading. — "
# A flush-left run after numbered paragraphs ("shall be subject to a civil penalty ...", 1.470) is set as
# <p class="tiny">&shy;<p>&shy;</p>text</p>: the nested <p> closes the outer one, leaving the text bare in
# div.norm. loose makes that bare run a block of its own.
loose    = ["div.norm"]

[MO.rsmo.ladder]
# RSMo: 1. subsection, (1) subdivision, (a) paragraph, a. subparagraph
types = ["num.", "num", "lower", "lower."]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[MO.rsmo.sections]
# The heading keeps its trailing " —" (the dash separating it from the text is part of the bold run)
match = '^(?P<num>\d+\.\d+[A-Z]?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"
decimal = false                              # the chapter view lists 1.1001..1.1010 after 1.901 (whole-number order),
                                             # though the chapter TOC lists them after 1.100 (decimal order)

[MO.rsmo.notes]
# Everything after the divider is notes to the next section. Rule order matters (first match wins).
note          = [{ match = '^-{4,}$', topic = "footnotes" },                    # the "--------" divider opening div.foot
                 { match = '^\(\d{4}\)', topic = "annotation" }]                # "(1953) Case ..." one per case
# "(RSMo 1939 § 645, ...)", "(Adopted November 3, 1992)" / "Source: Const. of 1875" -- a parenthesis whose
# content is not a short label: law text "(1) The right ..." / "(a)" / "(iv)" and case notes "(1953)" are excluded
sourceCredit  = ['^\((?![^)\s]{1,4}\))', '^Source:']
editorialNote = [{ match = '^Prior revisions:', topic = "priorRevisions" },
                 { match = '^-{5,}\s.*\s-{5,}$', topic = "effectiveDate" }]    # "----- 1.010 8/28/2015 -----" after each section

# ---------------------------------------------------------------- Constitution of Missouri (1945)
[MO.const]
inherit = "MO.rsmo"
name    = "Constitution of Missouri"
doc     = "/us-mo/const"
wrap    = { tag = "article", id = "a{item}", rebase = true }  # /us-mo/const/aI/s1: section numbers restart per article
url     = "https://revisor.mo.gov/main/ViewChapter.aspx?chapter={item}&constit=y"
item    = ""                                 # roman article numbers, used as given
items   = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV"]
file    = "article-{item}.htm"
dir     = "const"

[MO.const.ladder]
types = ["num.", "num", "lower", "lower."]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[MO.const.sections]
# "I Section 1.  Source of political power — ... — " ; numbers may carry a letter: "Section 8(a)", "Section 39(b)"
match = '^(?P<art>[IVXL]+)\s+Section\s+(?P<num>\d+(?:\(?[a-z]\)?)?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"                              # section ids move under the article via wrap.rebase
decimal = false
