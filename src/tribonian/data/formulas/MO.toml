[MO.rsmo.html]
root     = "div.lr-fl-l-all"                 # the first one is the content column (later ones are page footers)
blocks   = ["p"]                             # p.norm law text and notes, the divider p, the effective-date p
headings = []                                # no container headings on the page
opening  = ["span.bold"]                     # "1.010.  Heading. — "
# A flush-left run after numbered paragraphs ("shall be subject to a civil penalty ...", 1.470) is set as
# <p class="tiny">&shy;<p>&shy;</p>text</p>: the nested <p> closes the outer one, leaving the text bare in
# div.norm. loose makes that bare run a block of its own.
loose    = ["div.norm"]

[MO.rsmo.ladder]
# RSMo: 1. subsection, (1) subdivision, (a) paragraph, a. subparagraph
types = ["num.", "num", "lower", "lower."]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[MO.rsmo.sections]
# The heading keeps its trailing " —" (the dash separating it from the text is part of the bold run)
match = '^(?P<num>\d+\.\d+[A-Z]?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"
decimal = false                              # the chapter view lists 1.1001..1.1010 after 1.901 (whole-number order),
                                             # though the chapter TOC lists them after 1.100 (decimal order)

[MO.rsmo.notes]
# Everything after the divider is notes to the next section. Rule order matters (first match wins).
note          = [{ match = '^-{4,}$', topic = "footnotes" },                    # the "--------" divider opening div.foot
                 { match = '^\(\d{4}\)', topic = "annotation" }]                # "(1953) Case ..." one per case
# "(RSMo 1939 § 645, ...)", "(Adopted November 3, 1992)" / "Source: Const. of 1875" -- a parenthesis whose
# content is not a short label: law text "(1) The right ..." / "(a)" / "(iv)" and case notes "(1953)" are excluded
sourceCredit  = ['^\((?![^)\s]{1,4}\))', '^Source:']
editorialNote = [{ match = '^Prior revisions:', topic = "priorRevisions" },
                 { match = '^-{5,}\s.*\s-{5,}$', topic = "effectiveDate" }]    # "----- 1.010 8/28/2015 -----" after each section

[MO.rsmo.cite]
# "Mo. Rev. Stat. § 565.020 (2016)", "RSMo § 565.020", and Missouri's own order: "section 565.020.1, RSMo 2016"
# (the code after the number; ".1" after the section is its subsection, written with a dot)
full    = ['Mo\.\s?Rev\.\s?Stat\.', 'Mo\.\s?Ann\.\s?Stat\.', 'V\.\s?A\.\s?M\.\s?S\.', 'RSMo\.?', 'Revised\s+Statutes\s+of\s+Missouri']
after   = ['(?:§§?|[Ss]ections?)\s*{section}(?:\.\d+)?(?:\s?\([A-Za-z0-9]{1,4}\))*,?\s*(?:RSMo|Mo\.\s?Rev\.\s?Stat\.)']
section = '\d+\.\d+'
item    = ['^(\d+)\.', '{1}']                        # 565.020 -> chapter 565
label   = "Mo. Rev. Stat. § {sec}"
examples = [["Mo. Rev. Stat. § 1.010 (2016)", "mo-rsmo:1.010", "Mo. Rev. Stat. § 1.010"],
            ["section 701.010.1, RSMo 2016", "mo-rsmo:701.010"],
            ["§ 565.020, RSMo Supp. 2023", "mo-rsmo:565.020"],
            ["RSMo § 701.015", "mo-rsmo:701.015"]]

# ---------------------------------------------------------------- Constitution of Missouri (1945)
[MO.const]
inherit = "MO.rsmo"
name    = "Constitution of Missouri"
doc     = "/us-mo/const"
wrap    = { tag = "article", id = "a{item}", rebase = true }  # /us-mo/const/aI/s1: section numbers restart per article
url     = "https://revisor.mo.gov/main/ViewChapter.aspx?chapter={item}&constit=y"
item    = ""                                 # roman article numbers, used as given
items   = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV"]
file    = "article-{item}.htm"
dir     = "const"

# catalog: every item (title/chapter/article) this code has, from the publisher's index (14) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV"
]

[MO.const.ladder]
types = ["num.", "num", "lower", "lower."]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[MO.const.sections]
# "I Section 1.  Source of political power — ... — " ; numbers may carry a letter: "Section 8(a)", "Section 39(b)"
match = '^(?P<art>[IVXL]+)\s+Section\s+(?P<num>\d+(?:\(?[a-z]\)?)?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"                              # section ids move under the article via wrap.rebase
decimal = false

[MO.const.cite]
full    = ['Mo\.\s?Const\.?', 'Missouri\s+Constitution', 'Constitution\s+of\s+Missouri']
# the items are the article's Roman numeral (I ... XIV) but keys hold it in Arabic: "{roman}" is not offered to
# item rules yet (statecites.Table.item_of gives only the cite's own fields), so this names no item until it is
item    = "{roman}"
label   = "Mo. Const. art. {roman}[, § {sec}]"
examples = [["Mo. Const. art. I, § 10", "mo-const:art-1:10", "Mo. Const. art. I, § 10"],
            ["Mo. Const. art. VIII, § 3", "mo-const:art-8:3"]]
