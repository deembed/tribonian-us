# MO.toml -- Missouri: Revised Statutes (MO.rsmo) and Constitution (MO.const), from the Revisor of Statutes
# (revisor.mo.gov).
#
# Site layout (from the probes, round 4):
#   Home.aspx                         links OneChapter.aspx?chapter=N for all 468 chapters (plain numbers)
#   OneChapter.aspx?chapter=N         the chapter's table of contents only
#   OneChapter.aspx?chapter=N&idx=v   "View entire chapter": a 2-second meta-refresh "Loading..." stub that
#                                     redirects to ViewChapter.aspx?chapter=N -- so fetch ViewChapter directly
#   ViewChapter.aspx?chapter=I&constit=y   the whole constitution article (probed: 39 sections, all text)
#   PageSelect.aspx?section=1.010&bid=42   one section (same markup as the chapter view; not used)
#
# Markup (identical for statutes and constitution). The page embeds a second <body lang="EN-US"> inside the
# content div; everything outside div.lr-fl-l-all (the first one) is site furniture. Per section:
#   <div class="norm">
#     <p class="norm"><span class="bold">1.010.  Heading — more heading. — </span>1.  Text ...</p>
#     <p class="norm">  2.  Text ...</p>                         law text, one <p> per numbered paragraph
#     <div class="foot">                                          the footnotes
#       <p class="" title="Footnotes follow">--------</p>         a divider (soft hyphens + dashes)
#       <p class="norm">(RSMo 1939 § 645, A.L. 1957 p. 587)</p>  history (statutes) / "Source: ..." (constitution)
#       <p class="norm">Prior revisions: 1929 § 645 ...</p>
#       <p class="norm">(1953) Case note ...</p>                  annotations, one per case
#     </div>
#   </div>
#   <p style="...darkgreen...">----------------- I Section 1 2/27/1945 -----------------</p>   effective-date line
# There are no title/chapter/article headings in the content: each file is wrapped in one level (wrap).

[MO.rsmo]
name    = "Revised Statutes of Missouri"
doc     = "/us-mo/rsmo"                      # /us-mo/rsmo/s1.010/1  (section numbers are unique statewide)
wrap    = { tag = "chapter", id = "ch{item}" }   # the chapter view has no chapter heading of its own
fetch   = "template"
url     = "https://revisor.mo.gov/main/ViewChapter.aspx?chapter={item}"
edition = "current"                          # the site shows the text in force (sections effective 8/28/2026 included)
item    = "%d"                               # chapter=1, chapter=143 (no padding)
file    = "chapter-{item}.htm"               # law/mo/rsmo/chapter-1.htm
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "(c) Missouri Legislature, all rights reserved; Terms of Use 'TBD' (state_law_sources.toml)"

