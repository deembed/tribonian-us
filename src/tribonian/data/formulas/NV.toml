[NV.nrs.html]
blocks   = ["p"]
# p.COHead2 / p.COHead4 head groups of the table of contents; p.DocHeading / p.DocHeading2 are the same
# words heading the law. All four are headings: before the first section each becomes a cross heading at
# chapter level between the toc notes. (They cannot be put in the toc by text: the TOC head and the law
# head read the same, and toc matching runs before the heading test.)
headings = ["p.MsoTitle", "p.Chapter", "p.COHead2", "p.COHead4", "p.DocHeading", "p.DocHeading2"]
opening  = ["span.Empty", "span.Section", "span.Leadline"]   # "NRS 1.010  Courts of justice."
# Statutory forms (NRS 162A.620 ...) are p.SectBody set off only by an inline left margin; their own
# numbering (1. 2. ... A. B.) restarts, so they are taken whole, labels not read. Law text has no margin style.
verbatim = ["p.SectBody[style*=margin-left]"]
drop     = ["p.MsoNormal"]                   # the revision stamp "[Rev. 9/9/2026 ...--2026R1]", set in white (invisible)

[NV.nrs.ladder]
types = ["num.", "lower", "num", "roman_upper", "upper"]     # 1. (a) (1) (I) (A)
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[NV.nrs.containers]
# "CHAPTER 1 - JUDICIAL DEPARTMENT GENERALLY": heading = "self" with the heading group spanning the whole
# line (the line is the heading, num is caught inside it, the num text is empty). With heading = "next" the
# TOC's first group head would be taken as the chapter's name.
# The TITLE line (p.MsoTitle) is NOT a container: only a title's first chapter page carries it (NRS-001 has
# "TITLE 1 - ...", NRS-162A has none), so a title container would give the same section two different
# identifiers depending on its chapter. It stays as a cross heading ahead of the chapter; sections hang off
# the code root, as cited: /us-nv/nrs/s1.010.
chapter = { match = '^(?P<heading>CHAPTER\s+(?P<num>\d+[A-Z]?)\s+[-–—]\s+.*)$', tag = "chapter", rank = 2, id = "ch{num}", heading = "self" }

[NV.nrs.sections]
match = '^NRS\s+(?P<num>\d+[A-Z]?\.\d+[A-Z]?)\s+(?P<heading>.*)$'
bold  = true                                 # matched against the opening run (the three spans)
scope = "title"                              # no title container, so /us-nv/nrs/s1.010 (numbers are unique code-wide)
# table of contents lines (p.COLeadline) and the p.J-Dash rule after them; container level only
toc   = ['^NRS\s+\d+[A-Z]?\.\d', '^_+$']
# A future version repeats the section number with "[Effective ...]" at the end of the bold leadline (NRS 1.510)
versions = '\[Effective '                 # searched in the heading too: NRS 1.510's second copy is a version
decimal  = true                              # 1.4253 < 1.426 < 1.43: the part after the point is a decimal fraction

[NV.nrs.notes]
sourceCredit = { class = "SourceNote" }      # "[1:19:1865; ...]—(NRS A 2013, 1709)" / "(Added to NRS by ...)"
# a group heading after a section's history line ends the section and its note; it stands as a cross heading
close = [{ class = "DocHeading" }, { class = "DocHeading2" }]
editorialNote = { class = "TocNote" }        # "NOTE: Sections 2 to 18 ... have been codified as NRS 162C.010 ..." (after the TOC)

# ---------------------------------------------------------------- Constitution of the State of Nevada
# One page, Const/NVConst.html (same Word template as the NRS). Order: an editor's preface, a list of
# articles (p.ConstPrefTOC), then p.DocHeading blocks for [PRELIMINARY ACTION.], ORDINANCE, PREAMBLE.,
# "ARTICLE. 1. - Declaration of Rights." ... "ARTICLE XVIII - [Right of Suffrage]", the [CONGRESSIONAL TERM
# LIMITS ACT OF 1996.] (SECTION A. ... I., p.ConstConLeadline), and the [ELECTION ORDINANCE.] with its own
# ORDINANCE. Each article opens with its section list (p.ConstSecTOC). Unlike the NRS, a section number is
# plain text, spelled three ways: "Section. 1.", "Sec: 2.", "Sec. 7." -- only the leadline is marked
# (span.Leadline), and a few sections (art. 4 sec. 39) wrap the number in span.Section.
[NV.const]
name    = "Constitution of the State of Nevada"
doc     = "/us-nv/const"                     # /us-nv/const/a1/s8A, /us-nv/const/a4/s39/1
fetch   = "template"
url     = "https://www.leg.state.nv.us/Const/{item}.html"
edition = "2026-04-15"                       # the page stamp: "[Rev. 4/15/2026 ...--2025]"
items   = ["NVConst"]                        # always the one page
file    = "{item}.html"
encoding = "cp1252"
family  = "html-paragraphs"

[NV.const.html]
blocks   = ["p"]
headings = ["p.MsoTitle", "p.DocHeading", "p.ConstConLeadline", "p.ConstH2csc"]
opening  = []
drop     = ["p.MsoNormal"]                   # the white revision stamp, as in the NRS

[NV.const.ladder]
types = ["num.", "lower", "num", "roman_upper"]              # 1. (a) (1) (I), as the NRS (art. 4 sec. 39)
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[NV.const.containers]
# Article numbers are arabic except XVIII (repealed): a{num_arabic} -> a18. Unnumbered parts get fixed ids.
# "ORDINANCE" (1864, slavery and public lands) and the election ordinance's own "ORDINANCE." differ by the
# period; the second sits inside [ELECTION ORDINANCE.] at a lower rank.
title     = { match = '^(?P<heading>THE CONSTITUTION OF THE STATE OF NEVADA)$', tag = "title", rank = 1, id = "", heading = "self" }
prelim    = { match = '^(?P<heading>\[PRELIMINARY ACTION\.\])$', tag = "level", rank = 2, id = "preliminary", heading = "self" }
ordinance = { match = '^(?P<heading>ORDINANCE)$', tag = "level", rank = 2, id = "ordinance", heading = "self" }
preamble  = { match = '^(?P<heading>PREAMBLE\.)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article   = { match = '^(?P<heading>ARTICLE\.?\s+(?P<num>\d+|[IVXL]+)\.?\s+-\s+.*)$', tag = "article", rank = 2, id = "a{num_arabic}", heading = "self" }
termlim   = { match = '^(?P<heading>\[CONGRESSIONAL TERM LIMITS ACT OF 1996\.\])$', tag = "level", rank = 2, id = "termlimits", heading = "self" }
tl_sec    = { match = '^(?P<heading>SECTION\s+(?P<num>[A-Z])\.\s+.*)$', tag = "level", rank = 3, id = "s{num}", heading = "self" }
election  = { match = '^(?P<heading>\[ELECTION ORDINANCE\.\])$', tag = "level", rank = 2, id = "election", heading = "self" }
el_ord    = { match = '^(?P<heading>ORDINANCE\.)$', tag = "level", rank = 3, id = "ordinance", heading = "self" }

[NV.const.sections]
# The number is plain text, spelled "Section. 1.", "Sec: 2.", "Sec. 7.", "Section 1." (art. 4 sec. 39 wraps
# it in span.Section; same text). The heading is the leadline: up to the first ". " -- with one bracketed
# note allowed after it ("Rights of foreigners. [Repealed in 1924.]", "[Effective ...]"). No "$": the rest
# of the paragraph is the section's body (bold = false keeps it).
# Editorial brackets around supplied numbers ("[Sec. 36.]", "Sec. [3].", "Sec. 37[A].") and one spelled-out
# number ("Section Ten.", art. 11) are allowed; "37[A]" and "Ten" stay as written in the identifier for now.
match = '^\[?(?:Section|Sec)[.:]?\s*\[?(?P<num>\d+(?:\[[A-Z]\]|[A-Z])?|Ten)\]?\.\]?\s+(?P<heading>[^\[]*?\.(?:\s*\[[^\]]*\])?)(?=\s|$)'
bold  = false
class = "SectBody"                           # the article TOC lines (p.ConstSecTOC) read the same: never sections
scope = "container"                          # numbers restart per article: /us-nv/const/a1/s1
# each article's section list (p.ConstSecTOC: "Sec. 1. Inalienable rights.", "2. Purpose of ..."), one toc note
# (numbers as the sections spell them: "[36.]", "37[A].") and the front list of articles (p.ConstPrefTOC:
# "Article. 1. Declaration of Rights.", "XVIII. [Right of Suffrage.] Repealed in 1992.", "[Election Ordinance.]")
toc   = ['^(?:Sec\.\s+)?\[?\d+(?:\[?[A-Z]\]?)?\.?\]?\.?\s', '^(?:Article\.\s+)?(?:[IVXL]+|\d+)\.\s', '^\[[A-Z][A-Za-z ]+\.\]$',
         '^(?:Ordinance|Preamble)\.$']
versions = '\[Effective '                    # the Ordinance and some sections come in two versions

[NV.const.notes]
sourceCredit = [{ class = "ConstSourceNote" },   # "[Amended in 1956. Proposed and passed by ...]"
                { class = "ConstConH2" }]        # the term-limits initiative's "[Added in 1998. ...]"
