# ---------------------------------------------------------------- Iowa
# Publisher: Iowa Legislative Services Agency, https://www.legis.iowa.gov/law/iowaCode
# OFFICIAL vs UNOFFICIAL (law/officialAndUnofficialEditions; Iowa Code ch 2B, UELMA):
#   - the 8 Iowa Code volume PDFs (/docs/publications/ICV/1594653.pdf ... 1594660.pdf) are the authenticated
#     Official Version;
#   - per-chapter PDF (/docs/code/2026/<ch>.pdf), accessible PDF (/docs/publications/ICC/2026/attachments/<ch>_ADA.pdf),
#     RTF (/docs/code/2026/<ch>.rtf) and XML (/docs/publications/ICC/2026/attachments/<ch>_slim.xml) are UNOFFICIAL
#     copies of the same text (same Arbortext publishing run).
# Chosen: per-chapter PDF (one small file per chapter, ~1,600 chapters, vs 8 volumes of ~2,000 pages each).
# NOTE: the chapter pages also link a per-chapter XML ("_slim.xml"); if its structure is clean, that is a better
# route than PDF (no layout guessing) -- probed in IA.txt, see IA.status.md.
#
# pdftotext -layout of a chapter PDF (2026, docs/code/1.pdf):
#   running head  "1          SOVEREIGNTY AND JURISDICTION OF THE STATE, §1.4"   (odd pages: page no. first)
#                 "§1.5, SOVEREIGNTY AND JURISDICTION OF THE STATE          2"   (even pages: page no. last)
#   footer        "Tue Dec 09 22:34:56 2025          Iowa Code 2026, Chapter 1 (25, 0)"
#   "CHAPTER 1" and its name centred; then the chapter analysis in TWO columns (number, catchline);
#   each paragraph's first line indented 1-3 spaces, its continuation lines at column 0 -> join = "indent";
#   section "  1.1 State boundaries." on its own line; body; then history: "[C51, §1; R60, ...]" (code
#   derivation), "2009 Acts, ch 41, §1" (amending acts), "Referred to in §1.2", "See Act of Congress ...".

# ================================================================ IA.code: the chosen route -- per-chapter XML
# /docs/publications/ICC/<year>/attachments/<ch>_slim.xml: the same Arbortext publication as the PDFs, as XML with
# real structure (slim:Level/Section, div.subsection/letteredPara/subpara/subparaDiv with span.identifier,
# div.history, div.footnotes, slim:TOC). UNOFFICIAL like the per-chapter PDF (the official version is the 8
# authenticated volume PDFs). Chosen over PDF: no layout guessing; on the PDF route chapter 321 had 91 ladder
# anomalies and 14 numbering flags, and every chapter's two-column analysis came out interleaved.
# Not in the XML: the "Referred to in §..." lines the PDF prints after a section (an editorial index, not law).
# Shared transform "iowa-xml": src/tribonian/uslm/transforms/iowa_xml.py (to_html(raw, formula) -> HTML blocks;
# docstring = spec; it checks every character of the TOC + Body is in its output).
[IA.code]
name    = "Iowa Code"
doc     = "/us-ia/code"                       # one USLM file per chapter (law/ia/uslm/code/<ch>_slim.xml):
                                              # <chapter /us-ia/code/ch22>, sections /us-ia/code/s22.2/4/a
                                              # (Iowa section numbers are unique code-wide: Iowa Code §22.2)
fetch   = "template"
url     = "https://www.legis.iowa.gov/docs/publications/ICC/{edition}/attachments/{item}_slim.xml"
edition = 2026
file    = "{item}_slim.xml"
transform = "iowa-xml"                        # transforms/iowa_xml.py
encoding = "utf-8"
family  = "html-paragraphs"
official = "unofficial (per-chapter XML); the official version is the 8 authenticated volume PDFs"
terms   = "disclaimer https://www.legis.iowa.gov/law/disclaimer"

