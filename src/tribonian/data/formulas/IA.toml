[IA.code.html]
blocks   = ["p"]
headings = ["p.level", "p.levelname"]         # "CHAPTER 22" / its name (and any nested Level the same way)
opening  = []
indent_css = { unit = 10, base = 0 }          # the transform writes margin-left = 10pt per unit depth

[IA.code.ladder]
# printed labels: 1.  a.  (1)  (a)  (i)  (A) -- Iowa: subsection, paragraph, subparagraph, subparagraph division,
# subparagraph subdivision, subparagraph part (e.g. §321.105A(2)(c)(3)(a)(ii)(A))
types = ["num.", "lower.", "num", "lower", "roman_lower", "upper"]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause", "item"]

[IA.code.containers]
chapter    = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]*)$', tag = "chapter", rank = 1, id = "ch{num}" }   # sections hang off the code: /us-ia/code/s321.1 (Iowa Code §321.1)
subchapter = { match = '^SUBCHAPTER\s+(?P<num>[IVXL]+[A-Z]?)$', tag = "subchapter", rank = 2, id = "sch{num}" }
part       = { match = '^PART\s+(?P<num>\d+[A-Z]?)$', tag = "part", rank = 3, id = "pt{num}" }
division   = { match = '^DIVISION\s+(?P<num>[IVXL]+[A-Z]?)$', tag = "division", rank = 2, id = "d{num}" }

[IA.code.sections]
match = '^(?P<num>\d+[A-Z]*\.\d+[A-Z]*)(?:\s+(?P<heading>.+))?$'   # p.sec "22.13A Personnel settlement agreements — ...";
                                              # a reserved section has no headnote: "321.75" then "Reserved."
class = "sec"                                 # only the transform's section lines (the TOC lines look the same)
bold  = false
scope = "title"
toc   = ['^\d+[A-Z]*\.\d+[A-Z]*\s']           # p.toc lines (slim:TOC) before the first section: one <toc> note

[IA.code.notes]
sourceCredit  = { class = "hist" }            # "[C71, ... §68A.1]", "84 Acts, ch 1145, §1", "C85, §22.1"
editorialNote = [{ class = "fn", topic = "footnote" }]   # effective/repeal notes, "NEW subsections 76 and 77"

[IA.code.cite]
# how cases cite it (statecites.py): "Iowa Code § 707.2" (Bluebook), "Iowa Code section 321J.2(1)" (Iowa courts),
# "I.C.A. § 707.2" (older, federal). Iowa section numbers are unique code-wide; the chapter is the item.
full    = ['Iowa\s+Code(?:\s+Ann\.)?', 'I\.\s?C\.\s?A\.']
section = '\d+[A-Z]{0,2}\.\d+[A-Z]{0,2}'           # 707.2, 321J.2, 714.21A
item    = ['^(\d+[A-Z]*)\.', '{1}']                # 321J.2 -> chapter 321J
also    = ["codepdf"]                              # the chapter-PDF route builds the same chapters
label   = "Iowa Code § {sec}"
examples = [["Iowa Code § 714.1 (2019)", "ia-code:714.1", "Iowa Code § 714.1"],
            ["Iowa Code section 321.2(1)", "ia-code:321.2"],
            ["I.C.A. § 22.2", "ia-code:22.2"]]

# ================================================================ IA.codepdf: fallback, per-chapter PDF
[IA.codepdf]
name    = "Iowa Code (chapter PDF route)"
doc     = "/us-ia/code"                       # /us-ia/code/ch1/s1.4/2
fetch   = "template"
url     = "https://www.legis.iowa.gov/docs/code/{edition}/{item}.pdf"
edition = 2026                                # the 2026 Iowa Code (year folder; /docs/code/<ch>.pdf = current)
file    = "{item}.pdf"
dir     = "code"                              # same folder and identifiers as IA.code (one or the other)
title_id = ['^(.*)$', 'ch\1']                 # one USLM file per chapter: 1 -> ch1, 10A -> ch10A
transform = "pdf-text"
family  = "html-paragraphs"
official = "unofficial (per-chapter PDF); the official version is the 8 authenticated volume PDFs"
terms   = "disclaimer https://www.legis.iowa.gov/law/disclaimer"

[IA.codepdf.pdf]
drop = [
  '^\s*\d+\s{3,}\S.*,\s+§\s?\d+[A-Z]*\.\S+\s*$',          # odd-page running head: "3     NAME, §1.15"
  '^\s*§\s?\d+[A-Z]*\.\S+,\s+.*\S\s{3,}\d+\s*$',          # even-page running head: "§1.5, NAME     2"
  '^\s*\w{3} \w{3} \d\d \d\d:\d\d:\d\d \d{4}\s+Iowa Code \d{4}, Chapter ',   # print-date footer
]
join   = "indent"                             # first lines indented, continuation lines flush left
# no `center`: the transform calls any line indented >= center a heading, and the analysis's right column (col ~74)
# would count; chapter/subchapter lines are found by text instead (containers any = true)
# no `starts`: the chapter analysis rows are flush left, so they join into multi-entry paragraphs (kept in the
# <toc> note), while every real section line is indented and opens its own paragraph by indentation

[IA.codepdf.html]
blocks   = ["p"]
headings = ["p:centered"]
opening  = []                                 # no bold in PDF text

[IA.codepdf.ladder]
# 1.  a.  (1)  (a)  (i): "1. The United States ...", "a. ...", "(1) ..."
types = ["num.", "lower.", "num", "lower", "roman_lower"]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[IA.codepdf.containers]
chapter    = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]*)$', tag = "chapter", rank = 1, id = "", any = true }   # the file is already /us-ia/code/ch<N> (title_id)
subchapter = { match = '^SUBCHAPTER\s+(?P<num>[IVXL]+[A-Z]?)$', tag = "subchapter", rank = 2, id = "sch{num}", any = true }
part       = { match = '^PART\s+(?P<num>\d+[A-Z]?)$', tag = "part", rank = 3, id = "pt{num}", any = true }

[IA.codepdf.sections]
# "1.15A Criminal jurisdiction — Sac and Fox Indian settlement." -- the catchline is the whole paragraph.
# The chapter analysis (two columns) joins into paragraphs holding SEVERAL "n.n Catchline." entries; the
# lookahead refuses a second section number so those stay in the <toc> note.
match = '^(?P<num>\d+[A-Z]*\.\d+[A-Z]*)\s+(?P<heading>(?:(?!\s\d+[A-Z]*\.\d+[A-Z]*\s+[A-Z]).)+)$'
bold  = false
scope = "title"                               # /us-ia/code/ch1/s1.4
# chapter analysis lines (number + catchline, and the wrapped catchline fragments) before the first section
toc   = ['^\d+[A-Z]*\.\d+[A-Z]*\s', '^[a-z]', '^[A-Z][a-z]', '^—']

[IA.codepdf.notes]
sourceCredit  = ['^\[(?:C\d|R\d|S\d|CS|Rev|\d)', '^\d{2,4} Acts, ch ', '^\d{4} Acts, ', '^Code editor']
editorialNote = [{ match = '^Referred to in ', topic = "referredTo" },
                 { match = '^See ', topic = "crossReference" },
                 { match = '^(?:Section|Subsection|Paragraph|For) .*(?:amended|stricken|repealed|effective|applicability)', topic = "editorial" }]

# ================================================================ IA.const: Iowa Constitution, codified (PDF)
# https://www.legis.iowa.gov/law/statutory/constitution -> "Iowa Constitution - Codified" = /docs/publications/ICP/1518288.pdf
# (27 pages, Arbortext, as published in the Iowa Code; the page calls it an official legal publication under
# Iowa Code ch 2B / UELMA). Not ICNST/1022948.pdf: that is the 2019 republication notice + a revision-marked copy.
# No XML or HTML version found. Layout (pdftotext -layout): title + PREFACE, a two-column table of contents,
# "Preamble. WE THE PEOPLE ..." and "Boundaries. ...", then per article "ARTICLE I." / "BILL OF RIGHTS." centred,
# "Sec. 2. Political power. All political power ..." (catchline and text in one paragraph), notes after a section
# ("Amended by Amendment 45 (1998)", "Referred to in Iowa Code §729.1", "*In the original text ...").
# Running heads: "v   CONSTITUTION OF THE STATE OF IOWA (CODIFIED), ART. I, §10" / "ART. I, §10, CONSTITUTION ... vi".
[IA.const]
name    = "Constitution of the State of Iowa (codified)"
doc     = "/us-ia/const"                      # /us-ia/const/a1/s1A
fetch   = "template"
url     = "https://www.legis.iowa.gov/docs/publications/ICP/1518288.pdf"
items   = ["constitution"]                    # always the one file
file    = "{item}.pdf"
dir     = "const"
transform = "pdf-text"
family  = "html-paragraphs"
official = "official legal publication (Iowa Code ch 2B), as published in the Iowa Code"
terms   = "disclaimer https://www.legis.iowa.gov/law/disclaimer"

[IA.const.pdf]
drop = [
  '^\s*(?:[ivxlc]+\s+)?CONSTITUTION OF THE STATE OF IOWA \(CODIFIED\)(?:, ART\. [IVXL]+, §\S+)?(?:\s+[ivxlc]+)?\s*$',  # running heads
  '^\s*ART\. [IVXL]+, §\S+, CONSTITUTION OF THE STATE OF IOWA \(CODIFIED\)\s+[ivxlc]+\s*$',
]
join   = "indent"                             # first lines indented, continuation lines flush left
pages  = "4-"                                 # pages i-iii: the title, the editor's PREFACE and most of the table of
                                              # contents (editorial, not law). Skipped because the TOC prints the
                                              # division lines ("2ND. SCHOOL FUNDS AND SCHOOL LANDS.") word for word,
                                              # which would open parts there. Page iv starts with the TOC's tail,
                                              # then the Preamble.

[IA.const.html]
blocks   = ["p"]
headings = ["p:centered"]
opening  = []

[IA.const.ladder]
types = ["num.", "lower.", "num", "lower", "roman_lower", "upper"]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause", "item"]

[IA.const.containers]
# "ARTICLE I." alone on its line, its name ("BILL OF RIGHTS.") the next paragraph; TOC rows "ARTICLE I. — ..." differ
article = { match = '^ARTICLE\s+(?P<num>[IVXL]+)\.$', tag = "article", rank = 2, id = "a{num_arabic}", any = true }

# Articles III and IX are divided, and section numbers restart in each division:
# "1ST. THREE SEPARATE DEPARTMENTS ." / "2ND. LEGISLATIVE DEPARTMENT ." (art. III), "1ST. EDUCATION .**" (art. IX).
# The whole line is the heading (as NJ.consttxt's SECTION lines: heading = "self" keeps only the heading group).
part    = { match = '^(?P<heading>(?P<num>\d)(?:ST|ND|RD|TH)\.\s+[A-Z ,]+\s?\.\**)$', tag = "part", rank = 3, id = "pt{num}", any = true, heading = "self" }

[IA.const.sections]
# "Section 1. Rights of persons. All men ..." / "Sec. 1A. Right to keep and bear arms. The right ..." -- the
# catchline is the first sentence (catchlines have no inner period); the rest is the body
match = '^(?:Section\s+|Sec\.\s+|(?=Preamble\.|Boundaries\.))(?P<num>\d+[A-Z]?|Preamble|Boundaries)\.\s+(?P<heading>(?<=\d\.\s)[^.]+\.(?:\s\[\* \* \*\]\*)?|)\s*'
# "Preamble. WE THE PEOPLE ..." and "Boundaries. Beginning in ..." (before Article I) are units of their own:
# /us-ia/const/sPreamble, /us-ia/const/sBoundaries (no catchline: the lookbehind gives them an empty heading)
bold  = false
scope = "container"                           # numbers restart in every article (and art. III / IX division)
toc   = ['^(?:SEC\.\s+)?\d+[A-Z]?\.\s', '^ARTICLE\s+[IVXL]+\.\s+—', '^PREAMBLE', '^[A-Z][a-z]', '^[a-z—\[]']

[IA.const.notes]
editorialNote = [{ match = '^(?:Amended|Added|Repealed|Paragraph \d|Former|Subsection)\b', topic = "amendments" },
                 { match = '^(?:Referred to in|See )', topic = "crossReference" },
                 { match = '^(?:\*|This (?:proposition|provision|transitional))', topic = "footnote" }]


[IA.const.cite]
full    = ['Iowa\s+Const\.?', 'Iowa\s+Constitution']     # then "art. I, § 8"
label   = "Iowa Const. art. {roman}[, § {sec}]"
examples = [["Iowa Const. art. I, § 8", "ia-const:art-1:8", "Iowa Const. art. I, § 8"],
            ["Iowa Const. art. I, § 9", "ia-const:art-1:9"]]
