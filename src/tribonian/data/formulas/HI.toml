[HI.hrs.html]
root     = "div.WordSection1"                 # the law and its annotations; div#pageLinks is outside it
blocks   = ["p"]
headings = ["p:centered"]                     # align="center": DIVISION / TITLE / CHAPTER / chapter name / PART
opening  = ["b", "i"]                         # i: an italic "[Section repealed June 30, 2027. L 2024, c 213, §6.]" right
                                              # after the bold catchline joins the heading, so "(1)" starts the body (707-712.2)

[HI.hrs.ladder]
# HRS style (a)(1)(A)(i): 46-4 has (a)(1)(A)(i); the penal code starts at (1): 707-701 (1)(a)(i).
# A penal-code section may start at its second level, (a)(b) then (i)(ii) (707-753): level 2 also takes roman
types = [["lower", "num"], ["num", "roman_lower", "lower"], ["upper", "roman_lower"], ["roman_lower", "upper"], "roman_upper"]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[HI.hrs.containers]
# "CHAPTER 707" + name (head page) and "PART II.  CRIMINAL HOMICIDE" (first section page of the part) open
# containers that hold the following pages' sections ([HI.hrs] carry = true). DIVISION / TITLE lines stay
# cross headings: only a title's first chapter carries them. The file id is the chapter, so the container
# repeats it: /us-hi/hrs/ch707/ch707/pt2 (section ids stay /us-hi/hrs/ch707/s707-701).
chapter = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]?)$', tag = "chapter", rank = 3, id = "ch{num}", heading = "next" }
# parts the revisor added are bracketed and case varies: "[PART VI. CHILD ABUSE]", "[PART VII.] EXTORTION",
# "[Part viii.] labor trafficking" (shown upper-case by CSS); brackets stay in the num/heading text
# UCC (ch 490) parts are arabic, "PART 1.  GENERAL PROVISIONS", inside articles
part    = { match = '^\[?(?i:part)\s+(?P<num>[IVXLivxl]+[A-Z]?|\d+[A-Z]?)\.?\]?\s+(?P<heading>.+)$', tag = "part", rank = 5, id = "pt{num_arabic}" }
# articles (UCC ch 490, insurance ch 431): "ARTICLE 1." then the name line; a repealed former article reads
# "ARTICLE 1.  [OLD]" (holding only its "§§490:1-101 to 490:1-208 REPEALED." line) and gets its own id
article     = { match = '^ARTICLE\s+(?P<num>\d+[A-Z]?)\.$', tag = "article", rank = 4, id = "art{num}", heading = "next" }
article_old = { match = '^ARTICLE\s+(?P<num>\d+[A-Z]?)\.\s+\[OLD\]$', tag = "article", rank = 4, id = "art{num}-old", heading = "next" }

[HI.hrs.sections]
# "§1-1  Common law of the State; exceptions." / "§707-701.5  ..." / "§§707-730 to 707-738  ..." / "§§92-22, 23 REPEALED."
# "[§1-4.5]  Heading.": brackets mark a number the revisor assigned (kept in the num text)
# Insurance (431) and UCC (490) number article-sections with a colon: "§431:1-100.5", "§§490:1-101 to 490:1-208"
match = '^\[?§§?\s*(?P<num>\d+[A-Z]*(?::\d+[A-Z]*)?-\d+(?:\.\d+)?[A-Z]*(?:\s*(?:to|,|-|–)\s*(?:\d+[A-Z]*(?::\d+[A-Z]*)?-)?\d+(?:\.\d+)?[A-Z]*)?)\]?\s+(?P<heading>.*)$'
bold  = true
class = "RegularParagraphs"                   # not the bold "§707-701 Commentary:" lines in p.XNotes
scope = "title"
decimal = true                                # 1-4.5 after 1-4, before 1-5
# definitions sections ('"Emergency worker" means any: (1) ... (6)'): each definition is a group, so its own
# (1)(2)... list restarts under it (707-700); the definition paragraph stays text
group      = '^"(?P<num>[^"]+)"[,\s]'
group_id   = "def-{num}"
group_text = "text"

[HI.hrs.notes]
# every annotation group opens with a p.XNotesHeading line ("Case Notes", "Cross References", "COMMENTARY ON
# §707-701", ...); its p.XNotes items follow to the next section. The chapter head page's section list
# ("Section" / "Chapter" label, "Part I. ..." lines) is a toc note up to the first annotation or section.
note = [{ class = "XNotesHeading", topic = "annotation" },
        { match = '^(?:Section|Chapter|Part [IVXL]+[A-Z]?\.\s.*)$', topic = "toc" },
        { match = '^REPEALED\.', topic = "repealed" }]
# a former chapter's head page ("CHAPTER 329 [OLD]" / "NARCOTICS" / "REPEALED. L 1972, c 10, §7."): the
# REPEALED line is a note (the [OLD] heading does not open a chapter container: it stays a cross heading)
# the centered CHAPTER / PART line ends the open toc or annotation note (a title's first chapter head page
# lists the title's chapters, then heads its own chapter) and stands as a cross heading
close = [{ heading = true, match = '^(?:CHAPTER|ARTICLE|PART)\s' }]

