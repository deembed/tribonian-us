# HI.toml -- Hawaii Revised Statutes (HI.hrs) and the Constitution of the State of Hawaii (HI.const).
#
# HRS source: data.capitol.hawaii.gov/hrscurrent/ -- an open IIS directory tree, one Word-filtered .htm per
# section, no whole-chapter or print page:
#   /hrscurrent/                                 lists 14 volume folders Vol01_Ch0001-0042F ... Vol14_Ch0701-0853
#   /hrscurrent/<Vol>/                           lists chapter folders HRS0001/ HRS0021G/ ... and non-HRS folders
#                                                (01-USCON 02-HNP 03-ORG 04-ADM 05-CONST 06-HHCA: federal acts and
#                                                the constitution, reprinted in volume 1; not taken here)
#   /hrscurrent/<Vol>/HRS0707/                   lists HRS_0707-.htm (the chapter head) and one page per section:
#                                                HRS_0707-0701.htm (707-701), HRS_0707-0701_0005.htm (707-701.5);
#                                                a repealed range has one page per number (0723, 0724)
# Listings use upper-case <A HREF="...">. Per-section site: the CHAPTER is the item (one USLM file per chapter);
# the chapter folder sits under its volume folder, named by the ids table below (chapter -> volume).
# Chapter head page: centered <b> "CHAPTER 707" + name (the first chapter of a title is preceded by centered
# "DIVISION 1. GOVERNMENT" / "TITLE 1. GENERAL PROVISIONS" and the title's "Chapter" list), then the
# chapter's section list ("Section", "Part I.  General ...", "    707-700 Definitions ...", wrapped lines),
# then chapter-level annotations. The first section page of a part opens with centered "PART II.  CRIMINAL
# HOMICIDE". Section page: p.RegularParagraphs opening <b>"§707-701  Murder in the first degree."</b>, the
# paragraphs as p.RegularParagraphs / p.aPenalBlock / p.ASubparagraph / p.oneParagraph (labels in the text),
# the history "[L 1972, c 9, ...]" inline at the end of the last law paragraph; then annotations:
# p.XNotesHeading ("Cross References", "COMMENTARY ON §707-701", "Case Notes", ...) and p.XNotes items.
# div#pageLinks (Previous / volume / Next) is outside div.WordSection1.

[HI.hrs]
name    = "Hawaii Revised Statutes"
doc     = "/us-hi/hrs"                        # /us-hi/hrs/ch707/s707-701/1/a (section numbers unique statewide)
fetch   = "index"
item    = "%04d"                              # chapter 1 -> 0001, 21G -> 0021G (folder HRS0021G)
title_id = ['^0*(.+)$', 'ch\1']               # file 0707 -> /us-hi/hrs/ch707
index_file = "HRS{item}.html"                 # the chapter folder's listing
links   = 'HREF="(/hrscurrent/Vol\d+_[^"/]+/HRS\d{4}[A-Z]*/HRS_[^"/]+\.htm)"'   # head page + section pages, listing order
layers  = [ { name = "current", url = "https://data.capitol.hawaii.gov/hrscurrent/{id}/HRS{item}/" } ]
encoding = "utf-8"                            # <meta charset=utf-8> (Word "filtered" HTML)
family  = "html-paragraphs"
terms   = "none stated"
carry   = true                                # one page per section: chapter/part headings hold the following pages

