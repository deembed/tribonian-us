# ---------------------------------------------------------------- Constitution of the State of Hawaii
# lrb.hawaii.gov/constitution/: the whole constitution on one WordPress page (one request). Inside div.col:
# front matter (h2 title, adoption history, h3 "Revision Note" + blockquote, a linked table of contents of
# p > a article links and ol lists of section names), then h3 "Preamble", h4 "Federal Constitution Adopted",
# and per article h3 "Article I" / "ARTICLE VI" + h4 name. Each section: an all-caps p (its heading), then
# p "<strong>Section 1.</strong>&nbsp;&nbsp;text ... [Am Const Con 1978 ...]" (history inline at the end), more
# p / ol.wp-block-list paragraphs, then optional "Note: ..." / "Revision Note: ..." paragraphs (some running
# on into an unlabeled second paragraph) before the next heading. Bracketed numbers: "Section [24]." "[3.5]".
# (Alternative source: data.capitol.hawaii.gov/hrscurrent/Vol01_Ch0001-0042F/05-CONST/, the HRS volume-1
# reprint, not probed.)
[HI.const]
name    = "Constitution of the State of Hawaii"
doc     = "/us-hi/const"                      # /us-hi/const/tcurrent/a1/s7
fetch   = "template"
url     = "https://lrb.hawaii.gov/constitution/"
edition = "current"
item    = ""
items   = ["current"]                         # one document; the item only names the file and the id
file    = "constitution-{item}.html"
dir     = "const"
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "none stated"

# catalog: every item (title/chapter/article) this code has, from the publisher's index (1) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "current"
]

[HI.const.html]
root     = "div.col"                          # the page body; site header, menus, breadcrumb and footer are outside
blocks   = ["p", "li", "h2", "h3", "h4"]      # li: the ol.wp-block-list items (list numbers are CSS, not text)
headings = ["h2", "h3", "h4", "p.has-text-align-center"]
opening  = ["strong"]

[HI.const.ladder]
types = ["num", "lower", "upper"]             # only "(1) (2) (3)" seen (art. VII §12); the rest are <ol> lists
tags  = ["paragraph", "subparagraph", "clause"]

[HI.const.containers]
preamble = { match = '^(?P<heading>Preamble)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^(?i:article)\s+(?P<num>[IVXL]+)$', tag = "article", rank = 2, id = "a{num_arabic}", heading = "next" }

[HI.const.sections]
# "Section 1." / "Section [24]." / "Section [3.5]." at the paragraph start; the all-caps line before is its
# heading. Matched on the text, not the <strong> run: a repealed section is "<strong>Section 3.</strong>
# <strong>REPEALED.</strong> [Repeal ...]" and the two runs read as one opening; "REPEALED. [...]" is body.
match = '^Section\s+\[?(?P<num>\d+(?:\.\d+)?[A-Z]?)\]?\.'
bold  = false
scope = "container"                           # numbers restart per article
heading_before = '^(?=[^a-z]*[A-Z]{2})[^a-z]+$'   # no lower-case letter: "POLITICAL POWER", "1978 SENATORIAL ELECTIONS"
decimal = true                                # 3.5 between 3 and 4

[HI.const.notes]
# revisor's notes after a section (or after an article's heading): run to the next section heading
# "Note: This article, entitled ..., is new" (art. IV, XIV) is one paragraph: article XIV has no numbered
# sections and its law text follows that note directly, so the note is single (the next block is article text).
# Other notes may run on into unlabeled paragraphs (art. XV s1, art. XVIII head) and stay open.
editorialNote = [{ match = '^Note: This article, entitled .* is new', topic = "note", single = true },
                 { match = '^Note:', topic = "note" }, { match = '^Revision Note:', topic = "revisionNote" }]
# the front matter (adoption history, revision note, linked table of contents) before the Preamble: one note
# at the document's head, opened by the h2 title and closed by the Preamble container
note = [{ match = '^The Constitution of the State of Hawaii$', topic = "frontMatter" }]
# h4 "Effective Date" at the end of article XVIII is the constitution's closing provision, not part of
# section 12: it ends the section and stands as a cross heading in the article
close = [{ heading = true, match = '^Effective Date$' }]
