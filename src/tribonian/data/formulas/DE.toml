# DE.toml -- Delaware Code (delcode.delaware.gov), and the Delaware Constitution of 1897.
#
# Site layout (from the probes, build/probe/delcode.delaware.gov/):
#   index.html                  lists titles: title{N}/index.html (hrefs padded with "&#xA;" + spaces)
#   title{N}/index.html         lists chapters (NOT YET PROBED; big chapters reportedly split further into
#                               subchapter pages c{NNN}/sc{NN}/index.html -- unconfirmed)
#   title{N}/c{NNN}/index.html  a whole chapter, every section's text: one request per chapter
#   title{N}/Title{N}.pdf       the authenticated (UELMA) PDF, not used here
# Chapter page markup: div#TitleHead holds h1 "TITLE 1", h4 title name, h2 part, h3 "CHAPTER 1. Name",
# h4 subchapter (empty when none). div#CodeBody holds one div.Section per section: div.SectionHead
# "§ 101. Heading.", then p.subsection / p.indent-N lines, then the history credit as bare text and <a>
# links directly inside div.Section ([html].loose makes it a block, class "loose").
# Big chapters (title 1 ch. 2 and 8, title 11 ch. 5) are not text pages but lists of subchapter pages
# (c005/sc01/index.html ...): the second `links` level; each subchapter page repeats the chapter heading
# and the build joins them into one chapter.

[DE.code]
name    = "Delaware Code"
doc     = "/us-de/code"                       # /us-de/code/t1/s101/a
fetch   = "index"
item    = "%d"                                # title 1 -> "1" (URLs are title1, not title01)
index_file = "title{item}.html"               # the title's chapter list, saved per title
# chapter links in the title index: href="../title1/c001/index.html"; chapter folders also c002a, c012_1
links   = ['href="(\.\./title\d+/c[0-9a-z_]+/index\.html)"',          # title index -> chapter pages
           'href="(\.\./\.\./title\d+/c[0-9a-z_]+/sc[0-9a-z_]+/index\.html)"']   # big chapter -> subchapter pages
# mixed depth: a chapter page with no subchapter links is itself the text (kept as _idx/<name>)
save_as = "path"                              # every chapter page is named index.html: keep the path
layers  = [ { name = "current", url = "https://delcode.delaware.gov/title{item}/index.html" } ]
encoding = "utf-8"
family  = "html-paragraphs"

[DE.code.html]
root     = "div#content"                      # page header, menus and footer are outside it
blocks   = ["p", "div.SectionHead"]
loose    = ["div.Section", "div#CodeBody"]    # the history credit: bare text + links after the last <p>;
                                              # div#CodeBody: a stray credit copy after a section's div (1 Del. C. § 801)
headings = ["h1", "h2", "h3", "h4"]           # the div#TitleHead lines: TITLE / title name / PART / CHAPTER / SUBCHAPTER
opening  = ["div.SectionHead"]                # the whole "§ 101. Designation and citation of Code." line
# site furniture only: the breadcrumb row ("Title 1" link, "Authenticated PDF" link) and the
# in-page jump list of section numbers (ul.chaptersections: "§ 101", "§ 101A" ... anchors, repeated
# verbatim by each section's own heading)
verbatim = ["div.code-table"]                 # statutory tables (11 Del. C. § 1105(f) offense list): one text item, cells joined
drop     = ["div.row", "ul.chaptersections"]

[DE.code.ladder]
# Delaware style (a)(1)a.1.A.I. (the sixth level, roman dotted, in 11 Del. C. § 1448(a)(5)c.1.A.I.)
types = ["lower", "num", "lower.", "num.", "upper.", "roman_upper."]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause", "item"]

[DE.code.containers]
# The title's number and name repeat on every chapter page (h1 / first h4). They are kept as cross
# headings at title level by the build; a title container here would nest each chapter page's chapter
# under a duplicate title node.
part       = { match = '^PART\s+(?P<num>[IVXL]+[A-Z]?)\b.*$', tag = "part", rank = 2, id = "pt{num}", heading = "next" }
chapter    = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]?)\..*$', tag = "chapter", rank = 3, id = "ch{num}", heading = "next" }
subchapter = { match = '^Subchapter\s+(?P<num>[IVXL]+[A-Z]?)\b.*$', tag = "subchapter", rank = 4, id = "sch{num}", heading = "next" }

[DE.code.sections]
# "§ 101. Designation and citation of Code." / "§ 101A. ..." / "§ 1-101. ..." (UCC, title 6) /
# "§§ 111-115. [Reserved.]"
match = '^§§?\s*(?P<num>\d+[A-Za-z]*(?:[-.]\d+[A-Za-z]*)*(?:\s*(?:-|–|to|,)\s*\d+[A-Za-z]*(?:[-.]\d+[A-Za-z]*)*)?)\.\s*(?P<heading>.*)$'
bold  = true                                  # matched against the opening run (div.SectionHead)
scope = "title"                               # /us-de/code/t1/s101
versions = '\[Effective'                      # "§ 2101. Purposes ... [Effective until Feb. 1, 2027]." then
                                              # "§ 2101. ... [Effective Feb. 1, 2027].": two versions, kept as s2101, s2101_v2

[DE.code.notes]
# the history credit ("1 Del. C. 1953, § 101; 49 Del. Laws, c. 220, § 1;"): the only loose text in a section
sourceCredit = { class = "loose" }

# ---------------------------------------------------------------- Delaware Constitution of 1897
# constitution/index.shtml lists one page per article: constitution-01.shtml (preamble) ... -19.shtml.
# (Two index links point at .html twins -- constitution-03.html, -04.html; the pattern takes .shtml only.)
# Article page: div.row holds the breadcrumb and h2 "ARTICLE I. BILL OF RIGHTS" (+ empty prev/next buttons);
# each section is p.section-label "§ 1. Freedom of religion." then <p> text, then the history credit as bare
# <a>/<span> runs directly in div#content (loose). Ids: /us-de/const/t1897/a1/s1.
[DE.const]
inherit = "DE.code"
replace = ["containers", "html", "sections", "ladder"]
name    = "Delaware Constitution of 1897"
doc     = "/us-de/const"
item    = ""
items   = ["1897"]                             # one document; the item only names the files and the id
index_file = "constitution-{item}.html"
links   = 'href="(constitution-\d+\.shtml)#'      # 01 (preamble) is linked at #P6_47, the rest at #TopOfPage
save_as = "name"                               # flat folder, unique names: plain file names (overrides DE.code's "path")
layers  = [ { name = "current", url = "https://delcode.delaware.gov/constitution/index.shtml" } ]
dir     = "const"

[DE.const.html]
root     = "div#content"
blocks   = ["p"]
headings = ["h2"]
opening  = ["p.section-label"]                 # the whole "§ 1. Freedom of religion." line
loose    = ["div#content", "div.col-xs-24", "div.indent-2"]   # history credits: bare links between the <p>s
                                               # (div.indent-2 wraps a few multi-paragraph sections, credit inside)
drop     = ["span.breadcrumb"]                 # "The Delaware Constitution" back link

[DE.const.ladder]
types = ["lower", "num", "lower.", "num.", "upper."]   # unconfirmed beyond (a)(1): article I has no labels
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[DE.const.containers]
schedule = { match = '^(?P<heading>SCHEDULE)$', tag = "level", rank = 2, id = "schedule", heading = "self" }
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+[A-Z]?)\.\s*.*$', tag = "article", rank = 2, id = "a{num_arabic}", heading = "next" }

[DE.const.sections]
match = '^§\s*(?P<num>\d+[A-Z]?)(?:\.\s*|\s+)(?P<heading>.*)$'   # art. III "§ 18 Approval ..." lacks its period
bold  = true                                   # matched against the opening run (p.section-label)
scope = "container"                            # numbers restart per article
