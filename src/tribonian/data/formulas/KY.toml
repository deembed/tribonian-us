[KY.krs.pdf]
# Newer sections set labels hanging: "(1)   A person ..." with wrapped lines under the text column (6); older ones
# are flush paragraphs. A long catchline wraps onto a line indented ~5 ("222.202 ... in a public\n     place.").
# join = "hanging": a line continues the paragraph when back at the margin or at/under the paragraph's label
# text column. The section line's "label" is its chapter part "222." (zero-width up to the dot), so its wrapped
# catchline (indent 5 >= 4) continues it; "History:" is a zero-width label too, so its deeper continuation
# lines stay in the note paragraph.
join   = "hanging"
label  = '(?:\d+[A-Z]?\.(?=\d)|(?=History:)|(?:\(?[0-9]{1,3}[a-z]?[.)]|\(?[A-Za-z]{1,2}[.)]|\([ivxlcIVXLC]{1,6}\))\s+)'
# every label starts a paragraph (under "hanging" an indented "(a)" would otherwise continue its "(1)"). The section
# line needs no rule (always the page's first line) and must not have one: a wrapped cross-reference
# "... KRS\n1.020 shall ..." (1.010) would split.
# A numeric "(n)" label must be followed by a capital: KRS writes numbers as "twenty-four (24) hours", and a
# line that wraps before "(24) hours" sits exactly at the label text column (645.105, 222.231 "(2) years").
starts = ['^\(\d{1,3}[a-z]?\)\s+[A-Z"\u201c(]', '^(?:\([a-z]{1,2}\)|\([ivxl]{1,6}\)|\d{1,3}\.|[a-z]{1,4}\.)\s', '^(Effective|History):']

[KY.krs.html]
root    = "div#pdf"                           # the transform's wrapper
blocks  = ["p"]

[KY.krs.sections]
# "1.010 Legislative intent in ... System." -- KRS numbers 1.010, 6A.040, 218B.050, 141.0401 (decimal: 141.0401 <
# 141.041). The body's first line is flush, so pdf-text joins it to the section line: the catchline is taken up to
# its first period followed by a capital / "(" / end, and the rest of the block is the body (bold = false).
# Risk: a catchline with an inner abbreviation followed by a capital ("U.S. Government") would end early.
match   = '^(?P<num>\d+[A-Z]?\.\d+(?:-\d+)?)\s+(?P<heading>.*?\.)(?=\s+[A-Z(\u201c"]|\s*$)'
decimal = true
bold    = false

[KY.krs.notes]
# "Effective: <date>" then "History: ..." 
sourceCredit = ['^Effective:', '^History:']

[KY.krs.ladder]
# KRS house style: (1)(a) 1. a. i. ("i." under "e." in 222.427)
types = ["num", "lower", "num.", "lower.", "roman_lower."]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

