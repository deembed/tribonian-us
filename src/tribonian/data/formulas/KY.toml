# ---------------------------------------------------------------- Kentucky Revised Statutes (KRS) + Constitution
# Every KY text page is a one-page PDF with a text layer (no HTML text exists on the LRC site), read through the
# shared transform "pdf-text" (pdftotext -layout -> <p> blocks with margin-left from indentation).
# Generated by build/dispatch/KY.gen.py (the ids table comes from the probed index page).
#
# Site: apps.legislature.ky.gov (Kentucky Legislative Research Commission). IDs are opaque database numbers:
#   law/statutes/              lists every TITLE (span#title) and CHAPTER (a.chapter href="chapter.aspx?id=<db id>");
#                              548 live chapters, 30 "(Not yet utilized.)" with no link
#   law/statutes/chapter.aspx?id=<db id>   one chapter: div#Panel1 > ul > li > a.statute href="statute.aspx?id=<db id>",
#                              link text ".010  Catchline." (number without the chapter prefix); no full-chapter link
#   law/statutes/statute.aspx?id=<db id>   one section, PDF. Layout per pdftotext (KRS 1.010, 1.100):
#        1.010 Catchline.                       flush, number + catchline on one line
#        body lines, flush                      a paragraph's first line is indented (subsections "(1) ...")
#                      Effective: <date>        indented ~14
#                      History: Amended ...     indented ~14, continuation lines ~18
#   A superseded id returns a small HTML "Invalid Statute" page (pointing to the current id); chapter pages link
#   current ids only.

[KY.krs]
name    = "Kentucky Revised Statutes"
doc     = "/us-ky/krs"
fetch   = "index"
# item = the chapter number as printed ("1", "6A", "645"); the URL takes the site's db id from the ids table below
item    = ""
title_id = ['^(.*)$', 'ch\1']                 # /us-ky/krs/ch6A
index_file = "chapter-{item}.html"
links   = 'href="[^"]*?(statute\.aspx\?id=\d+)"'
save_as = "path"                              # "statute.aspx?id=50298" -> statute.aspx_id_50298 (file-safe)
layers  = [ { name = "current", url = "https://apps.legislature.ky.gov/law/statutes/chapter.aspx?id={id}" } ]
transform = "pdf-text"                        # each section page is a PDF
family  = "html-paragraphs"
terms   = "(c) Kentucky LRC; no reuse terms seen"

