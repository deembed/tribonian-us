# ---------------------------------------------------------------- Constitution of Kentucky (1891, as amended)
# Law/Constitution lists every section in collapsible panels (h4 span.TitleText = division name, e.g. "BILL
# OF RIGHTS - Section 1 to 26"); each li.KSection links one page per section,
#   /Law/Constitution/Constitution/ViewConstitution?rsn=<n>   (rsn is NOT the section number: Preamble = 309,
#   "Bill of Rights" division page = 2, Section 1 = 3). 277 pages (each linked twice), in document order.
# Each page is a one-page PDF. Layout per pdftotext:
#        Section 1 Rights of life, liberty, ...     flush; a long catchline wraps onto lines indented ~5
#             All men are, by nature, ...          paragraphs: first line indented ~5-6, the rest flush
#                Text as Ratified on: ...          indented ~13-15
#                History: Not yet amended.
#   Division pages (rsn=2) and the Preamble (309): a centred heading "BILL OF RIGHTS" / "PREAMBLE", then text.
[KY.const]
name    = "Constitution of Kentucky"
doc     = "/us-ky/const"
fetch   = "index"
item    = ""                                  # one item: "const"
index_file = "constitution.html"
links   = 'href="(/Law/Constitution/Constitution/ViewConstitution\?rsn=\d+)"'
save_as = "path"
layers  = [ { name = "current", url = "https://apps.legislature.ky.gov/Law/Constitution" } ]
transform = "pdf-text"
family  = "html-paragraphs"
terms   = "(c) Kentucky LRC; no reuse terms seen"

[KY.const.pdf]
join   = "indent"
starts = ['^(Text as Ratified on|History):']     # the section line is the page's first line

[KY.const.html]
root     = "div#pdf"
blocks   = ["p"]
headings = []                                 # "PREAMBLE" / "BILL OF RIGHTS" are read as sections (below)

[KY.const.sections]
# "Section 1 Rights of ... arms." The two division pages carry no section number: "PREAMBLE" and "BILL OF RIGHTS"
# (whose page holds the Bill's own enacting clause "That the great ... we declare that:") are sections of their own
# (/us-ky/const/sPREAMBLE, /us-ky/const/sBILL_OF_RIGHTS), so their text is law text in a section, not unmapped.
match   = '^(?:Section\s+(?=\d)|(?=PREAMBLE$|BILL OF RIGHTS$|SCHEDULE$))(?P<num>\d+[a-z]?|PREAMBLE|BILL OF RIGHTS|SCHEDULE)(?:\s+(?P<heading>.*?\.)(?=\s|$))?'
bold    = false

[KY.const.ladder]
# the 1891 text has few labels; amended sections use (1)(a)
types = ["num", "lower"]
tags  = ["subsection", "paragraph"]

[KY.const.notes]
sourceCredit = ['^Text as Ratified on:', '^History:']
