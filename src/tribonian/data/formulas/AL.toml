[AL.code]
name     = "Code of Alabama 1975"
doc      = "/us-al/code"                     # /us-al/code/t1/ch1/s1-1-1
# one GET per CHAPTER (Title 7: per Article, its top level) -- the existing template strategy: {id} is the
# chapter's database codeId from [AL.code.ids]; the URL is fully percent-encoded so only {id} is a format field.
# query (decoded): query($include:[ID!]){items:codesOfAlabama(include:$include,includeAllVersions:true){data{
#   codeId parentId displayId title catchLine content history effectiveDate supersessionDate isBranchNode}}}
# variables (decoded): {"include":["{id}"]}.  variables first: probe names keep the id inside their length cap.
fetch    = "template"
url      = "https://alison.legislature.state.al.us/graphql?variables=%7B%22include%22%3A%5B%22{id}%22%5D%7D&query=query%28%24include%3A%5BID%21%5D%29%7Bitems%3AcodesOfAlabama%28include%3A%24include%2CincludeAllVersions%3Atrue%29%7Bdata%7BcodeId%20parentId%20displayId%20title%20catchLine%20content%20history%20effectiveDate%20supersessionDate%20isBranchNode%7D%7D%7D"
file     = "{item}.json"                     # law/al/code/1-1.json -- raw GraphQL JSON
transform = "alison-json"                    # NEEDED (shared): build/dispatch/AL.json2html.py -> <div id="al"> blocks
title_id = ['^(\d+[A-Z]?)-.*$', 't\1']        # item "13A-5" -> /us-al/code/t13A (the chapter container adds ch5)
encoding = "utf-8"
family   = "html-paragraphs"
reject   = '"errors"\s*:'                    # a GraphQL error body is not a chapter
terms    = "no robots.txt (the URL serves the app page); NEXT_PUBLIC_ROBOTS=all; AALL: copyright not claimed; site terms unread"

