[AL.code.html]
# input is the transform's HTML (uslm/transforms/alison.py): <div id="al"> h2 headings, p.section, the site's
# content HTML, p.history. The content is editor HTML: mostly <p>, but also <div> paragraphs (40-18-133),
# <ul> nested inside <p> as indentation ("<p><ul><ul>(1) ...</ul></ul>tail text</p>", 40-18-25.2) and CALS or
# HTML tables (45-49-230.02 pay plan, 40-18). The HTML parser closes the <p> at <ul>, so the tail lands in the wrapper.
root     = "div#al"
blocks   = ["h2", "p", "ul", "div", "table"]
headings = ["h2"]
opening  = ["b"]
verbatim = ["table"]                         # a table is one text item (cells joined), no label parsing
nested   = true
loose    = ["div#al"]                          # bare text runs directly in the wrapper (tail text after a stray </ul>)

[AL.code.containers]
# from the tree nodes: "Chapter 1 Construction of Code and Statutes.", "Article 2 ...", "Division 1 ...", "Part 1 ..."
title    = { match = '^Title\s+(?P<num>\d+[A-Z]?)\b\.?\s*(?P<heading>.*)$', tag = "title",   rank = 1, id = "t{num}" }
chapter  = { match = '^Chapter\s+(?P<num>\d+[A-Z]*)\b\.?\s*(?P<heading>.*)$', tag = "chapter", rank = 2, id = "ch{num}" }
article  = { match = '^Article\s+(?P<num>\d+[A-Z]*)\b\.?\s*(?P<heading>.*)$', tag = "article", rank = 3, id = "a{num}" }
part     = { match = '^Part\s+(?P<num>\d+[A-Z]*)\b',    tag = "part",    rank = 4, id = "p{num}" }
subpart  = { match = '^Subpart\s+(?P<num>\d+[A-Z]*)\b\.?\s*(?P<heading>.*)$', tag = "subpart", rank = 5, id = "sp{num}" }
division = { match = '^Division\s+(?P<num>\d+[A-Z]*)\b\.?\s*(?P<heading>.*)$', tag = "division", rank = 6, id = "d{num}" }

[AL.code.ladder]
# Alabama: (a) subsection, (1) paragraph, a. subparagraph, 1. clause; definitions lists start at (1)
types = [["lower", "num"], ["num", "lower."], ["lower.", "roman_lower", "upper"], ["num.", "roman_lower"]]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[AL.code.sections]
# p.section <b>: "Section 1-1-1 Meaning of Certain Words and Terms." ; "Section 8-19K-1 Definitions. (Effective
# January 1, 2027)" -- a later-effective copy of a section is kept as a version
match = '^Section\s+(?P<num>\d+[A-Z]*-\d+[A-Z]*-\d+(?:\.\d+)*)\s*(?P<heading>.*)$'
versions = '\(Effective [A-Z][a-z]+ \d+, \d{4}\)'
bold  = true
scope = "title"

[AL.code.notes]
sourceCredit = [{ class = "history", single = true }]

[AL.const]
inherit  = "AL.code"
name     = "Constitution of Alabama 2022"
doc      = "/us-al/const"
# one GET per unit, same query shape on constitutionItems: the 18 statewide Articles (I .. XVIII) and the 134 local
# "Titles" (one per county, "Title 1 Autauga County." / "Title 1A Autauga County Municipalities.") under "Local
# Provisions", items L1 L1A ... L67A. ids from {titles:constitutionTitles} (same "∫"/"†" TOC format as the Code).
url      = "https://alison.legislature.state.al.us/graphql?variables=%7B%22include%22%3A%5B%22{id}%22%5D%7D&query=query%28%24include%3A%5BID%21%5D%29%7Bitems%3AconstitutionItems%28include%3A%24include%29%7Bdata%7BcodeId%20parentId%20displayId%20title%20catchLine%20content%20history%20isBranchNode%7D%7D%7D"
replace  = ["sections", "containers", "ids"]

