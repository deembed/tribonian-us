# WI.toml -- Wisconsin: Statutes & Annotations (WI.stats) and the Annotated Constitution (WI.const).
# Source: the Legislative Reference Bureau's site, docs.legis.wisconsin.gov ("updated 2023-24" edition,
# published Oct 1, 2026, certified under s. 35.18). Record the edition banner + certificate date when fetching.
#
# Markup (generated by the LRB's "WordParser"): every line is a <div class="qs..."> inside div#document,
# with a data-path (/statutes/statutes/1/026/1/a) and a semantic class:
#   qsnum_chap / qstitle_chap        CHAPTER 1 / its name (centered)
#   qstoc_entry                      chapter table of contents lines ("1.01  State sovereignty ...")
#   qsatxt_1sect                     section: span.qsnum_sect "1.026" + span.qstitle_sect "Apostle Islands ..."
#   qsatxt_2subsect / _3para / ...   (1) / (a) / 1. ...  label in span.qsnum_*
#   qsanomaly                        unnumbered law text inside a section (s. 1.07 coat of arms)
#   qsnote_history / _xref / _annot / _note   History: / Cross-reference: / annotations / NOTE:
#   qsgraphic                        " - See PDF for diagram" (an image left out of the HTML)
# Every block carries a hidden permalink label (a.reference "1.026(1)(a)", span.reference "1.01 History"),
# shown only on hover: site furniture, dropped.
#
# FETCH -- fetch = "scroll" (statelaw._fetch_scroll): every page is a WINDOW of ~29-90 blocks and no whole-chapter
# HTML exists (the chapter PDF is the only whole file). /scroll/down/<N>/<doc path> returns a bare fragment with the
# next 29 blocks and, at its end, <div class='navigation_down'><a href='/scroll/down/<M>/...'>; past the end it is
# whitespace only. The windows are joined by data-path into one file per chapter, <div id="document">...</div>,
# which [html].root reads. /scroll/down/0 starts at position 2 (position 1 is div.qssection, an empty spacer).

# ---------------------------------------------------------------- Wisconsin Statutes & Annotations
[WI.stats]
name    = "Wisconsin Statutes & Annotations"
doc     = "/us-wi/stats"                      # /us-wi/stats/ch1 ; sections /us-wi/stats/s1.026/1/a (numbers unique statewide)
fetch   = "scroll"
url     = "https://docs.legis.wisconsin.gov/scroll/down/{start}/statutes/statutes/{item}"
start   = 0
next    = '''<div class='navigation_down'[^>]*><a href='(/scroll/down/\d+/[^']+)'>'''   # the next window's link
join_key  = "data-path"                       # every block's unique, stable path: windows joined, each path once
join_root = '<div id="document">'             # = [html].root below
edition = "current"                           # the URL has no edition; past editions are /<year>/statutes/statutes/<ch>
file    = "ch{item}.html"                     # item = the chapter number as written (1, 20, 990; no padding)
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "none stated"

