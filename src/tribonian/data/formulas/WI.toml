[WI.stats.html]
root     = "div#document"                     # outside it: menus, search form, pull-tab tools
blocks   = ["div[class*=qs]"]                 # every line is a div.qs*; a div inside one (qsparaSeePdf) counts once
                                              # (not plain "div": div#document itself sits inside layout divs)
headings = ["div.qsnum_chap", "div.qstitle_chap", "div.qsnum_subchap", "div.qstitle_subchap"]
opening  = ["span.qsnum_sect", "span.qstitle_sect"]   # "1.026 Apostle Islands land purchase."
# hidden permalink labels on every block (duplicate the number), the Up/Down window links
drop     = ["a.reference", "span.reference", "div.navigation", "div.navigation_up", "div.navigation_down"]

[WI.stats.ladder]
# (1)(a)1.a.  -- Wisconsin's subsection, paragraph, subdivision, subdivision paragraph; insertions (1m) (am) 1g.
types = ["num", "lower", "num.", "lower."]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[WI.stats.containers]
chapter    = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]?)$', tag = "chapter", rank = 1, id = "ch{num}" }        # name: div.qstitle_chap
# div.qsnum_subchap "SUBCHAPTER I" (its hidden a.reference "subch. I of ch. 49" dropped) / div.qstitle_subchap name
subchapter = { match = '^SUBCHAPTER\s+(?P<num>[IVXL]+[A-Z]?)$', tag = "subchapter", rank = 2, id = "sch{num}" }

[WI.stats.sections]
# opening run = number + bold title: "1.026 Apostle Islands land purchase." | "1.10 State song, ..."
match   = '^(?P<num>\d+\.\d+[a-z]?)\s+(?P<heading>.*)$'
bold    = true
class   = "qsatxt_1sect"                      # only the section line opens a section (not a toc line's number)
scope   = "title"
decimal = true                                # 1.025 < 1.026 < 1.03 < 1.031: section numbers are decimals
# contents lines before the first section (div.qstoc_entry "1.01  State ...", div.qstoc_subchap "SUBCHAPTER I" /
# "DEFINITIONS"): one <toc> note. Only read while no section is open.
toc     = ['^\d+\.\d+[a-z]?\s', '^SUBCHAPTER\s+[IVXL]+[A-Z]?$', '^[A-Z][A-Z0-9 ,;:&()\u2014\u2019.-]+$']

[WI.stats.notes]
# by class; annotations, cross-references and NOTEs hang off the section they follow
note          = [{ class = "qsnote_annot", topic = "annotation" },
                 { class = "qshead_20pt", topic = "edition" }, { class = "qshead_14pt", topic = "edition" },
                 { class = "qshead_11_pt", topic = "edition" }]
sourceCredit  = { class = "qsnote_history" }
editorialNote = [{ class = "qsnote_xref", topic = "crossReference" }, { class = "qsnote_xref_code", topic = "crossReference" },
                 { class = "qsnote_note", topic = "note" }]
# NOTEs also stand MID-section (49.45(24s)(a) NOTE, then (b) ...). single = true would send (b) back to the body, but
# the note is attached to the section and written after the whole subsection: order changes and conservation fails
# (tried on ch. 49). Until notes can attach to the open level, the paragraphs after a mid-section NOTE stay in it.   # xref_code: "See also chs. DHS 250 ..., Wis. adm. code."

[WI.stats.cite]
# "Wis. Stat. § 940.01(1)(a) (2021-22)", and the older "sec. 940.01, Stats." (bare: only in Wisconsin cases)
full    = ['Wis\.\s?Stat(?:s?\.|utes)(?:\s?Ann\.)?', 'Wisconsin\s+Statutes', 'W\.\s?S\.\s?A\.']
bare    = ['(?:§§?|[Ss]ecs?\.)\s*{section}(?:\s?\([0-9a-z]{1,4}\))*,?\s*Stats\.']
section = '\d+\.\d+[a-z]?'
item    = ['^(\d+)\.', '{1}']                        # 940.01 -> chapter 940
label   = "Wis. Stat. § {sec}"
examples = [["Wis. Stat. § 340.01(1) (2021-22)", "wi-stats:340.01", "Wis. Stat. § 340.01"],
            ["sec. 49.45(24s)(a), Stats.", "wi-stats:49.45"],
            ["Wis. Stat. Ann. § 940.01 (West 2022)", "wi-stats:940.01"]]

# ---------------------------------------------------------------- Wisconsin Constitution (annotated)
# /constitution/wi: the LRB's annotated constitution (last amended April 2025, published Aug 5, 2026), same
# WordParser markup and the same windowing. The unannotated HTML is disallowed by robots.txt.
#   div.qsarticle "ARTICLE IV." (+ hidden a.reference "IV")  /  div.qstitle_subchap "LEGISLATIVE" (its name)
#   div.qsatxt_1sect: the HEADING comes first, then the number, then the text, all in plain spans:
#       "Legislative power. Section 1.  The legislative power shall be vested ..."
#       "Secret ballot. Section 3.  [Repealed April 1986; as created April 1986] All votes ..."
#   div.qsatxt_2subsect "(1) ..."; every annotation a div.qsnote_annot; contents: qstoc_subchap / qstoc_entry
[WI.const]
inherit = "WI.stats"
replace = ["containers", "sections", "ladder", "notes"]
name    = "Wisconsin Constitution"
doc     = "/us-wi/const"                      # /us-wi/const/a4/s3
url     = "https://docs.legis.wisconsin.gov/scroll/down/{start}/constitution/{item}"   # fetch/next/join inherited
items   = ["wi"]                              # always the one document
catalog = ["wi"]                              # its own (the inherited one lists the statute chapters)
file    = "{item}.html"

[WI.const.html]
# replaces the inherited list. The title "ANNOTATED WISCONSIN CONSTITUTION" (div.qstitle_chapter) is read as the
# edition note: the build supplies the document's own title.
headings = ["div.qsarticle", "div.qstitle_subchap"]

[WI.const.ladder]
types = ["num", "lower"]                      # (1)(a) -- art. III s. 7 (1)(2); deeper levels not seen yet
tags  = ["subsection", "paragraph"]

[WI.const.containers]
# the article's name is the next heading block (div.qstitle_subchap). PREAMBLE: markup not seen yet (guess)
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)\.$', tag = "article", rank = 2, id = "a{num_arabic}" }

[WI.const.sections]
# matched on the block text (bold = false): the heading, then "Section N." -- the number is only looked at
# (lookahead), so "Section 3." stays at the start of the body text and nothing is lost. num_text is empty:
# the source prints the number after the heading.
match = '^(?P<heading>.+?)\s+(?=Section\s+(?P<num>\d+[a-z]?)\.)'
bold  = false
class = "qsatxt_1sect"                        # only section lines (a note quoting "... Section 3." never opens one)
scope = "container"                           # numbers restart per article

[WI.const.notes]
# the contents lines are classed (qstoc_subchap / qstoc_entry): one toc note per line, so the edition banner
# note above them ends where the contents start
note          = [{ class = "qstitle_chapter", topic = "edition" }, { class = "qshead_14pt", topic = "edition" },
                 { class = "qstoc_subchap", topic = "toc" }, { class = "qstoc_entry", topic = "toc" },
                 { class = "qsnote_annot", topic = "annotation" }]
sourceCredit  = { class = "qsnote_history" }
editorialNote = [{ class = "qsnote_xref", topic = "crossReference" }, { class = "qsnote_xref_code", topic = "crossReference" },
                 { class = "qsnote_note", topic = "note" }]   # xref_code: "See also chs. DHS 250 ..., Wis. adm. code."

[WI.const.cite]
full    = ['Wis\.\s?Const\.?', 'Wisconsin\s+Constitution', 'Constitution\s+of\s+(?:the\s+State\s+of\s+)?Wisconsin']
item    = "wi"
label   = "Wis. Const. art. {roman}[, § {sec}]"
examples = [["Wis. Const. art. I, § 11", "wi-const:art-1:11", "Wis. Const. art. I, § 11"],
            ["Wis. Const. art. IV", "wi-const:art-4"]]
