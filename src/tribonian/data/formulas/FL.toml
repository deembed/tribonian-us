# FL.toml -- Florida: the Florida Statutes (Online Sunshine, leg.state.fl.us) and the Florida Constitution
# (flsenate.gov). Both sites publish the same XML-derived markup, one nested div per level:
#   div.Section > span.SectionNumber, span.Catchline (CatchlineText + EmDash), span.SectionBody >
#     span.Text (lead-in) and div.Subsection > span.Number|span.Id "(1)", span.Text, div.Paragraph > ...
#   then div.History ("History.—") and div.Note ("Note.—") inside the section.
# [html].nested turns every block that holds blocks into a container whose own loose text runs become
# blocks: each level's "(1) text" run. div.Section itself is NOT a block: its children are spans, and
# span.SectionBody (an inline tag holding the level divs) would be swallowed into one loose run with the
# number and catchline (_wrap_loose splits only at block TAGS -- see FL.status.md). So the section's
# spans are the blocks: span.SectionNumber "768.041", span.Catchline (the heading: [sections].heading =
# "next"), span.SectionBody (a block, or a container of the level divs).
# The indexes (div.CatchlineIndex, div.PartIndex) are dropped: in-page link lists (#A1S01, Sections/...)
# that repeat the numbers and catchlines below; the constitution's own front note says "The indexes
# appearing at the beginning of each article ... are added editorially and are not to be considered as
# part of the constitution." Kept, their span.SectionNumber lines would open sections.

# ---------------------------------------------------------------- Florida Statutes
# No bulk download: the "Statutes Download" page (with or without Submenu=7) shows only the title list.
# One whole-chapter page per chapter ("View Entire Chapter"); its path carries the chapter's hundred-range.
[FL.fs]
name    = "Florida Statutes"
doc     = "/us-fl/fs"                        # /us-fl/fs/ch768/pt1/... sections: /us-fl/fs/s768.041/1/a
fetch   = "template"
url     = "https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL={lo:04d}-{hi:04d}/{n:04d}/{n:04d}.html"
edition = 2026                               # the page serves the current edition (2026 Florida Statutes)
item    = "%d"                               # chapter number: 768
file    = "chapter-{item}.html"
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "AALL: no copyright claimed in the statutes; only the print edition is official (s. 11.2421)"

[FL.fs.html]
root     = "div#statutes"                    # the statute; the rest is Online Sunshine site furniture
nested   = true
blocks   = ["span.SectionNumber", "span.Catchline", "span.SectionBody", "div.Subsection", "div.Paragraph",
            "div.SubParagraph", "div.SubSubParagraph", "div.SubSubSubParagraph", "div.SubSubSubSubParagraph",
            "div.History", "div.Note", "p"]
verbatim = ["table"]                         # rate tables and forms (ch. 627): one text item each
# the chapter's section index and part index (see top); "title": the embedded page's <title>CHAPTER 768</title>
# (the chapter file is a whole XHTML document pasted inside div#statutes, head and all)
# "sup": footnote markers (<sup><a href="#1">1</a></sup>) before a section number and in its Note; outside
# every block, they would fail conservation. Drops ANY sup: watch the sup count in the verify report.
drop     = ["div.CatchlineIndex", "div.PartIndex", "title", "sup"]
# div.Title, on a title's first chapter only: div.TitleNumber "TITLE I" + span.TitleName, no space between
# them (so not read as one block: "TITLE XXXILABOR"); likewise div.PartTitle > div.PartNumber "PART I" +
# span.PartTitle "GENERAL PROVISIONS". (The part index's PartNumber divs are dropped with div.PartIndex.)
headings = ["div.TitleNumber", "span.TitleName", "div.ChapterNumber", "div.ChapterName", "div.PartNumber", "span.PartTitle"]
opening  = []

[FL.fs.ladder]
types = ["num", "lower", "num.", "lower.", "roman_upper", "upper"]   # (1)(a)1.a.(I)(A)
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause", "item"]

[FL.fs.containers]
# The title wrapper adds no identifier level (it is on the first chapter of a title only): chapters are
# /us-fl/fs/ch1 either way.
title   = { match = '^TITLE\s+(?P<num>[IVXL]+)$', tag = "title", rank = 1, id = "" }   # span.TitleName follows
chapter = { match = '^CHAPTER\s+(?P<num>\d+)$', tag = "chapter", rank = 2, id = "ch{num}" }   # ChapterName follows
part    = { match = '^PART\s+(?P<num>[IVXL]+)$', tag = "part", rank = 3, id = "pt{num_arabic}" }   # span.PartTitle follows

[FL.fs.sections]
match   = '^(?P<num>\d+\.\d+)$'              # span.SectionNumber "768.041"
heading = "next"                             # span.Catchline "Release or covenant not to sue.—"
bold    = false
scope   = "title"                            # section numbers are statewide: /us-fl/fs/s768.041
decimal = true                               # 768.0415 sorts before 768.042

[FL.fs.notes]
# By text, not class (see FL.const.notes: a div.Note with <p> lines is a nested container)
sourceCredit  = '^History\.—'               # "History.—ss. 1, 2, 3, ch. 57-395; ..."
editorialNote = '^Note\.—'                  # "Note.—Former s. 54.28."

# ---------------------------------------------------------------- Florida Constitution
# One page, the whole constitution: https://www.flsenate.gov/Laws/Constitution (div.Constitution).
[FL.const]
name    = "Constitution of the State of Florida"
doc     = "/us-fl/const"                     # /us-fl/const/a5/s20/c/5/a
fetch   = "template"
url     = "https://www.flsenate.gov/Laws/Constitution"
edition = 2026
item    = ""
items   = ["const"]                          # always the one file
file    = "{item}.html"
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "AALL: no copyright claimed"

[FL.const.html]
root     = "div.Constitution"                # everything outside is flsenate.gov site furniture
nested   = true
blocks   = ["span.SectionNumber", "span.Catchline", "span.SectionBody", "div.Subsection", "div.Paragraph",
            "div.SubParagraph", "div.SubSubParagraph", "div.History", "div.Note", "p"]
# span.Reference: a footnote marker ("1") before a section number or a label, pointing at the div.Note
# that explains it. Editorial apparatus, not law text; inside a level it would sit in front of the label
# ("1(g) All provisions ...") and hide it from the ladder. Counted in the verify report.
drop     = ["div.CatchlineIndex", "span.Reference"]   # article and section indexes (see top)
# ConstitutionTitle's centered lines; ARTICLE I / DECLARATION OF RIGHTS; the preamble's "PREAMBLE"
headings = ["div.ArticleNumber", "div.ArticleName", "p.AlignCenter"]
opening  = []

[FL.const.ladder]
types = ["lower", "num", "lower.", "num."]   # (a)(1)a.1. -- Subsection/Paragraph/SubParagraph/SubSubParagraph
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[FL.const.containers]
title    = { match = '^(?P<heading>CONSTITUTION)$', tag = "title", rank = 1, id = "", heading = "self" }
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)$', tag = "article", rank = 2, id = "a{num_arabic}" }   # div.ArticleName follows

[FL.const.sections]
match = '^SECTION\s+(?P<num>\d+[a-z]?)\.$'   # span.SectionNumber "SECTION 1."
heading = "next"                             # span.Catchline "Political power.—"
bold  = false
scope = "container"                          # numbers restart per article: /us-fl/const/a1/s2

[FL.const.notes]
# By text, not class: a div.Note holding <p> lines (a list of statutes) is a nested container, and its
# lead-in becomes a p.loose block without the Note class. Everything after it to the next section is notes.
sourceCredit  = '^History\.—'               # "History.—S.J.R. 917, 1974; adopted 1974; ..."
editorialNote = '^Note\.—'                  # "Note.—This section, originally designated ..."
