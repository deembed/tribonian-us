[MI.mcl.html]
root     = "main"                              # the @page footer is CSS; <footer> "Rendered ..." is outside main
blocks   = ["p", "h1", "h2", "h3", "h4", "h5", "h6", "div[style*=font-variant:italic]"]   # last: "The People of the State of Michigan enact:"
headings = [".h1", ".h2", ".h3", ".h5", ".h6"] # chapter / act / division headings (.h4 = section rows)
opening  = []
verbatim = ["table"]                           # schedules and rate tables (211.7b, 211.34c) taken whole
loose    = ["div.sectionWrapper"]               # text after a table: the source opens a table inside a <p>, the parser closes
                                               # the <p> there, and the rest ("(d) A claimant ...") is bare text in the section
split_br = ["p"]                               # editorials: History / Former Law / Transfer of Power lines split by <br>
nested   = true                                # split_br puts p.br-line inside the p: read the inner ones

[MI.mcl.ladder]
types = ["num", "lower", "roman_lower", "upper", "roman_upper"]   # (1)(a)(i)(A)(I)
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[MI.mcl.containers]
# "Chapter N" names two levels: the MCL chapter (h1.h1, once, top of the file) and an act's own chapters inside
# div.divisionHeading ("Chapter 1" as h1.h3 in act 281 of 1967, h1.h2 in R.S. of 1846 -- the h-level is not
# stable below h1). rank_class 'h(1)' ranks only the h1 row as 1; every other "Chapter N" takes rank 3.
# The bare row only: R.S. of 1846 follows "Chapter 1" with "CHAPTER 1. OF THE STATUTES." -- that is the name.
# Act divisions: act 2 > article 2.4 > part 2.5 > chapter 3 > subchapter 3.5 (floats allowed; UCC-style ARTICLE > PART
# assumed -- the true nesting is in the divisionWrapper divs, see status).
chapter    = { match = '(?i)^chapter\s+(?P<num>\d+[A-Z]?)$', tag = "chapter", rank = 3, rank_class = 'h(1)', id = "ch{num}" }
# the act's name comes BEFORE "Act N of YYYY" (h1.h2 then h2.h3) and stays a crossHeading; see status (shared need)
act        = { match = '^(?P<heading>Act\s+(?P<num>\d+)\s+of\s+(?P<year>\d{4}))$', tag = "level", rank = 2, id = "act{year}-{num}", heading = "self" }
revised    = { match = '^(?P<heading>R\.\s?S\.\s+of\s+(?P<year>\d{4}))$', tag = "level", rank = 2, id = "rs{year}", heading = "self" }   # Revised Statutes of 1846
article    = { match = '(?i)^article\s+(?P<num>\d+[A-Z]?)$', tag = "article", rank = 2.4, id = "ar{num}" }
part       = { match = '(?i)^part\s+(?P<num>\d+[A-Z]?)$', tag = "part", rank = 2.5, id = "pt{num}" }
subchapter = { match = '(?i)^subchapter\s+(?P<num>\d+[A-Z]?)$', tag = "subchapter", rank = 3.5, id = "sch{num}" }

[MI.mcl.sections]
# h1.h4 "26.1 Michigan reports ...", also lists and ranges of repealed sections "206.32, 206.34 Repealed. ..." and
# "206.116-206.120 Repealed. ..." (one section each, the number kept as printed)
match = '^(?P<num>\d+[A-Za-z]?\.\d+[A-Za-z]*(?:\s*(?:,|-|to)\s*\d+[A-Za-z]?\.\d+[A-Za-z]*)*)\s+(?P<heading>.+)$' 
class = "h4"                                   # only the section rows open a section
bold  = false
scope = "title"

[MI.mcl.notes]
sourceCredit  = '^History:'
editorialNote = ["^Compiler’s note:", "^Compiler's note:", "^Former Law:", "^Transfer of Power:", "^Popular Name:", "^Constitutionality:"]

[MI.mcl.cite]
# "Mich. Comp. Laws § 750.316" (Bluebook), "MCL 750.316" (Michigan courts), "M.C.L. § 750.316", "M.C.L.A." / "MCLA"
full    = ['Mich\.\s?Comp\.\s?Laws(?:\s?Ann\.)?', 'M\.\s?C\.\s?L\.(?:\s?A\.)?', 'MCLA?', 'Michigan\s+Compiled\s+Laws(?:\s+Annotated)?']
section = '\d{1,3}[a-z]?\.\d{1,5}[a-z]{0,2}'
# chapter = the number before the point -> "chap750"; where one act spans several chapters the site keeps them as one
# object (chapters-760-777): each range is an empty group that turns its bracket on (chap380 sits inside 341-386)
item    = ['^(?:(?P<r61>)(?:6[1-9]|7[0-5])|(?P<r81>)(?:8[1-9]|9\d|10\d|11[0-3])|(?P<r131>)(?:13[1-9])|(?P<r220>)(?:2[23]\d|24[0-4])|(?P<r261>)(?:26[1-9]|27[0-8])|(?P<r301>)(?:30[1-6])|(?P<r311>)(?:31[1-5])|(?P<r341>)(?:34[1-9]|3[5-7]\d|38[1-6])|(?P<r401>)(?:40[1-3])|(?P<r463>)(?:46[3-7])|(?P<r475>)(?:47[5-9])|(?P<r501>)(?:50[1-9]|5[1-3]\d|54[0-8])|(?P<r701>)(?:70[1-9]|71[0-3])|(?P<r760>)(?:76\d|77[0-7])|(?P<c>\d+))[a-z]?\.', '[chapters-61-75{r61}][chapters-81-113{r81}][chapters-131-139{r131}][chapters-220-244{r220}][chapters-261-278b{r261}][chapters-301-306{r301}][chapters-311-315{r311}][chapters-341-386{r341}][chapters-401-403{r401}][chapters-463-467{r463}][chapters-475-479{r475}][chapters-501-548{r501}][chapters-701-713{r701}][chapters-760-777{r760}][chap{c}]']
label   = "Mich. Comp. Laws § {sec}"
examples = [["Mich. Comp. Laws § 750.316(1)(a)", "mi-mcl:750.316", "Mich. Comp. Laws § 750.316"],
            ["MCL 26.1", "mi-mcl:26.1"],
            ["M.C.L.A. § 8.3c", "mi-mcl:8.3c"],
            ["MCL 401.1", "mi-mcl:401.1"],
            ["MCL 768.27a(1)", "mi-mcl:768.27a"]]

# ---------------------------------------------------------------- Michigan Statutes Annotated (cite-only)
# Pre-2001 Michigan cases give the MSA as a parallel cite: "MCL 750.316; MSA 28.548".
[MI.msa]
name    = "Michigan Statutes Annotated"
source_error = "no source: the Michigan Statutes Annotated (Callaghan, later LexisNexis) was a commercial compilation, discontinued in 2001; the parallel MCL cite gives the law"

[MI.msa.cite]
full    = ['Mich\.\s?Stat\.\s?Ann\.', 'M\.\s?S\.\s?A\.', 'MSA']
section = '\d{1,2}[A-Z]?\.\d{1,5}(?:\(\d{1,3}\))?'
label   = "Mich. Stat. Ann. § {sec}"
examples = [["MSA 28.548", "mi-msa:28.548", "Mich. Stat. Ann. § 28.548"],
            ["Mich. Stat. Ann. § 27A.2912", "mi-msa:27A.2912"]]
