# Michigan -- Constitution of 1963 (PDF) and Michigan Compiled Laws (PDF per chapter; draft) -- batch 4.
#
# legislature.mi.gov (Legislative Service Bureau) has no complete HTML chapter view: /Laws/MCL?objectName=mcl-chapN
# is only a table of the chapter's acts (chapter 1 = one row, mcl-Constitution); text in HTML exists one section per
# page (/Laws/MCL?objectName=mcl-<sec>), i.e. tens of thousands of requests behind chapter -> act -> section layers.
# The same page links "Download Chapter" = /Home/Document?objectName=mcl-chapN, the whole chapter as one PDF
# (the LSB's MCL PDFs carry footers "Rendered <date> Page N / Michigan Compiled Laws Complete Through PA n of yyyy /
# Courtesy of legislature.mi.gov"). One PDF per chapter (~230 requests) beats the per-section HTML, so MI is a PDF
# state: MI.const from the LSB's constitution booklet, MI.mcl from the chapter PDFs (draft until a sample is probed).

# ---------------------------------------------------------------- Constitution of Michigan of 1963
# MIConstitution.pdf (InDesign, 92 pp, rev. 6/2025): pp 1-10 cover/history/TOC, 11-76 the text, 77- the index.
# pdftotext -layout reads one column: centred "PREAMBLE" / "ARTICLE I" + name ("Declaration of Rights") / "SCHEDULE
# AND TEMPORARY PROVISIONS"; each section is a catchline row "§ 1   Political power." at column 0, then
# "   Sec. 1. ..." paragraphs indented 3-4 spaces with continuation lines at column 0, "(1)" labels on indented lines,
# notes "History:", "Compiler's note:", "Former constitution:" indented too. Bold catchlines are the LSB's, not law.
[MI.const]
name    = "Constitution of Michigan of 1963"
title   = "Constitution of Michigan of 1963"
doc     = "/us-mi/const"                       # /us-mi/const/const/a1/s27/2/a
fetch   = "template"
url     = "https://www.legislature.mi.gov/Publications/MIConstitution.pdf"
item    = "%s"
items   = ["const"]                            # always the one file
file    = "{item}.pdf"
transform = "pdf-text"
encoding = "utf-8"
family  = "html-paragraphs"

# catalog: every item (title/chapter/article) this code has, from the publisher's index (1) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "const"
]

[MI.const.pdf]
pages  = "11-76"                               # skip cover, history, TOC (pp 1-10) and the index (pp 77-92)
join   = "indent"                              # paragraphs open indented, continue at column 0
starts = ['^§\s*\d+[a-z]?\s', '^Preamble\.$']  # catchline rows sit at column 0 like continuation lines
center = 7                                     # headings and in-section catchlines sit at column 7-60; body text and notes at <= 6
drop   = [
  # even-page running head: "Art. I, § 7      CONSTITUTION OF MICHIGAN OF 1963      2" (also "Art. IX § 41", "Sched. § 12")
  '^\s*(?:Art\.\s+[IVX]+,?|Sched\.)\s*§\s*\d+[a-z]?\s{3,}CONSTITUTION OF MICHIGAN OF 1963(?:\s+\d+)?\s*$',
  # odd-page running head: "3      DECLARATION OF RIGHTS      Art. I, § 18"
  '^\s*\d+\s{3,}[A-Z][A-Z ,]+\s{3,}(?:Art\.\s+[IVX]+,?|Sched\.)\s*§\s*\d+[a-z]?\s*$',
]

[MI.const.html]
blocks   = ["p"]
# headings = any line indented 7+ spaces (pdf-text margin-left >= 7pt; body text and notes sit at 0-6pt). pdf-text's
# centring test (room right ~ room left, against the widest line) misses them here: the small-type notes run to
# column ~148 while the body and its centred headings use ~95, so nothing looks centred. Spelled as margin-left
# prefixes: "1" = 10-19pt, "7" "8" "9" = 7-9 and 70-99pt, "20".."69" two-digit (a bare "2".."6" would hit body 2-6pt).
headings = ["p:centered",
            "p[style*=margin-left:1]",
            "p[style*=margin-left:7]",
            "p[style*=margin-left:8]",
            "p[style*=margin-left:9]",
            "p[style*=margin-left:20]",
            "p[style*=margin-left:21]",
            "p[style*=margin-left:22]",
            "p[style*=margin-left:23]",
            "p[style*=margin-left:24]",
            "p[style*=margin-left:25]",
            "p[style*=margin-left:26]",
            "p[style*=margin-left:27]",
            "p[style*=margin-left:28]",
            "p[style*=margin-left:29]",
            "p[style*=margin-left:30]",
            "p[style*=margin-left:31]",
            "p[style*=margin-left:32]",
            "p[style*=margin-left:33]",
            "p[style*=margin-left:34]",
            "p[style*=margin-left:35]",
            "p[style*=margin-left:36]",
            "p[style*=margin-left:37]",
            "p[style*=margin-left:38]",
            "p[style*=margin-left:39]",
            "p[style*=margin-left:40]",
            "p[style*=margin-left:41]",
            "p[style*=margin-left:42]",
            "p[style*=margin-left:43]",
            "p[style*=margin-left:44]",
            "p[style*=margin-left:45]",
            "p[style*=margin-left:46]",
            "p[style*=margin-left:47]",
            "p[style*=margin-left:48]",
            "p[style*=margin-left:49]",
            "p[style*=margin-left:50]",
            "p[style*=margin-left:51]",
            "p[style*=margin-left:52]",
            "p[style*=margin-left:53]",
            "p[style*=margin-left:54]",
            "p[style*=margin-left:55]",
            "p[style*=margin-left:56]",
            "p[style*=margin-left:57]",
            "p[style*=margin-left:58]",
            "p[style*=margin-left:59]",
            "p[style*=margin-left:60]",
            "p[style*=margin-left:61]",
            "p[style*=margin-left:62]",
            "p[style*=margin-left:63]",
            "p[style*=margin-left:64]",
            "p[style*=margin-left:65]",
            "p[style*=margin-left:66]",
            "p[style*=margin-left:67]",
            "p[style*=margin-left:68]",
            "p[style*=margin-left:69]"]
opening  = []
indent_css = { unit = 4, base = 0 }            # pdf-text margin-left = spaces; body paragraphs at 3-4 (hint only)

[MI.const.ladder]
types = ["num", "lower", "roman_lower", "upper"]   # art. I § 27: (2)(b)(i); (1)(a) elsewhere
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[MI.const.containers]
title    = { match = '^(?P<heading>CONSTITUTION OF THE STATE OF MICHIGAN OF 1963)$', tag = "title", rank = 1, id = "", heading = "self" }
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)$', tag = "article", rank = 2, id = "a{num_arabic}" }   # name: next centred line
schedule = { match = '^(?P<heading>SCHEDULE AND TEMPORARY PROVISIONS)$', tag = "level", rank = 2, id = "schedule", heading = "self" }

[MI.const.sections]
match = '^§\s*(?P<num>\d+[a-z]?)\s+(?P<heading>.+)$'   # the catchline row opens the section
lead  = '^Sec\.\s+\d+[a-z]?\.\s*'              # "Sec. 27. (1) ...": the restated number is text, (1) opens a level
bold  = false
scope = "container"                            # numbers restart per article

[MI.const.notes]
sourceCredit  = '^History:'
editorialNote = ["^Compiler’s note:", "^Compiler's note:", "^Former constitution:"]

[MI.const.cite]
# "Mich. Const. art. I, § 11" (Bluebook); Michigan courts: "Const 1963, art 1, § 11" (no state named: bare)
full    = ['Mich\.?\s+Const\.?(?:\s+(?:of\s+)?1963)?', 'Michigan\s+Constitution(?:\s+of\s+1963)?']
bare    = ['Const\.?\s+1963']
section = '\d{1,2}[a-z]?'                    # sections are 1-2 digits (10a): a later bare "§ 790.01" is not one
item    = "const"
label   = "Mich. Const. art. {roman}[, § {sec}]"
examples = [["Const 1963, art 1, § 11", "mi-const:art-1:11", "Mich. Const. art. I, § 11"],
            ["Mich. Const. art. IX, § 25", "mi-const:art-9:25"],
            ["Mich Const 1963, art 6, § 1", "mi-const:art-6:1"]]

# ---------------------------------------------------------------- Michigan Compiled Laws (HTML per chapter)
# /Laws/ChapterIndex lists 241 objects: mcl-chapN, and ranges kept as one object where one act spans several chapters
# (mcl-chapters-61-75 = the General Law Village Act, 61.1-75.12). Each object's /Home/Document?objectName=mcl-<obj> page
# offers "HTML Version" /Home/RenderDoc?objectName=mcl-<obj> and "PDF Version" /documents/mcl/pdf/MCL-<OBJ>.pdf.
# Batch 4c: the RenderDoc HTML is the source the PDF is printed from (same @page footer text), with the structure in
# classes, so it is used instead of the PDF (pdf-text glued every column-0 "History:" line into the section text):
#   div.chapterWrapper > div.chapterHeading  h1.h1 "Chapter 26" + h2.h2 "SUPREME COURT REPORTS"
#   div.statuteWrapper > div.statuteHeading  h1.h2 act name + h2.h3 "Act 385 of 1927"; p title; div.editorials
#   div.divisionWrapper > div.divisionHeading  parts / chapters inside an act (h?.h3..h5)
#   div.sectionWrapper  h1.h4 "26.1 Catchline."; p "Sec. 1."; p text (labels lead, &nbsp; indent); div.editorials
#                       p: "<b>History:</b> ...<br><b>Former Law:</b> ..."
