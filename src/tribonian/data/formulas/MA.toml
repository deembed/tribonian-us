[MA.gl.html]
# root: the content column -- the first div.col-xs-12 whose text starts with the toolbar (the sidebar, the
# title bar and the footer start otherwise)
root     = "div.col-xs-12:matches(^Print Page)"
blocks   = ["p"]
headings = ["h2"]
opening  = []
drop     = ["div.btn-toolbar"]                # Print Page / Previous / Next buttons

[MA.gl.ladder]
# G.L. numbering is not uniform: most sections run (a) (1) (i) (A), but many open with (1) and put (a) under it
# (93A s.9: (7)(a)), (1)(a)(1)(i) occurs (90 s.24), and (b)(i) (ii) (265 s.13A). Each level takes several types;
# the ladder picks the reading that continues the open numbering (roman before lower at depth 1: (b)(i)).
types = [["lower", "num"], ["num", "roman_lower", "lower"], ["roman_lower", "upper", "lower", "num"], ["upper", "roman_lower"]]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[MA.gl.sections]
# The text opens "Section 13A. (a) Whoever ...": the section starts there, so a label right after the number is
# read. The page heading before it, h2 "Section 13A: Assault or assault and battery; ...", is the section's
# heading (heading_before; the "Section 13A:" prefix stays in it -- the parser keeps the whole block).
# A repealed (or amended-away) section's page has no text, only the h2 "Section 6 to 8: Repealed, 1962, 285, Sec. 2",
# "Section 7A: Amended by 1931, 394, Sec. 182 into a special act": that h2 is the section itself (num + heading). Half/three-quarter sections print as "13B1/2", "13H3/4" (13B 1/2, 13H 3/4).
match = '^Section\s+(?P<num>\d+[A-Za-z]*(?:[13]/[24])?(?:\s+to\s+\d+[A-Za-z]*(?:[13]/[24])?)?)(?:\.(?=\s|$)|:\s*(?P<heading>(?:Repealed|Amended|Transferred|Renumbered|Omitted|Expired|Stricken|Struck|Annulled|Superseded)\b\D*\d{4}.*)$)'
bold  = false
heading_before = '^Section\s+\S+:'
scope = "title"
# Groups: ordinal clauses of definition sections (4 s.7: "First,", "Second A,", "Twenty-sixth,", "Forty-third,"):
# each is a level; the (a) (b) ... after it are its own (clause Twenty-sixth (a)-(x)). Ids: /s7/twenty-sixth/a.
# (Defined terms -- 209A s.1 "''Coercive control'', either: (a) ... (b)" -- are NOT groups: in most sections the
# definitions sit inside subsection (a), and a group there captures the (b) that follows. See status feature 6.)
group = '''^(?P<num>(?:(?:(?:Twenty|Thirty|Forty|Fifty|Sixty|Seventy|Eighty|Ninety)-)?(?:[Ff]irst|[Ss]econd|[Tt]hird|[Ff]ourth|[Ff]ifth|[Ss]ixth|[Ss]eventh|[Ee]ighth|[Nn]inth)|Tenth|Eleventh|Twelfth|Thirteenth|Fourteenth|Fifteenth|Sixteenth|Seventeenth|Eighteenth|Nineteenth|Twentieth|Thirtieth|Fortieth|Fiftieth|Sixtieth|Seventieth|Eightieth|Ninetieth|One hundredth)(?:\s+[A-Z]{1,2}(?:\s?\d+)?)?(?=,\s))'''
group_id = "{num}"
group_text = "text"                           # the clause paragraph is law text; its ordinal names the level

[MA.gl.notes]
# Bracketed editorial lines that stand before the section's text or between unnumbered paragraphs:
# "[ First paragraph effective until March 3, 2026. For text effective ..., see below.]" (265 s.13D). Only these:
# a note is written after the section's numbered levels (USLM order), so the ones INSIDE a numbered run --
# "[There is no subclause (k).]", "[ Subclause (x) of clause Twenty-sixth inserted by ...]" -- stay text in place.
editorialNote = { match = '^\[\s*(?:Text of section|First paragraph|Introductory paragraph|Opening paragraph)\b', single = true }

