# ---------------------------------------------------------------- Constitution of the Commonwealth
# One page, /Laws/Constitution, clean semantic markup: h2 parts, h3 chapter/section lines and amendment
# articles, h4 articles of the Declaration of Rights and the Frame of Government, <p> text.
#   PREAMBLE / PART THE FIRST (+ h3 name) / PART THE SECOND / ARTICLES OF AMENDMENT. / Note. / AMENDMENTS REJECTED
#   h3 "Chapter I, LEGISLATIVE POWER, Section I"   a chapter's section (one line opens one container)
#   h4 "Article I." (parts 1, 2), h3 "Article XLVIII." (amendments)   -> sections, numbered per container
[MA.const]
name    = "Constitution of the Commonwealth of Massachusetts"
doc     = "/us-ma/const"                      # /us-ma/const/pt1/sXIV, /us-ma/const/pt2/chIIsI/sI, /us-ma/const/amend/sXLVIII
fetch   = "template"
url     = "https://malegislature.gov/Laws/Constitution"
items   = ["constitution"]
file    = "{item}.html"
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "none stated"

[MA.const.html]
# the text column: the col-md-8 div whose text starts PREAMBLE (the title bar's col-md-8 holds the page h1)
root     = "div.col-md-8:matches(^PREAMBLE)"
blocks   = ["p", "h3", "h4"]
headings = ["h2"]
# bare <strong>/<em> lines between blocks: "The Frame of Government." after PART THE SECOND, "The General
# Court." after a chapter's section line -- each run becomes a block (the container's name)
loose    = ["div.col-md-8"]
opening  = []
drop     = ["p:matches(^Back to Top$)"]       # the page-end link

[MA.const.ladder]
types = ["lower", "num"]                      # (a)(b) in Art. LXXXVII; nothing deeper
tags  = ["subsection", "paragraph"]

[MA.const.containers]
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 1, id = "preamble", heading = "self" }
# PART THE FIRST: its name is the h3 that follows ("A Declaration of the Rights ...")
part1    = { match = '^PART THE (?P<num>FIRST)$', tag = "part", rank = 1, id = "pt1", any = true }
# PART THE SECOND: its name is the bare <strong> after it ("The Frame of Government.")
part2    = { match = '^PART THE (?P<num>SECOND)$', tag = "part", rank = 1, id = "pt2", any = true }
# "Chapter I, LEGISLATIVE POWER, Section I" / "Chapter II, Section II." / "Chapter V, THE UNIVERSITY ... Section I.":
# the whole line is the number; the container's name is the bare <em> after it ("The General Court.")
chapsec  = { match = '^Chapter (?P<ch>[IVX]+),.*\bSection (?P<num>[IVX]+)\.?$', tag = "chapter", rank = 2, id = "ch{ch}s{num}", any = true }
# "Chapter III. JUDICIARY POWER." / "Chapter VI, OATHS AND SUBSCRIPTIONS; ..."
chapter  = { match = '^Chapter (?P<num>[IVX]+)[.,]\s*(?P<heading>.+)$', tag = "chapter", rank = 2, id = "ch{num}", any = true }
amend    = { match = '^(?P<heading>ARTICLES OF AMENDMENT\.?)$', tag = "level", rank = 1, id = "amend", heading = "self" }
note     = { match = '^(?P<heading>Note\.)$', tag = "level", rank = 1, id = "note", heading = "self" }
rejected = { match = '^(?P<heading>AMENDMENTS REJECTED BY THE PEOPLE\.?)$', tag = "level", rank = 1, id = "rejected", heading = "self" }

[MA.const.sections]
match = '^Article (?P<num>[IVXLC]+)\.?$'      # the h4/h3 line alone; its text follows in <p>s
bold  = false
alone = true
scope = "container"

[MA.const.notes]
