# ---------------------------------------------------------------- General Laws of Massachusetts
# Published by the General Court at malegislature.gov (unofficial; the Official Edition is printed every two
# years). Site layout (ASP.NET MVC, no print or whole-chapter view; PDF/HTML per section only):
#   /Laws/GeneralLaws                                   Parts I-V
#   /Laws/GeneralLaws/PartI                             titles; the chapter lists are loaded by AJAX
#                                                        (/Laws/GeneralLaws/GetChaptersForTitle?partId=&titleId=&code=)
#   /Laws/GeneralLaws/PartI/TitleI/Chapter1             the chapter: <ul class="generalLawsList"> of section links
#   /Laws/GeneralLaws/PartI/TitleI/Chapter1/Section7A   one section per page
# Only per-section pages exist, so: index fetch, the chapter is the item (one USLM file per chapter).
# Chapter numbers carry letters (7A, 93A, 6D); the chapter URL also names the Part and Title, which the
# item alone does not give: the ids table at the end of this formula supplies it.
# Markup of a section page (inside <main>):
#   <div class="btn-toolbar">Print Page / Prev / Next</div><hr>
#   <h2 class="genLawHeading">Section 1: <small>Citizens of commonwealth defined</small></h2>
#   <p><p>Section 1. All persons who are citizens ...</p></p>       the text repeats "Section 1." (official form)
[MA.gl]
name    = "General Laws of Massachusetts"
doc     = "/us-ma/gl"                         # /us-ma/gl/ch93A/s9/1 (one USLM file per chapter)
fetch   = "index"
item    = ""                                  # chapters as printed: 1, 7A, 93A, 6D
index_file = "Chapter{item}.htm"
# the chapter page's section list: <a href="/Laws/GeneralLaws/PartI/TitleI/Chapter1/Section7A"><span class="section">
# (tied to that markup so the site's "popular laws" links never count)
links   = '<a href="(/Laws/GeneralLaws/[^"]+/Section[^"/]+)">\s*<span class="section">'
# The chapter URL names its Part and Title: {id} from the ids table (the site 404s a wrong title).
layers  = [ { name = "current", url = "https://malegislature.gov/Laws/GeneralLaws/{id}/Chapter{item}" } ]
save_as = "url"                               # every chapter's pages are Section1, Section2 ...: name them by URL
title_id = ['^(.*)$', 'ch\1']                 # /us-ma/gl/ch93A/s9
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "none stated"
# the chapter page: <h2 class="genLawHeading">Chapter 1: <small>JURISDICTION ...</small></h2>; the page's only <small>
title   = { name = "small" }

