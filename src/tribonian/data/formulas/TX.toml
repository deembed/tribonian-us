# TX.toml -- Texas: the codes (TX.codes, one formula for all 30 codes) and the Texas Constitution (TX.const).
# Source: statutes.capitol.texas.gov, Texas Legislative Council (TLC).
#
# ROUTE (Batch 3c, from the JS bundle): PLAIN STATIC HTML, one file per chapter, on a separate FILE SERVER.
#   statutes.capitol.texas.gov is an Angular app; every path (even robots.txt, /Docs/...) answers 200 with the
#   same 250,874-byte shell. The app's "docs/**" route (chunk-UA4VGO6K) redirects in the browser to
#     FileServerPath + "/<CODE>/htm/<CODE>.<chapter>.htm"      (also /pdf/...pdf, /word/...docx; per-section
#     FileServerPath + "/<CODE>/htm/<CODE>.<chapter>/<CODE>.<section>.htm" exists too)
#   and the download route sends "zips"/"sdocs"/"archivedscans" to FileServerPath + "/Zips/<name>".
#   chunk-7GRZWKYH.js: {environment:"PROD", TCASCore:"https://tcss.legis.texas.gov/api/",
#                       FileServerPath:"https://tcss.legis.texas.gov/resources"}
#   Chapter files are what the site itself serves for download, so the zip route is not needed.
# Chapter file markup (resources/GV/htm/GV.311.htm, probed):
#   <body><pre> of <p>: p.center[style=font-weight:bold] "GOVERNMENT CODE", "TITLE 3. LEGISLATIVE BRANCH",
#   "SUBTITLE B. ...", "CHAPTER 311. ...", "SUBCHAPTER A. ..."; empty p.left holding <a name> anchors;
#   p.left[text-indent:7ex] <a style="font-weight:bold">Sec. 311.001.  SHORT TITLE.</a>  body;
#   p.left[text-indent:13ex] "(1) ..."; history p.left "Acts 1985, ..." / "Added by Acts ..." /
#   "Amended by:" followed by indented "Acts 2005, ..." lines.

[TX.codes]
name    = "Texas Statutes (codes)"
doc     = "/us-tx/codes"                    # files /us-tx/codes/GV.ch311 (section numbers repeat across codes)
fetch   = "template"
item    = ""                                # items "<CODE>.<chapter>" as the site names files: GV.311, AG.1, HS.81A
item_match = '(?P<code>[A-Z0-9]{2})\.(?P<chapter>.+)'   # -> {code} for the folder; one formula serves all 30 codes
url     = "https://tcss.legis.texas.gov/resources/{code}/htm/{item}.htm"
edition = "current"
file    = "{item}.htm"
title_id = ['^([A-Z0-9]{2})\.(.+)$', '\1.ch\2']     # GV.311 -> GV.ch311
wrap    = { tag = "level", id = "{item}", rebase = true }   # the template build ignores title_id: ids go under /us-tx/codes/PE.1 (section numbers repeat across codes)
reject  = 'data-beasties-container|id="ng-state"'     # the app shell (statutes.capitol.texas.gov answers 200 with it everywhere)
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "none stated (Information page: privacy policy only); robots.txt allows /resources/ on tcss.legis.texas.gov"

# catalog: every item (title/chapter/article) this code has, from the publisher's index (494) -- the browse index.
