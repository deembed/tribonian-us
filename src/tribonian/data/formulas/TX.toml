[TX.codes.html]
blocks   = ["p"]
headings = ["p:centered"]                   # p.center, bold: code name, TITLE, SUBTITLE, CHAPTER, SUBCHAPTER
opening  = ["a"]                            # the bold <a> "Sec. 311.001.  SHORT TITLE." opens a section

[TX.codes.ladder]
# Texas: (a) subsection, (1) subdivision, (A) paragraph, (i) subparagraph; insertions (a-1), (1-a)
types = [["lower"], ["num"], ["upper"], ["roman_lower"]]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[TX.codes.containers]
# every file repeats its code name first ("GOVERNMENT CODE") -> a level with no id, like CO's constitution title
code       = { match = "^(?P<heading>[A-Z][A-Z ,.&'-]*CODE(?: - NOT CODIFIED)?|AUXILIARY WATER LAWS|VERNON'S CIVIL STATUTES)$", tag = "level", rank = 1, id = "", heading = "self", sections = "here" }   # sections hang off the file: GV.ch311/s311.002
title      = { match = '^TITLE\s+(?P<num>\d+[A-Z]?)\.\s+(?P<heading>.+)$', tag = "title", rank = 2, id = "t{num}" }
subtitle   = { match = '^SUBTITLE\s+(?P<num>[A-Z0-9-]+)\.\s+(?P<heading>.+)$', tag = "subtitle", rank = 3, id = "st{num}" }
chapter    = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]?)\.\s+(?P<heading>.+)$', tag = "chapter", rank = 4, id = "ch{num}" }
subchapter = { match = '^SUBCHAPTER\s+(?P<num>[A-Z0-9-]+)\.\s+(?P<heading>.+)$', tag = "subchapter", rank = 5, id = "sch{num}" }

[TX.codes.sections]
# opening run "Sec. 311.001.  SHORT TITLE." ; "Sec. 311.0015." ; "Sec. 51.001-a." (GUESS for the odd forms)
match = '^Sec\.\s+(?P<num>\d+[A-Z]?\.\d+[A-Za-z0-9-]*)\.\s+(?P<heading>.+?)$'
scope = "title"                             # overridden by sections = "here" on the code line
decimal = true                              # 311.0015 sorts between 311.001 and 311.002

[TX.codes.notes]
# history: "Acts 1985, 69th Leg., ...", "Added by Acts ...", "Amended by:" + indented "Acts 2005, ..." lines
sourceCredit = ['^(Added by|Amended by|Acts \d{4}|Renumbered from|Transferred|Redesignated|Repealed by)']

[TX.codes.cite]
# how cases cite the codes (statecites.py): Bluebook "Tex. Gov't Code Ann. § 311.001 (West 2013)", "Tex. Code Crim.
# Proc. Ann. art. 38.22"; older "V.T.C.A., Penal Code § 22.01", "Vernon's Ann. Texas C.C.P."; Texas courts also
# without the state: "Penal Code section 22.01", "article 38.22 of the Code of Criminal Procedure". Each sub pattern
# carries its own "Code" (Code Crim. Proc. puts it first). Sections always have the chapter before the dot.
full    = ['Tex(?:as|\.)?\s*{sub}(?:\s*Ann(?:otated|\.))?',
           'V\.\s?T\.\s?C\.\s?A\.,?\s*(?:Tex(?:as|\.)\s*)?{sub}',
           'Vernon(?:\x27|’)s\s+(?:Ann(?:otated|\.)\s*)?(?:Tex(?:as|\.)\s*)?{sub}(?:\s*Ann(?:otated|\.))?']
bare    = ['{sub}',
           '(?:§|[Ss]ection|[Aa]rt(?:icle|\.))\s*(?P<sec>\d+[A-Z]?\.\d+[A-Za-z0-9]*(?:-[a-z0-9]+)?)(?![\w])(?:\s?\([A-Za-z0-9]{1,4}\))*,?\s+of\s+the\s+{sub}']
after   = ['of\s+the\s+Texas\s+{sub}']
section = '\d+[A-Z]?\.\d+[A-Za-z0-9]*(?:-[a-z0-9]+)?'
item    = ['^(\d+[A-Z]?)\.', '{sub}.{1}']      # Gov't Code 311.001 -> GV.311; Code Crim. Proc. art. 42A.054 -> CR.42A
label   = "Tex. {name} {sec}"
examples = [["Tex. Gov't Code Ann. § 311.021(1) (West 2013)", "tx-codes:GV/311.021", "Tex. Gov't Code Ann. § 311.021"],
            ["Texas Government Code section 2001.038", "tx-codes:GV/2001.038", "Tex. Gov't Code Ann. § 2001.038"],
            ["V.T.C.A., Government Code § 552.101", "tx-codes:GV/552.101"],
            ["Gov't Code § 2001.174", "tx-codes:GV/2001.174"],
            ["section 2001.171 of the Government Code", "tx-codes:GV/2001.171"]]
# not in examples because the catalog lists Government Code chapters only (the item check would fail), but read
# and resolved the same way: "Tex. Penal Code Ann. § 1.07(a)(8)" -> tx-codes:PE/1.07 (PE.1 is built here),
# "Tex. Code Crim. Proc. Ann. art. 38.22, § 3" -> tx-codes:CR/38.22 (CR.38), "Tex. Fam. Code § 161.001" -> FA.161

[TX.codes.cite.sub]
AG = ['Agric(?:ulture|\.)\s*Code']
AL = ['Alco(?:holic|\.)\s*Bev(?:erage|\.)\s*Code']
