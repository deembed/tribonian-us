# PA.toml -- Pennsylvania Consolidated Statutes (Pa.C.S.) and Constitution.
#
# STATUS: needs-probe. Fetch side is established from the index page
# (build/probe/www.palegis.us/statutes_consolidated.html); the parser side ([html], ladder, containers,
# sections, notes) is PROVISIONAL -- written from the known shape of Pa.C.S., not yet tested on a text
# page. Revise once build/probe/www.palegis.us/ holds a view-statute?txtType=HTM page.
#
# Source: palegis.us (the General Assembly's site; legis.state.pa.us retired Jan 2026 and 302s here).
# The index lists, per title, one whole-title file in three formats:
#   /statutes/consolidated/view-statute?txtType=HTM&ttl=NN   (also PDF, DOC)
# ttl is two digits ("01" ... "79", gaps at 19, 21, 41, 55, 56); ttl=0 is the Constitution.
# Chapter- and section-level views exist only behind a POST form (/statutes/consolidated/by-section),
# so the whole-title GET is the fetch unit: one request per title.
#
# The Unconsolidated Statutes (Purdon's "P.S.", by act) are a separate code, not started: their index is
# browse-by-name?letter=A..Z, one page per act -- a later "index" formula (PA.ps).

# ---------------------------------------------------------------- Pennsylvania Consolidated Statutes
[PA.cs]
name    = "Pennsylvania Consolidated Statutes"
doc     = "/us-pa/cs"                         # /us-pa/cs/t1/s1921/a  (section numbers are unique within a title)
fetch   = "template"
url     = "https://www.palegis.us/statutes/consolidated/view-statute?txtType=HTM&ttl={item}"
item    = "%02d"                              # title 1 -> "01", as the index links it
file    = "title-{item}.htm"
edition = "current"                           # the site publishes only the current text; no edition in the URL
encoding = "utf-8"                            # the index page is UTF-8; CONFIRM on the text page (old LI files were cp1252 Word HTML)
family  = "html-paragraphs"
terms   = "none stated"

[PA.cs.html]
# PROVISIONAL. The legacy LI title files were Word-filtered HTML (centered/bold paragraphs, like Colorado),
# so the Colorado defaults are the starting guess. If palegis wraps the file in its site chrome, set root
# to the content element and drop nothing else.
blocks   = ["p"]
headings = ["p:centered"]
opening  = ["b", "strong"]

[PA.cs.ladder]
# Pa.C.S. drafting style: (a)(1)(i)(A)(I), the same order as the US Code.
types = ["lower", "num", "roman_lower", "upper", "roman_upper"]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[PA.cs.containers]
# Pa.C.S. hierarchy: TITLE > PART > ARTICLE > CHAPTER > SUBCHAPTER > section. PROVISIONAL regexes.
title      = { match = '^TITLE\s+(?P<num>\d+)$', tag = "title", rank = 1, id = "" }
part       = { match = '^PART\s+(?P<num>[IVXL]+[A-Z]?)$', tag = "part", rank = 2, id = "pt{num}" }
article    = { match = '^ARTICLE\s+(?P<num>[A-Z]+(?:\.\d+)?)$', tag = "article", rank = 3, id = "a{num}" }
chapter    = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]?)$', tag = "chapter", rank = 4, id = "ch{num}" }
subchapter = { match = '^SUBCHAPTER\s+(?P<num>[A-Z]+(?:\.\d+)?)$', tag = "subchapter", rank = 5, id = "sch{num}" }

[PA.cs.sections]
# "§ 1921.  Legislative intent controls." -- section numbers are title-unique (chapter digits lead).
match = '^§\s*(?P<num>\d+(?:\.\d+)?[A-Z]?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"
toc   = ['^Sec\.\s', '^\d+(?:\.\d+)?\.\s']        # chapter tables of contents: "Sec." header and "1921.  Heading." lines

[PA.cs.notes]
# Each section is followed by its history parenthetical "(Dec. 6, 1972, P.L.1339, No.290, ...)" and
# notes ("Cross References.", "Effective Date.", "References in Text."). PROVISIONAL.
sourceCredit  = '^\((?:Jan|Feb|Mar|Apr|May|June|July|Aug|Sept|Oct|Nov|Dec)\.?\s+\d+,\s+\d{4},\s+P\.L\.'
editorialNote = ['^Cross References\.', '^References in Text\.', '^Effective Date\.', '^\d{4} Amendment',
                 '^Applicability\.', '^Suspension by', '^Special Provisions in Appendix\.']

# ---------------------------------------------------------------- Constitution of Pennsylvania (ttl=0)
[PA.const]
inherit = "PA.cs"
name    = "Constitution of Pennsylvania"
doc     = "/us-pa/const"                      # /us-pa/const/a1/s7
item    = ""                                  # ttl=0 exactly (the index links "ttl=0", not "00")
items   = ["0"]
file    = "constitution.htm"
dir     = "cs"                                # shares the folder: law/pa/cs/constitution.htm

[PA.const.containers]
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+(?:-[A-Z])?)$', tag = "article", rank = 2, id = "a{num_arabic}" }
schedule = { match = '^(?P<heading>SCHEDULES?.*)$', tag = "level", rank = 2, id = "schedule", heading = "self" }

[PA.const.sections]
match = '^§\s*(?P<num>\d+(?:\.\d+)?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "container"                           # numbers restart per article
