# NC.toml -- North Carolina: General Statutes (NC.gs) and Constitution (NC.const).
# Source: the General Assembly's site, www.ncleg.gov. Both are single static pages per unit.

# ---------------------------------------------------------------- North Carolina General Statutes
# One HTML page per chapter (the GS's top unit; 1, 1A, 7B, 115C, 143B ...):
#   /EnactedLegislation/Statutes/HTML/ByChapter/Chapter_<n>.html  (listed by /Laws/GeneralStatutesTOC).
# Generated (not Word) HTML: every line is a <p> or <h1>-<h6> with a one-span body; formatting lives in
# hashed CSS classes ("cs2E44D3A6" = centered, 6pt after). Headings: h3 "Chapter 1." / h3 its name;
# h4 "SUBCHAPTER I. NAME."; centered p "Article 1." / centered p its name; h6 "Part 1. Name.";
# h1 = centered captions inside statutory forms. Sections: a paragraph of its own, "§ 1-1.  Remedies."
# or "§§ 1-440.47 through 1-440.56: Repealed by ...". Ladder (a)(1)a.1.; history "(C.C.P., s. 1; ...)"
# sits inline at the end of the last paragraph (no separate block), so it stays in the text.
[NC.gs]
name    = "North Carolina General Statutes"
doc     = "/us-nc/gs"                         # /us-nc/gs/ch1/... ; sections /us-nc/gs/s1-1 (numbers unique statewide)
fetch   = "template"
url     = "https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/ByChapter/Chapter_{item}.html"
edition = "current"                           # the site carries only the current text, no edition in the URL
file    = "Chapter_{item}.html"               # item is the chapter as written: 1, 1A, 115C (no zero padding)
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "none stated"

[NC.gs.html]
blocks   = ["p"]
# The centered paragraph class is a CSS-content hash (.cs2E44D3A6{text-align:center...}); the parser's
# :centered only sees inline align/style, so it is named here. h1 = centered captions in forms.
headings = ["h1", "h3", "h4", "h6", "p.cs2E44D3A6"]
opening  = []                                 # sections are matched on the whole paragraph (sections.bold = false)

[NC.gs.ladder]
# The source ladder is (a)(1)a.1. -- target: ["lower", "num", "lower.", "num."]. Two shared-code gaps keep the
# dotted levels out for now (see build/dispatch/NC.status.md): split_labels' DOTTED pattern does not read
# lowercase "a.", and verify's numbering check reads a dotted level's stored num ("1") as not a "num." label.
# Until then "a." and "1." lines stay text inside their (1) paragraph -- nothing lost, only flatter.
# Inserted labels (a1) (1a) are not label types yet either: they stay text in the preceding sibling.
types = ["lower", "num"]
tags  = ["subsection", "paragraph"]

[NC.gs.containers]
chapter    = { match = '^Chapter\s+(?P<num>\d+[A-Z]*)\.$', tag = "chapter", rank = 1, id = "ch{num}" }   # name: next h3
# "SUBCHAPTER I. DEFINITIONS AND GENERAL PROVISIONS." -- number and name in one line: all of it is the heading
subchapter = { match = '^(?P<heading>SUBCHAPTER\s+(?P<num>[IVXL]+[A-Z]?)\.\s.*)$', tag = "subchapter", rank = 2, id = "sch{num}", heading = "self" }
article    = { match = '^Article\s+(?P<num>\d+[A-Z]*)\.?$', tag = "article", rank = 3, id = "a{num}" }  # "Article 46" lacks its dot
part       = { match = '^(?P<heading>Part\s+(?P<num>\d+[A-Z]*)\.\s.*)$', tag = "part", rank = 4, id = "pt{num}", heading = "self" }

[NC.gs.sections]
# "§ 1-1.  Remedies." | "§ 1-440.57: Repealed by ..." | "§§ 1-441 through 1-471: Superseded by ..."
match = '^§§?\s*(?P<num>\d+[A-Z]*-\d+(?:\.\d+)*[A-Z]*(?:\s+(?:through|to|and)\s+\d+[A-Z]*-\d+(?:\.\d+)*[A-Z]*)?)[.:]\s*(?P<heading>.*)$'
bold  = false                                 # the heading line is its own paragraph; matched on its whole text
scope = "title"

[NC.gs.notes]
editorialNote = ['^Note:', "^Editor's note"]

# ---------------------------------------------------------------- Constitution of North Carolina
# One Word-filtered HTML page (windows-1252): ARTICLE I / its name centered (align=center), sections open
# with a bold run "Section 1. Heading." / "Sec. 2. Heading.", ladder (1)(a) with inserted (1a) (a1).
# Contingent amendments appear as two versions: "(Effective until contingency met - see note)" and
# "(Effective once contingency met - see note)", followed by a "Note: ..." paragraph.
[NC.const]
name    = "Constitution of North Carolina"
doc     = "/us-nc/const"                      # /us-nc/const/a1/s1
fetch   = "template"
url     = "https://www.ncleg.gov/EnactedLegislation/Constitution/{item}.html"
edition = "current"
items   = ["NCConstitution"]                  # always the one file
file    = "{item}.html"
encoding = "cp1252"
family  = "html-paragraphs"

[NC.const.html]
blocks   = ["p"]
headings = ["p:centered"]
opening  = ["b", "strong", "p.aSection"]   # p.aSection is bold by its Word style, no <b> (art. I sec. 24, art. VI sec. 3)

[NC.const.ladder]
types = ["num", "lower"]                      # (1)(a)
tags  = ["subsection", "paragraph"]

[NC.const.containers]
title    = { match = '^(?P<heading>NORTH CAROLINA STATE CONSTITUTION)$', tag = "title", rank = 1, id = "", heading = "self" }
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)$', tag = "article", rank = 2, id = "a{num_arabic}" }

[NC.const.sections]
match = '^(?:Section|Sec\.)\s+(?P<num>\d+[A-Za-z]?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "container"                           # numbers restart per article
versions = '^\(Effective (?:until|once) contingency met'

[NC.const.notes]
editorialNote = ['^Note:']
