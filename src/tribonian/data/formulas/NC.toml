[NC.gs.html]
blocks   = ["p"]
# Centering is in hashed CSS classes (.cs2E44D3A6{text-align:center...}); :centered reads the class rules.
# h1 = centered captions in forms.
headings = ["h1", "h3", "h4", "h6", "p:centered"]
opening  = ["span:bold"]                      # section lines are one bold span (bold by CSS class, read by :bold)

[NC.gs.ladder]
# (a)(1)a.1., with insertions (a1) (1a) between siblings
types = ["lower", "num", "lower.", "num."]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[NC.gs.containers]
chapter    = { match = '^Chapter\s+(?P<num>\d+[A-Z]*)\.$', tag = "chapter", rank = 1, id = "ch{num}" }   # name: next h3
# "SUBCHAPTER I. DEFINITIONS AND GENERAL PROVISIONS." -- number and name in one line: all of it is the heading
subchapter = { match = '^(?P<heading>SUBCHAPTER\s+(?P<num>[IVXL]+[A-Z]?)\.\s.*)$', tag = "subchapter", rank = 2, id = "sch{num}", heading = "self" }
article    = { match = '^Article\s+(?P<num>\d+[A-Z]*)\.?$', tag = "article", rank = 3, id = "a{num}" }  # "Article 46" lacks its dot
part       = { match = '^(?P<heading>Part\s+(?P<num>\d+[A-Z]*)\.\s.*)$', tag = "part", rank = 4, id = "pt{num}", heading = "self" }

[NC.gs.sections]
# "§ 1-1.  Remedies." | "§ 1-440.57: Repealed by ..." | "§§ 1-441 through 1-471: Superseded by ..."
# Court-rule chapters (1A Rules of Civil Procedure; likely 8C Evidence) hold one section, § 1A-1, followed by
# bold "Rule 4. Process." lines under Article headings: each rule is taken as a section; its num is the rule
# number (num text "Rule 4." kept) -> /us-nc/gs/s4. GS section numbers always carry a hyphen, so no collision
# within the GS; a rule-specific id ("r4") needs a shared feature (see NC.status.md).
match = '^(?:§§?\s*|Rule\s+)(?P<num>\d+(?:\.\d+)?(?=\.\s)|\d+[A-Z]*-\d+(?:\.\d+)*[A-Z]*(?:\s+(?:through|to|and)\s+\d+[A-Z]*-\d+(?:\.\d+)*[A-Z]*)?)(?:[.:](?!\d)|(?=\s))\s*(?P<heading>.*)$'
# the number's closing period is missing once ("§ 20-123.2 Speedometer."): a space ends it too, and a period
# followed by a digit is part of the number, not its end
bold  = true                                  # matched on the bold opening run only ("Rule 4." in body text is not a start)
scope = "title"
# Not decimal: 1-75.9 < 1-75.10 (whole numbers after the point), yet 20-7.01 < 20-7.1 (a leading zero is an
# insertion before .1). Neither section_key mode orders both; the integer mode flags only the ".0N -> .1" steps.
# alternate texts by effective date: "§ 20-4.01. (Effective until July 1, 2027) Definitions." -- searched in the heading
versions = '^\((?:Effective|Expires)\b'

[NC.gs.notes]
editorialNote = ['^Note:', "^Editor's note"]

[NC.gs.cite]
# "N.C. Gen. Stat. § 14-17", "N.C.G.S. § 14-17", "G.S. 105-164.4" (North Carolina courts: bare)
full    = ['N\.\s?C\.\s?Gen\.\s?Stat\.(?:\s?Ann\.)?', 'N\.\s?C\.\s?G\.\s?S\.', 'North\s+Carolina\s+General\s+Statutes']
bare    = ['G\.\s?S\.']
section = '\d+[A-Z]*-\d+(?:\.\d+)*[A-Z]?'
item    = ['^(\d+[A-Z]*)-', '{1}']                 # 15A-1340.16 -> chapter 15A
label   = "N.C. Gen. Stat. § {sec}"
examples = [["N.C. Gen. Stat. § 1-52(16) (2023)", "nc-gs:1-52", "N.C. Gen. Stat. § 1-52"],
            ["N.C.G.S. § 14-17", "nc-gs:14-17"],
            ["G.S. 105-164.4", "nc-gs:105-164.4"],
            ["N.C. Gen. Stat. § 1A-1, Rule 12(b)(6)", "nc-gs:1A-1"]]

# ---------------------------------------------------------------- Constitution of North Carolina
# One Word-filtered HTML page (windows-1252): ARTICLE I / its name centered (align=center), sections open
# with a bold run "Section 1. Heading." / "Sec. 2. Heading.", ladder (1)(a) with inserted (1a) (a1).
# Contingent amendments appear as two versions: "(Effective until contingency met - see note)" and
# "(Effective once contingency met - see note)", followed by a "Note: ..." paragraph.
[NC.const]
name    = "Constitution of North Carolina"
doc     = "/us-nc/const"                      # /us-nc/const/a1/s1
fetch   = "template"
url     = "https://www.ncleg.gov/EnactedLegislation/Constitution/{item}.html"
edition = "current"
items   = ["NCConstitution"]                  # always the one file
file    = "{item}.html"
encoding = "cp1252"
family  = "html-paragraphs"

[NC.const.html]
blocks   = ["p"]
headings = ["p:centered"]
opening  = ["b", "strong", "p.aSection"]   # p.aSection is bold by its Word style, no <b> (art. I sec. 24, art. VI sec. 3)

[NC.const.ladder]
types = ["num", "lower"]                      # (1)(a), with insertions (1a) (a1)
tags  = ["subsection", "paragraph"]

[NC.const.containers]
title    = { match = '^(?P<heading>NORTH CAROLINA STATE CONSTITUTION)$', tag = "title", rank = 1, id = "", heading = "self" }
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)$', tag = "article", rank = 2, id = "a{num_arabic}" }

[NC.const.sections]
match = '^(?:Section|Sec\.)\s+(?P<num>\d+[A-Za-z]?)\.\s*(?P<heading>.*)$'
bold  = true
scope = "container"                           # numbers restart per article
versions = '^\(Effective (?:until|once) contingency met'

[NC.const.notes]
editorialNote = ['^Note:']

[NC.const.cite]
full    = ['N\.\s?C\.\s?Const\.?', 'North\s+Carolina\s+Constitution', 'Constitution\s+of\s+North\s+Carolina',
           '[Aa]rt(?:icle)?\.?\s*(?P<art>[IVXL]+|\d+),?\s*(?:§|[Ss]ec(?:tion)?\.?)\s*(?P<sec>\d+[a-z]?)\b,?\s*of\s+(?:the\s+|our\s+)?(?:North\s+Carolina|N\.\s?C\.)\s+Constitution']
bare    = ['[Aa]rt(?:icle)?\.?\s*(?P<art>[IVXL]+|\d+),?\s*(?:§|[Ss]ec(?:tion)?\.?)\s*(?P<sec>\d+[a-z]?)\b,?\s*of\s+(?:the|our)\s+[Ss]tate\s+[Cc]onstitution']
label   = "N.C. Const. art. {roman}[, § {sec}]"
examples = [["N.C. Const. art. I, § 19", "nc-const:art-1:19", "N.C. Const. art. I, § 19"],
            ["Article I, Section 19 of the North Carolina Constitution", "nc-const:art-1:19"],
            ["article IX, section 2 of our State Constitution", "nc-const:art-9:2"]]

# ---------------------------------------------------------------- cite-only (no formula): recognized in cites, no text
[NC.ncac]
name    = "North Carolina Administrative Code"
kind    = "regs"
source_error = "no formula yet: the Office of Administrative Hearings publishes the N.C.A.C. as PDFs per rule (oah.nc.gov)"

[NC.ncac.cite]
# "15A N.C. Admin. Code 2B.0211", "15A NCAC 02B .0211": title, chapter (leading zero dropped), rule
full    = ['(?P<vol>\d{1,2}[A-Z]?)\s*(?:N\.\s?C\.\s?Admin\.\s?Code|N\.\s?C\.\s?A\.\s?C\.|NCAC)\s*(?:§\s*)?0?(?P<chap>[1-9]\d*[A-Z]?)\s*\.\s*(?P<sec>\d{4})']
key     = "{vol}/{chap}.{sec}"                  # the rule number is (?P<sec>): a form with no sec/art group gets one appended
label   = "{vol} N.C. Admin. Code {chap}.{sec}"
examples = [["15A N.C. Admin. Code 2B.0211", "nc-ncac:15A/2B.0211", "15A N.C. Admin. Code 2B.0211"],
            ["15A NCAC 02B .0211", "nc-ncac:15A/2B.0211"]]
