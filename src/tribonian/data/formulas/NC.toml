# NC.toml -- North Carolina: General Statutes (NC.gs) and Constitution (NC.const).
# Source: the General Assembly's site, www.ncleg.gov. Both are single static pages per unit.

# ---------------------------------------------------------------- North Carolina General Statutes
# One HTML page per chapter (the GS's top unit; 1, 1A, 7B, 115C, 143B ...):
#   /EnactedLegislation/Statutes/HTML/ByChapter/Chapter_<n>.html  (listed by /Laws/GeneralStatutesTOC).
# Generated (not Word) HTML: every line is a <p> or <h1>-<h6> with a one-span body; formatting lives in
# hashed CSS classes ("cs2E44D3A6" = centered, 6pt after). Headings: h3 "Chapter 1." / h3 its name;
# h4 "SUBCHAPTER I. NAME."; centered p "Article 1." / centered p its name; h6 "Part 1. Name.";
# h1 = centered captions inside statutory forms. Sections: a paragraph of its own, "§ 1-1.  Remedies."
# or "§§ 1-440.47 through 1-440.56: Repealed by ...". Ladder (a)(1)a.1.; history "(C.C.P., s. 1; ...)"
# sits inline at the end of the last paragraph (no separate block), so it stays in the text.
[NC.gs]
name    = "North Carolina General Statutes"
doc     = "/us-nc/gs"                         # /us-nc/gs/ch1/... ; sections /us-nc/gs/s1-1 (numbers unique statewide)
fetch   = "template"
url     = "https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/ByChapter/Chapter_{item}.html"
edition = "current"                           # the site carries only the current text, no edition in the URL
file    = "Chapter_{item}.html"               # item is the chapter as written: 1, 1A, 115C (no zero padding)
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "none stated"

