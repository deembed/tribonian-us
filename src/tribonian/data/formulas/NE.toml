# NE.toml -- Nebraska: Revised Statutes of Nebraska (NE.rs) and the Nebraska Constitution (NE.const).
#
# Source: nebraskalegislature.gov (Revisor of Statutes). Each chapter 1..90 has a whole-chapter print page,
# /laws/display-chapters.php?chapter=N: one request per chapter (the site has answered "Too many
# connections", so per-section pages are out). The page is bare HTML: no site navigation, no chapter
# heading (nor article headings: chapter 3, which has articles, shows none). One div.printwidth per section:
#   <strong>1-105. Act, how cited.</strong><br>             section number + catchline (the opening run)
#   <p style="text-indent: 1.5em;">(1) ...</p>               law text, one <p> per numbered paragraph
#   <div class="source"><span><strong>Source:</strong></span>Laws ...<br><strong>Effective Date: ...</strong></div>
#   <div class="anno"><span><strong>Annotations</strong></span><ul><div>case note</div>...</ul></div>
#   <div class="cross"><span><strong>Cross References</strong></span><ul><span>item</span><br>...</ul></div>
# The Uniform Commercial Code is not in chapters 1..90 (it has its own pages, /laws/ucc.php?code=...).

[NE.rs]
wrap = { tag = "chapter", id = "ch{item}" }   # chapter pages carry no chapter heading (coordinator, round 2)
name    = "Revised Statutes of Nebraska"
doc     = "/us-ne/rs"                        # /us-ne/rs/s1-105/1/a (section numbers are unique statewide)
fetch   = "template"
url     = "https://nebraskalegislature.gov/laws/display-chapters.php?chapter={item}"
edition = "current"                          # the site shows the law in force (reissue + supplements + session laws)
item    = "%d"                               # chapter 1 -> "1" (no padding in the URL)
file    = "chapter-{item}.htm"
encoding = "utf-8"                           # <meta charset="utf-8">
family  = "html-paragraphs"
terms   = "Copyright Nebraska Legislature; the online text is not the official publication"

[NE.rs.html]
# Blocks, all direct children of div.printwidth or of the note divs (div.printwidth itself is not a block:
# it holds the whole section):
#   strong        the section opening "1-105. Act, how cited." (a <strong> inside another block stays part of it)
#   p             law text lines
#   div.source    the source note, with its trailing "Effective Date:"/"Operative Date:" line, as one block
#   span:noclass  the "Annotations"/"Cross References" label spans and each cross-reference item (<span>)
#   div:noclass   each case annotation (div style="text-indent: 1em")
#   a             only a bare link between sections counts (every other <a> sits inside a block): chapter 90's
#                 "<a href=/images/statutes/s_90-105.jpg>90-105 Image</a>", the state symbol the section adopts
blocks   = ["strong", "p", "div.source", "span:noclass", "div:noclass", "a"]
headings = []                                # the print page has no chapter/article headings
opening  = ["strong"]
verbatim = ["table"]                         # 28-105's felony-class penalty table (set inside a <p>): one text item

[NE.rs.ladder]
# (1)(a)(i)(A) almost everywhere; 28-405's schedules run (a)(1)(A)(i). Each level takes both orders' types;
# on chapters 1, 2, 28, 47, 90 this changes only 28-405 (checked section by section against the strict ladder)
types = [["num", "lower"], ["lower", "num"], ["roman_lower", "upper"], ["upper", "roman_lower"]]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[NE.rs.sections]
# "1-105.01. Heading." ; numbers may carry a comma after the chapter-article run: "21-2,101", "77-27,132"
match = '^(?P<num>\d+[A-Z]?-\d+(?:,\d+)?(?:\.\d+)?[A-Z]?)\.\s*(?P<heading>.*)$'
bold  = true                                 # matched against the <strong> opening
scope = "title"
# 28-405 (controlled-substance schedules) is split by bare lines "Schedule I" .. "Schedule V"; each schedule
# restarts its numbering (a)(1)(i): a group line opens a level inside the section
comma    = "article"                         # order check: 28-3,100 is article 3 section 100, after 28-399 (art. 3 sec. 99)
group    = '^Schedule (?P<num>[IVX]+)$'
group_id = "sch{num}"                        # /us-ne/rs/s28-405/schI/a/1

[NE.rs.notes]
sourceCredit  = '^Source:'
note          = [{ match = '^Annotations$', topic = "annotation" }]
editorialNote = [{ match = '^Cross References$', topic = "crossReference" }]
# "90-105 Image" (the link above) belongs to the NEXT section: it ends the previous section's notes and
# stands as a cross heading between the two, rather than landing in 90-104's source note
close         = ['^\d+[A-Z]?-\d+(?:,\d+)?(?:\.\d+)?[A-Z]? Image$']

# ---------------------------------------------------------------- Nebraska Constitution
# The whole constitution on one page, /laws/display-fullconst.php?print=false (about 1 MB). Inside the site
# frame (div.col-md-11 holds the law), one div.statute per section:
#   <h2>I-1.</h2><h3>Statement of rights.</h3>        section number (article-section), then its heading
#   <p class="text-justify">...</p>                    text
#   <div class="statute_source"><h2>Source</h2><ul><li>Neb. Const. art. I, sec. 1 (1875);</li>...</ul></div>
#   <div class="statute_source"><h2>Annotations</h2><h3>1. Personal rights</h3>...<p>case note</p>...</div>
# No article headings on the page: sections sit directly under the document (/us-ne/const/sI-1).
# Not inherited from NE.rs: the chapter wrap and the strong-based blocks do not apply.
[NE.const]
name    = "Constitution of Nebraska"
doc     = "/us-ne/const"                     # /us-ne/const/sI-1, /us-ne/const/sPreamble
fetch   = "template"
url     = "https://nebraskalegislature.gov/laws/display-fullconst.php?print=false"
edition = "current"
items   = ["full"]                           # always the one page
file    = "constitution-{item}.htm"
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "Copyright Nebraska Legislature"

[NE.const.html]
root     = "div.col-md-11"                   # the law; the site header, navigation and "Back to Browse" row are outside
blocks   = ["h2", "h3", "p", "li"]           # li: one source line or note ("Note: In Hunt v. Roth ...")
headings = []
opening  = []

[NE.const.ladder]
# art. XII, sec. 8 (Initiative 300, the corporate-farming ban) numbers its exemptions (A)..(N) at the top
# level; nowhere else in the constitution uses capitals, so the first level takes either type
types = [["num", "upper"], "lower", "roman_lower", "upper"]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[NE.const.sections]
match   = '^(?P<num>[IVX]+-\d+[A-Z]?|Preamble)\.$'   # the h2 alone: "I-1.", "XV-14A.", "Preamble."
bold    = false
heading = "next"                             # the h3 after the number is the catchline
scope   = "title"

[NE.const.notes]
sourceCredit  = '^Source$'
note          = [{ match = '^Annotations$', topic = "annotation" }]   # its h3 group headings stay in the note
editorialNote = [{ match = '^Cross References$', topic = "crossReference" }]
