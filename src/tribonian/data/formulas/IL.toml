# ---------------------------------------------------------------- Illinois Constitution of 1970
# /legislation/constitution links articles con1.htm ... con14.htm, conp.htm (preamble), contrans.htm
# (transition schedule) and conent.htm, "ENTIRE CONSTITUTION IN A SINGLE DOCUMENT": one request. The relative
# links resolve under /legislation/ (404); the LRB copy works. conent.htm is ONE <pre> of hard-wrapped lines:
# centered-by-spaces "ARTICLE I" / "BILL OF RIGHTS", "SECTION 1. INHERENT ...", paragraphs opened by a 4-space
# indent, "(Source: Illinois Constitution.)" after each section. The settings below do NOT read it yet (0 blocks):
# the parser has no <pre> line mode. Kept as the target shape for when it does.
[IL.const]
inherit = "IL.ilcs"
replace = ["containers", "html", "sections", "ladder", "notes"]
name    = "Illinois Constitution of 1970"
doc     = "/us-il/const"
fetch   = "template"
item    = ""
items   = ["1970"]
url     = "https://lrb.ilga.gov/Commission/lrb/conent.htm"   # www.ilga.gov/legislation/conent.htm is 404
file    = "const-{item}.html"
dir     = "const"

[IL.const.html]
blocks   = ["p"]
headings = ["p:centered", "h1", "h2", "h3", "h4"]
opening  = ["b", "strong"]

[IL.const.ladder]
types = ["lower", "num"]
tags  = ["subsection", "paragraph"]

[IL.const.containers]
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)\b.*$', tag = "article", rank = 2, id = "a{num_arabic}", heading = "next" }

[IL.const.sections]
match = '^SECTION\s+(?P<num>\d+)\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"

[IL.const.notes]
sourceCredit = '^\(Source:'
