[ND.cc.pdf]
# A wrapped cross-reference can start a line exactly like a section line ("...of section" / "12.1-32-07. Any
# restitution ..."): a `starts` line opens a paragraph only after a sentence end, a blank line or a page top.
# (Labels after "; and" still split: hanging mode opens them by column.)
starts_after = "sentence"
drop   = ['^\s*Page No\. \d+\s*$']            # page footer
# "hanging": the left margin moves page to page (aligned by the transform) and a label's wrapped lines hang
# deeper than its first line. A wrapped line continues the paragraph when it starts at or right of the
# paragraph's text column. The section number counts as a label (`label` below), so the catchline's text column
# is ~col 13 and the body's first line (col 3-5) starts its own paragraph; body continuation lines sit at the
# margin (col 0) and join. Unlabelled paragraphs separated only by a first-line indent still join (1-01-49(21)
# "For purposes of this subsection": its first line sits on the hanging column -- geometry cannot tell).
join   = "hanging"
label  = '(?:\d+(?:\.\d+)?-\d+(?:\.\d+)?[A-Z]?-\d+(?:\.\d+)*\.|\(?[0-9]{1,3}[a-z]?[.)]|\(?[A-Za-z]{1,2}[.)]|\([ivxlcIVXLC]{1,6}\))\s+'
center = 15                                   # TITLE / CHAPTER lines and their names sit at col ~25-45
# A section line and a labelled line always start a paragraph. So does an all-capitals line: TITLE 1 / GENERAL
# PROVISIONS / CHAPTER 1-01 / its name. pdftotext places these bold headings off-centre (GENERAL PROVISIONS spans
# cols 34-52 on a 104-col page), so `center` catches only "TITLE 1"; [html].headings takes the rest by text.
starts = ['^\d+(?:\.\d+)?-\d+(?:\.\d+)?[A-Z]?-\d+(?:\.\d+)*\.\s', '^\d+\.\s', '^[a-z]\.\s', '^\(\d+\)\s', '^\([a-z]\)\s', '^(?=.*[A-Z]{2})[^a-z]+$']

[ND.cc.html]
root     = "div#pdf"
blocks   = ["p"]
headings = ["p:centered", "p:matches(^(?=.*[A-Z]{2})[^a-z]+$)"]   # all-capitals blocks (see [pdf].starts)
opening  = []

[ND.cc.ladder]
# N.D.C.C. drafting: subsection 1., subdivision a., paragraph (1), subparagraph (a)
types = ["num.", "lower.", "num", "lower"]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[ND.cc.containers]
# Items t04c10a, t24c01a, t57c39-4a ... suggest lettered chapters (4-10A?): the optional [A-Z] is unconfirmed.
# The name may share the block: with starts_after the all-capitals name line is not opened after "CHAPTER 57-39.4A"
# (no sentence end) unless centring split it, so "CHAPTER 57-39.4A SIMPLIFIED SALES ..." carries its heading.
# "CHAPTER 04.1-01.1": the zero padding stays out of the number (0*)
title   = { match = '^TITLE\s+0*(?P<num>\d+(?:\.\d+)?)(?:\s+(?P<heading>[^a-z]+))?$', tag = "title", rank = 1, id = "t{num}" }
chapter = { match = '^CHAPTER\s+0*(?P<num>\d+(?:\.\d+)?-\d+(?:\.\d+)?[A-Z]?)(?:\s+(?P<heading>[^a-z]+))?$', tag = "chapter", rank = 2, id = "ch{num}" }

[ND.cc.sections]
# "1-01-01. This act - How referred to." -- number and catchline alone on the line; text starts next paragraph.
# Titles and chapters carry decimals: 4.1-01.1-02, 1-01-01.1.
# "hanging" keeps the catchline its own paragraph (a wrapped catchline's second line is back at the margin and
# joins it; the body's first line is indented less than the catchline's text column and starts a new one), so
# the heading is the rest of the block, including a status "(Effective through June 30, 2029)".
match = '^(?P<num>\d+(?:\.\d+)?-\d+(?:\.\d+)?[A-Z]?-\d+(?:\.\d+)*)\.\s+(?P<heading>.*)$'
versions = '(?i)\(effective'                  # 4.1-01.1-07 printed twice: "(Effective through ...)" / "(Effective after ...)"
bold  = false
scope = "root"                                # section numbers carry the title (1-01-01, 4.1-01.1-07): unique code-wide.
                                              # Only a title's first chapter PDF prints "TITLE n", so per-title scope would
                                              # give /t1/s1-01-01 in one file and /s1-02-01 in the next

[ND.cc.notes]

# ---------------------------------------------------------------- North Dakota Constitution
# One PDF per article: https://ndlegis.gov/constit/a01.pdf ... a16.pdf, plus preamble.pdf and
# transition_schedule.pdf (links on ndlegis.gov/constitution, which holds no text; theenablingact.pdf is the
# federal Enabling Act, left out). Probe constit_a01.pdf: "ARTICLE I" / "DECLARATION OF RIGHTS" (all-capitals
# lines), then "Section 1. All individuals ..." -- no catchlines, text on the section line; labels 1. a. as in the
# Century Code; a second paragraph after a blank line ("For purposes of this section", art. I sec. 16).
[ND.const]
inherit = "ND.cc"
replace = ["containers", "sections", "ladder", "pdf"]
name    = "Constitution of North Dakota"
doc     = "/us-nd/const"                      # /us-nd/const/a1/s25/1/a
url     = "https://ndlegis.gov/constit/{item}.pdf"
title_id = ['^(.*)$', '\1']

# catalog: every item (title/chapter/article) this code has, from the publisher's index (18) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "preamble", "a01", "a02", "a03", "a04", "a05", "a06", "a07", "a08", "a09", "a10", "a11", "a12", "a13", "a14",
  "a15", "a16", "transition_schedule"
]

[ND.const.pdf]
drop   = ['^\s*Page No\. \d+\s*$']
join   = "hanging"                            # as ND.cc; a blank line also ends a paragraph
center = 15
starts = ['^Section\s+\d+(?:\.\d+)?\.', '^\d+\.\s', '^[a-z]\.\s', '^\(\d+\)\s', '^\([a-z]\)\s', '^(?=.*[A-Z]{2})[^a-z]+$']

[ND.const.ladder]
types = ["num.", "lower.", "num", "lower"]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[ND.const.containers]
article = { match = '^ARTICLE\s+(?P<num>[IVXLC]+)$', tag = "article", rank = 1, id = "a{num}" }

[ND.const.sections]
match = '^Section\s+(?P<num>\d+(?:\.\d+)?)\.'   # the text after the number is the section's body
bold  = false
scope = "container"                           # sections restart in every article: /us-nd/const/a1/s1

[ND.const.notes]
