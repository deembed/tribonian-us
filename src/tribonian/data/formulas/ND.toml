# ND.toml -- North Dakota Century Code (N.D.C.C.) and the North Dakota Constitution.
#
# Source: North Dakota Legislative Council, ndlegis.gov. The official text is one PDF per chapter
# (https://www.ndlegis.gov/cencode/t01c01.pdf). The title pages (cencode/t01.html) also link "1-01 Sections"
# (cencode/t01c01.html): believed to be a section LIST linking into the PDF, not text -- a probe is queued in
# ND.txt to confirm; if it turns out to hold the text, switch to it (HTML preferred).
# Item = the PDF's base name: t01c01, t04-1c01-1 (title 4.1, chapter 4.1-01.1). Full list: the 2532 cencode/*.pdf
# links on general-information/north-dakota-century-code/index.html (see ND.txt items:).
#
# pdftotext -layout shape (probe cencode_t01c01.pdf):
#   TITLE 1 / GENERAL PROVISIONS / CHAPTER 1-01 / GENERAL PRINCIPLES AND DEFINITIONS   centred lines (col ~40)
#   "    1-01-01. This act - How referred to."   section line: number + catchline, own line
#   "    This revision, whenever cited, ..."      first line indented like the section line (3-5 cols, varies by
#   "the "North Dakota Century Code". ..."         page), continuation lines at the left margin (col 0)
#   "   1. The Constitution ..." / "        what is known"   labels at the paragraph indent; a label's wrapped
#                                                  lines hang deeper (col ~8)
#   "Page No. 1"                                    centred footer, dropped
# Indentation is NOT a level hint (1. and a. sit at the same column), so the ladder goes by label type only.

[ND.cc]
name    = "North Dakota Century Code"
doc     = "/us-nd/cc"                        # /us-nd/cc/t1/s1-01-49/21/a
fetch   = "template"
url     = "https://www.ndlegis.gov/cencode/{item}.pdf"
file    = "{item}.pdf"
title_id = ['^t0*(.*)$', 't\1']               # file identifier = the item: t1c01, t4-1c01-1 (one file per chapter)
family  = "html-paragraphs"
transform = "pdf-text"
encoding = "utf-8"
terms   = "none stated; Legislative Council publication"

