[NM.nmsa.html]
blocks   = ["p", "h1", "h2", "h3", "h4", "h5", "h6"]   # h2-h4/h6: Word heading levels, rare (46B has h3 PART n)
headings = ["h1", "h2", "h3", "h4", "p.Title1"]   # ARTICLE n<br>name ; PART n ; the chapter title block
opening  = ["h5"]                              # the whole "11-1-1. Short title." line
verbatim = ["table"]                           # forms and checklists in compacts (Form A of the gaming compact)
# p.Title1 "UNANNOTATED" (red) and "CHAPTER 11 <name>": the EPUB's own title lines, kept as crossHeadings of the
# title element (not dropped: they are the source's text, and conservation keeps them countable).

[NM.nmsa.ladder]
# A. (1) (a) (i): indent1 A., indent2 (1), indent3 (a), indent4 a) or (i). "1)"/"a)" (close paren only) occur in
# a few deep levels and in compacts: not a label type yet, they stay text (see status: feature 4).
types = ["upper.", "num", "lower", "roman_lower"]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[NM.nmsa.containers]
# The <br> in these headings sits inside an <a>, so split_br leaves one line: "ARTICLE 1 Joint Powers Agreements".
# Number and name in one line: the heading group splits them.
# p.Title1 "CHAPTER 46B<br>Uniform Power of Attorney Act" (one line) opens the chapter: articles and parts nest
# under it (/us-nm/nmsa/ch46B/a1/pt1), so article ids are unique across chapter files. The red p.Title1
# "UNANNOTATED" before it stays a crossHeading.
chapter = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]?)\s+(?P<heading>\S.*)$', tag = "chapter", rank = 1, id = "ch{num}" }
article = { match = '^ARTICLE\s+(?P<num>\d+[A-Z]?)\s+(?P<heading>\S.*)$', tag = "article", rank = 2, id = "a{num}" }
# h3 "PART 1" inside an article (46B, a recompiled uniform act): no name line follows (the next block is a section)
part    = { match = '^PART\s+(?P<num>\d+[A-Z]?)(?:\s+(?P<heading>\S.*))?$', tag = "part", rank = 3, id = "pt{num}" }

[NM.nmsa.sections]
# "11-1-1. Short title." | "11-3-1 to 11-3-8. Repealed." ("Appendix to Article 13": see [notes].close)
# lists too: "1-19-27.1, 1-19-27.2. Repealed." (a comma list: without it the number stopped at 1-19-27)
match = '^(?P<num>\d+[A-Z]?-\d+[A-Z]?-\d+(?:\.\d+)?(?:(?:,|\s+(?:to|through|and))\s+\d+[A-Z]?-\d+[A-Z]?-\d+(?:\.\d+)?)*)\.\s*(?P<heading>.*)$'
bold  = true                                   # matched on the opening block (h5) only
scope = "title"

# A section that enacts a whole compact (11-7-1, 11-14-2, 11-21-2, 1-15-4.1, 32A-10-9, 32A-11-1 ...) carries the
# compact's own article lines -- "ARTICLE II - Definitions", "Article 1 - Purpose and Policy", "ARTICLE I Membership",
# "ARTICLE I. FINDINGS AND PURPOSE", "ARTICLE I" alone -- and A., (1) restart under each: each opens a level.
# Whole line only, and a name must start with a capital or " - ", so body sentences ("Article 4 of the compact
# ...") never match; tried only on unlabeled lines inside a section, so the h1 ARTICLE containers are unaffected.
# Not caught (left flagged): 11-9-1 runs "Article 2. The board. - A. There is ..." into the body line.
group    = '^"?(?:ARTICLE|Article)\s+(?P<num>[IVXL]+|\d+[A-Z]?)(?:\s+-\s+[^.;]*|\.?\s+[A-Z][^.;]*\.?|\.)?$'
group_id = "art{num}"
# a contingent second text follows the current one under the same number (32A-11-1 .. 32A-11-7):
# "32A-11-1. Interstate compact. (Contingent effective date. See note below.)" -- searched in the heading
versions = '\(Contingent effective date'

[NM.nmsa.notes]
sourceCredit = { class = "history" }           # "History: 1953 Comp., § 4-22-1, enacted by Laws 1961, ch. 135, § 1."
editorialNote = [{ class = "annotations", topic = "annotation" }]   # empty end-of-chunk placeholder (&nbsp;)
# "Appendix to Article 13" is an unnumbered h5 after the article's last section, followed by the superseded
# compact's text: it ends the open section and stands as a cross heading (the appendix text follows it).
close = ['^Appendix to Article \w+$']

# ---------------------------------------------------------------- Constitution of New Mexico
# Collection c, item 5916 -> /w/nmos/n-5916-en.epub (one EPUB, 215 chunks, ANNOTATED: no unannotated edition).
# h1 "PREAMBLE" / "ARTICLE II Bill of Rights"; h4 "Section 1. [Supreme law of the land.]" / "Sec. 2. [...]";
# p.text / p.indent1-3 body; p.history; then h5 "ANNOTATIONS" + p.annotations / h6 topic heads / p.MsoHeading7:
# all notes to the next section. h3 "ADDENDA JUDICIAL NOMINATING COMMISSION" at the end.
[NM.const]
inherit = "NM.nmsa"
replace = ["html", "containers", "sections", "ladder", "notes"]
name    = "Constitution of New Mexico"
doc     = "/us-nm/const"                       # /us-nm/const/a2/s1
fetch   = "template"
url     = "https://nmonesource.com/w/nmos/n-{item}-en.epub"
items   = ["5916"]                             # always the one document
file    = "n-{item}-en.epub"
container = "epub"                             # stated again for clarity (also inherited)
title_id = ""

# catalog: every item (title/chapter/article) this code has, from the publisher's index (1) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "5916"
]

[NM.const.html]
blocks   = ["p", "h1", "h3", "h4", "h5", "h6"]
headings = ["h1", "h3", "p.Titre1", "p.titledate"]   # + the title lines "Constitution of the State of New Mexico" / "ADOPTED JANUARY 21, 1911"
opening  = ["h4"]
verbatim = ["table"]

[NM.const.ladder]
types = ["upper.", "num", "lower"]             # A. (1) (a)
tags  = ["subsection", "paragraph", "subparagraph"]

[NM.const.containers]
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 1, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)\s+(?P<heading>\S.*)$', tag = "article", rank = 1, id = "a{num_arabic}" }
addenda  = { match = '^(?P<heading>ADDENDA\b.*)$', tag = "level", rank = 1, id = "addenda", heading = "self" }

[NM.const.sections]
match = '^(?:Section|Sec\.)\s+(?P<num>\d+[A-Za-z]?)\.\s*(?P<heading>.*)$'
bold  = true                                   # the h4 opening only
scope = "container"                            # numbers restart per article
# a proposed amendment follows the section it would replace: "Sec. 10. (Proposed.) [Compensation of members.]"
versions = '^\(Proposed\.\)'

[NM.const.notes]
editorialNote = [{ match = '^ANNOTATIONS$', topic = "annotation" }]   # history lines sit inside the annotations here
