[RI.gl.html]
blocks   = ["p", "history"]                   # <HISTORY> (older 6A pages) holds "History of Section.<BR>(P.L. ...)"
headings = ["h2", "h3"]                        # h3: the Part banner on current 6A pages; the chapter banner "Chapter 2<br>Airports and Landing Fields";
                                               # in title 6A also "Part 1<br>Short Title, ..." (UCC parts)
opening  = ["b"]                               # "§ 1-2-1. Heading." is bold (paragraph labels "(a)" are bold too)
# Two page formats. Newer pages: one <p style="margin-left:Npx"> per paragraph, 30px per level.
# Older pages (title 6A, iso-8859-1): everything is bare text in <body>, lines split by <br><br>, the catchline
# a nested <b><b>§ 6A-2-106.</b> <b>Heading</b></b>. split_br makes each run between <br>s a block and keeps
# the block children (div/p/center) of the newer format as they are.
split_br = ["body", "p", "history"]
nested   = true                                # older 6A pages leave <P> unclosed: the <HISTORY> block sits inside the last <P>
block_tags = ["center", "history"]                      # <center> (around the 6A banners) is a run break, not inline text
# indent_css = { unit = 22.5, base = 0, property = "margin-left" }   # 30px = 22.5pt per level; a hint only
verbatim = ["table"]                           # statutory forms / schedules set as tables: one text item
# h1: the title banner, repeated on every section page (the build names the title once, from the index page);
# h3: "R.I. Gen. Laws § 1-1-1", a citation line repeating the number in the bold catchline below it
#     (on a chapter index page it is "Index of Sections"). Neither is law text; both are counted in verify.
drop     = ["h1", "h3:matches(^R\\.I\\. Gen\\. Laws)", "h3:matches(^Index of)"]

[RI.gl.ladder]
# R.I. numbering is (a)(1)(i)(A) in most titles; definitions sections often start at (1) -- level 0 also
# takes (1). Title 6A (the UCC) keeps the uniform act's (1)(a)(i)(A) / (a)(1)(A)(i): see RI.ucc if needed.
types = [["lower", "num"], ["num", "roman_lower", "lower"], ["roman_lower", "upper"], ["upper", "roman_lower"], "roman_upper"]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[RI.gl.containers]
# "Chapter 2 Airports and Landing Fields" (the <br> reads as a space). The banner gives the chapter's number
# within the title only ("Chapter 2" for chapter 1-2); repeated on each section page, joined by the build.
chapter = { match = '^(?P<heading>Chapter\s+(?P<num>\d+(?:\.\d+)*[A-Z]?)(?:\s.*)?)$', tag = "chapter", rank = 2, id = "ch{num}", heading = "self" }

part    = { match = '^(?P<heading>Part\s+(?P<num>\d+[A-Z]?)(?:\s.*)?)$', tag = "part", rank = 3, id = "pt{num}", heading = "self" }

[RI.gl.sections]
# "§ 1-2-1. Heading." ; "§ 42-35-1.1. ..." ; "§ 6A-9-102. ..." ; "§ 40.1-1-2. ..." ;
# a span "§§ 1-1-2 — 1-1-5. Repealed." (the id takes the first number; the full span stays in the num text)
match = '^§§?\s*(?P<num>\d+[A-Z]?(?:\.\d+)*(?:-\d+(?:\.\d+)*[A-Z]?)+)(?:\s*(?:[—–-]|to|and|,)\s*\d+[A-Z]?(?:\.\d+)*(?:-\d+(?:\.\d+)*[A-Z]?)+)*\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"                                # /us-ri/gl/t1/s1-2-1
decimal = false
versions = '(?i)\[[^\]]*\beffective\b'         # "[Effective until ...]" / "[Effective ...]" twin texts

[RI.gl.notes]
sourceCredit = '^History of Section\.'         # "History of Section.<br>P.L. 1939, ch. 660 ..."

[RI.gl.cite]
# "R.I. Gen. Laws § 11-23-1", "G.L. 1956 § 11-23-1" (the Supreme Court's own form), "R.I.G.L. § ...",
# "§ 11-23-1 of the General Laws"; item = the chapter: everything before the last hyphen (40.1-1-3.1 -> 40.1-1)
full    = ['R\.\s?I\.\s?Gen\.\s?Laws(?:\s?Ann\.)?(?:\s?\(?1956\)?)?', 'R\.\s?I\.\s?G\.\s?L\.', 'G\.\s?L\.\s?1956',
           'Rhode\s+Island\s+General\s+Laws']
bare    = ['G\.\s?L\.', 'General\s+Laws']
after   = ['of\s+the\s+(?:R\.\s?I\.\s?)?(?:General\s+Laws|G\.\s?L\.)(?:\s+of\s+Rhode\s+Island)?(?:,?\s+1956)?']
section = '\d+[A-Z]?(?:\.\d+)*-\d+(?:\.\d+)*[A-Z]?-\d+(?:\.\d+)*[A-Z]?'
item    = ['^(.+)-[^-]+$', '{1}']
label   = "R.I. Gen. Laws § {sec}"
examples = [["R.I. Gen. Laws § 42-35-15(g) (1956)", "ri-gl:42-35-15", "R.I. Gen. Laws § 42-35-15"],
            ["G.L. 1956 § 21-28-4.01(a)(1)", "ri-gl:21-28-4.01"],
            ["pursuant to § 40.1-1-3.1 of the General Laws", "ri-gl:40.1-1-3.1"],
            ["R.I.G.L. § 6A-2-302", "ri-gl:6A-2-302"]]

# ---------------------------------------------------------------- Constitution of the State of Rhode Island
# One Word-saved page (windows-1252), rilegislature.gov/riconstitution/Constitution/ConstFull.aspx
# (per-article pages C01.aspx ... also exist; the full page is one request). Markup:
#   h1 centered       CONSTITUTION OF THE STATE OF RHODE ISLAND
#   h2 centered       PREAMBLE / ARTICLE I ... ARTICLE XV, the article name after it as a second centered h2
#                     or a centered p.MsoNormal (ARTICLE IX's own number line is a centered p, not an h2)
#   h3                "Section 1. Heading." -- the section line, the whole block (no bold run)
#   p.MsoBodyText     the text; p.MsoListParagraph (a)(b)(c) in art. IX sec. 16; many empty p.MsoNormal
# No history or notes lines on the page.
[RI.const]
name    = "Constitution of the State of Rhode Island"
doc     = "/us-ri/const"                       # /us-ri/const/a1/s2
fetch   = "template"
url     = "https://rilegislature.gov/riconstitution/Constitution/{item}.aspx"
items   = ["ConstFull"]                        # always the one page
file    = "{item}.html"
encoding = "utf-8"                             # the meta says windows-1252, but the server sends UTF-8 bytes (probe: valid UTF-8, — as E2 80 94)
family  = "html-paragraphs"
terms   = "informational copy; no reuse terms stated"

[RI.const.html]
blocks   = ["p", "h3"]
headings = ["h1", "h2", "p:centered"]
# the whole "Section N. Heading." line is an h3; three sections (art. VI sec. 11, art. VIII sec. 4, art. IX
# sec. 1) are instead a p.MsoNormal whose whole text is bold
opening  = ["h3", "b"]

[RI.const.ladder]
types = ["lower", "num", "roman_lower", "upper"]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[RI.const.containers]
title    = { match = '^(?P<heading>CONSTITUTION OF THE STATE OF RHODE ISLAND)$', tag = "title", rank = 1, id = "", heading = "self" }
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)$', tag = "article", rank = 2, id = "a{num_arabic}" }   # name: the next heading

[RI.const.sections]
match = '^Section\s+(?P<num>\d+[A-Za-z]?)\.\s*(?P<heading>.*)$'
bold  = true                                   # matched on the opening run (the h3)
scope = "container"                            # numbers restart per article: /us-ri/const/a1/s2

[RI.const.notes]

[RI.const.cite]
full    = ['R\.\s?I\.\s?Const\.?', 'Rhode\s+Island\s+Constitution']    # then "art. 1, § 23" (Arabic or Roman)
item    = "ConstFull"
label   = "R.I. Const. art. {roman}[, § {sec}]"
examples = [["R.I. Const. art. 1, § 23", "ri-const:art-1:23", "R.I. Const. art. I, § 23"],
            ["R.I. Const. art. IX, sec. 5", "ri-const:art-9:5"]]
