# RI.toml -- Rhode Island: the General Laws (webserver.rilegislature.gov/Statutes) and the Constitution
# (rilegislature.gov/riconstitution). Both are the General Assembly's informational copies, not official.
#
# ---------------------------------------------------------------- General Laws of Rhode Island
# Site shape (probes 2026-10, build/probe/webserver.rilegislature.gov/):
#   /Statutes/Statutes.html               list of titles: TITLE1 ... TITLE6A ... TITLE40.1 ... TITLE47
#   /Statutes/TITLE{t}/INDEX.HTM          "Index of Chapters": <a href="1-2/INDEX.htm">Chapter 1-2 ...</a>
#   /Statutes/TITLE{t}/{ch}/INDEX.htm     "Index of Sections": <a href="1-2-1.htm">§ 1-2-1. ...</a>
#   /Statutes/TITLE{t}/{ch}/{sec}.htm     ONE SECTION per page -- no whole-chapter or print page exists.
# The pages are LexisNexis XSLT output (same generator as Vermont's). A section page repeats the title banner
# (h1) and the chapter banner (h2), then <center><h3>R.I. Gen. Laws § 1-1-1</h3></center>, then
#   <div><p style="margin-left:0px"><b>§ 1-1-1. Heading.</b></p> ...text <p>... 
#        <div><p>History of Section.<br>P.L. 1939, ch. 660 ...</p></div></div>
# Item = a CHAPTER as the site names it (1-2, 6A-2, 40.1-1, 42-35.1); item_match splits it into {title} and
# {chapter} for the URL TITLE{title}/{item}/INDEX.htm. The chapter index lists the section pages; one USLM file
# per chapter (title-1-2.xml), its root the title (/us-ri/gl/t1) so identifiers match a whole-title build.
# One request per section.
[RI.gl]
name    = "General Laws of Rhode Island"
doc     = "/us-ri/gl"                          # /us-ri/gl/t1/ch2 ; sections /us-ri/gl/t1/s1-2-1/a/1
fetch   = "index"
item    = ""                                   # chapters as written
item_match = '(?P<title>[0-9A-Z.]+?)-(?P<chapter>.+)'     # "40.1-1.1" -> title 40.1; "6A-2" -> title 6A
title_id = ['^([0-9A-Z.]+?)-.+$', 't\1']      # the file's root: /us-ri/gl/t6A for chapter 6A-2
index_file = "{item}_INDEX.htm"
# A chapter index lists either its sections ("1-2-1.htm") or, in the UCC chapters of title 6A, its Parts
# ("Index of Parts": href="6A-1/INDEX.htm" = TITLE6A/6A-2/6A-1/INDEX.htm), which list the sections. Level 0 takes
# both: a part page is walked on (level 1 = its sections); a section page links nothing, so the walk keeps it as a
# text page (_idx/). Part pages are all "6A-N/INDEX.htm" in every chapter: save_as = "url" names files by full path.
links   = ['href="([0-9A-Za-z.]+-[0-9A-Za-z.]+/INDEX\.htm|[0-9A-Za-z.]+-[0-9A-Za-z.-]+\.htm)"',
           'href="([0-9A-Za-z.]+-[0-9A-Za-z.-]+\.htm)"']
save_as = "url"
layers  = [ { name = "current", url = "https://webserver.rilegislature.gov/Statutes/TITLE{title}/{item}/INDEX.htm" } ]
# chapter list for items: TITLE{t}/INDEX.HTM per title (49 titles in Statutes.html)
encoding = "utf-8"                             # newer pages UTF-8; older ones (6A) iso-8859-1: the decoder falls back to cp1252
                                               # per invalid byte, so § (A7) reads right in both
family  = "html-paragraphs"
terms   = "All Rights Reserved notice; informational copy, not the official record; no scraping terms stated"

