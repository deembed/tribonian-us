# ---------------------------------------------------------------- New Hampshire Revised Statutes Annotated
# Published by the General Court's Office of Legislative Services at gc.nh.gov (informational, not the
# official bound RSA). Pages: rsa/html/nhtoc.htm lists titles -> NHTOC/NHTOC-{TITLE}.htm lists chapters
# -> one whole-chapter file /rsa/html/{TITLE}/{CH}/{CH}-mrg.htm (all sections in one page).
# Markup of a -mrg page (no classes; custom tags):
#   <center><h1>TITLE I<br>THE STATE AND ITS GOVERNMENT</h1></center>    title banner, repeated per chapter
#   <center><h2>Chapter 1<br>STATE BOUNDARIES</h2></center>             the chapter
#   <center><h2>Seaward Limits of Jurisdiction</h2></center>            an unnumbered subdivision
#   <center><h3>Section 1:1</h3></center>                               anchor line repeating the number
#   &nbsp;&nbsp;&nbsp;<b> 1:1 Perambulation of ... &#150;</b>           section number + catchline (bare in body)
#   <codesect> text <br> I. <br> text <br> II. ... </codesect>          the law text, lines split by <br>
#   <sourcenote><p><b>Source.</b> 2000, 35:1 ...</p></sourcenote>     the source note
[NH.rsa]
name    = "New Hampshire Revised Statutes Annotated"
doc     = "/us-nh/rsa"                        # /us-nh/rsa/tI/s1:14/I/a
fetch   = "index"
sparse_match = '(?P<c>[^:]+):.+'                                  # 354-A:17: chapter 354-A (pages are whole chapters)
sparse  = '/{c}/{c}-mrg\.htm$'
item    = ""                                  # titles are roman numerals, some suffixed: I, XIX-A, XXXIV-A
index_file = "NHTOC-{item}.htm"
# The title page NHTOC-I.htm links one chapter TOC page per chapter (NHTOC-I-1.htm, NHTOC-I-1-A.htm,
# NHTOC-X-126-AA.htm); that page links the merged chapter file ../I/1/1-mrg.htm. The rewrite goes straight
# from the chapter TOC link to the merged file, so the chapter TOC pages are never fetched.
links   = 'href="(NHTOC-[IVXLC]+(?:-[A-Z]+)?-\d[^"/]*\.htm)"'
rewrite = ['NHTOC/NHTOC-([IVXLC]+(?:-[A-Z]+)?)-(\d+(?:-[A-Z]+)?)\.htm$', '\1/\2/\2-mrg.htm']
layers  = [ { name = "current", url = "https://gc.nh.gov/rsa/html/NHTOC/NHTOC-{item}.htm" } ]
empty_index = "page"                          # a wholly repealed title (IV): its index page links no chapters and
                                              # is itself the title's text ("Title IV Repealed ...")
encoding = "cp1252"                           # &#150; (en dash) and Windows quotes; pages carry no charset
family  = "html-paragraphs"
terms   = "unverified (public records; no reuse terms stated)"
# title name from the index page: the h2 after "Table of Contents", "XI: HOSPITALS AND SANITARIA"; a wholly
# repealed title's page (IV) has the chapter-page banner <h1>TITLE IV<br>ELECTIONS</h1>
# instead. One tag-less selector takes either (first match in document order; the <center> around the h2
# has the same text; the $ keeps <body>, whose text also starts "TITLE IV", from matching).
title   = { name = ":matches(^(?:[IVXLC]+(?:-[A-Z])?:|TITLE [IVXLC]+(?:-[A-Z])?[A-Z ]+$))" }

# catalog: every item (title/chapter/article) this code has, from the publisher's index (67) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII",
  "XVIII", "XIX", "XIX-A", "XX", "XXI", "XXII", "XXIII", "XXIV", "XXV", "XXVI", "XXVII", "XXVIII", "XXIX", "XXX",
  "XXXI", "XXXII", "XXXIII", "XXXIII-A", "XXXIV", "XXXIV-A", "XXXV", "XXXVI", "XXXVII", "XXXVIII", "XXXIX", "XL",
  "XLI", "XLII", "XLIII", "XLIV", "XLV", "XLVI", "XLVII", "XLVIII", "XLIX", "L", "LI", "LII", "LIII", "LIV", "LV",
  "LVI", "LVII", "LVIII", "LIX", "LX", "LXI", "LXII", "LXIII", "LXIV"
]

[NH.rsa.html]
# The section's catchline <b> and a repealed chapter's "[Repealed by ...]" line sit as bare text/inline runs
# directly in <body>: loose makes each run between block children its own block. NH's custom/presentational
# tags are block children (run breaks), not inline.
blocks   = ["p"]
loose    = ["body"]
block_tags = ["center", "codesect", "sourcenote"]
# Tables inside <codesect>: statutory forms (5-C:? Certificate of Stillbirth) and UCC definition indexes
# (382-A:2-103 "Acceptance". Section 2-606. ...): one text item each, cells joined by spaces.
verbatim = ["table"]
# <center> is the heading block: it holds the h2 chapter / group headings, and also bare bracketed notes
# ("[RSA 21-P:46-a repealed by ... ]" before a section; "<center><p>[Paragraph V effective January 1,
# 2027.]</p></center>" inside a section's text). Blocks inside it count as part of it.
headings = ["center"]
opening  = ["b"]
split_br = ["codesect"]                       # each <br>-separated line of the law text is its own block
# h1: the title banner repeated at the top of every chapter page;
# h3: "Section 1:1" anchor lines that only repeat the number in the bold catchline that follows.
# Neither is law text; both are counted in the verify report.
drop     = ["h1", "h3"]

[NH.rsa.ladder]
# RSA numbering: I. (a) (1) (A) (i); roman paragraph numbers dotted, often alone on their <br> line
# UCC chapter 382-A (title XXXIV-A) keeps the UCC's own numbering: (1)(a)(i)(A) in the older articles,
# (a)(1)(i) / (a)(1)(A)(i) in the revised ones, (1)(A) in article 9 transition sections. So level 0 also
# takes (1), level 1 also (A), levels 2 and 3 also (i).
types = [["roman_upper.", "num"], ["lower", "upper"], ["num", "roman_lower"], ["upper", "roman_lower"], ["roman_lower", "upper"]]
tags  = ["subsection", "paragraph", "subparagraph", "clause", "subclause"]

[NH.rsa.containers]
# "Chapter 21-P<br>DEPARTMENT OF SAFETY" reads "Chapter 21-P DEPARTMENT OF SAFETY"; suffixes may double
# (126-AA). heading = "self": the whole line is the heading.
chapter = { match = '^(?P<heading>Chapter\s+(?P<num>\d+(?:-[A-Z]+)?)(?:\s.*)?)$', tag = "chapter", rank = 2, id = "ch{num}", heading = "self" }

[NH.rsa.sections]
# the bold catchline: "1:14 Extent. –" / "21-P:7-a Repealed by 2000, 35:2, I, eff. Jan. 1, 2001. –"
# UCC chapter 382-A keeps the article in the number: "382-A:2A-507 Lessee's Damages ..."
match = '^(?P<num>\d+(?:-[A-Z]+)?:(?:\d+[A-Z]?-)?\d+(?:-[a-z]+)?)\s+(?P<heading>.*)$'
bold  = true
scope = "title"                               # section numbers carry the chapter: /us-nh/rsa/tI/s1:14
# effective-date variants: "[RSA 5-C:41 effective until Sept. 8, 2026; see also RSA 5-C:41 set out below.]",
# "[Paragraph V effective January 1, 2027.]" on their own line before the repeated section / paragraph
versions = '(?i)\[[^\]]*\beffective\b'

[NH.rsa.notes]
sourceCredit  = '^Source\.'
editorialNote = ['^Revision note\.', "^Editor's note", '^Effective Date note', '^Contingent', '^Applicability',
                 # a wholly repealed chapter / title page: "Chapter 150 Repealed – Entire Chapter was repealed",
                 # "[Repealed by 1957, ...]"; for title IV the note sits on the title itself (no chapter)
                 { match = '^(?:Title|Chapter)\s+\S+\s+Repealed\b', topic = "repeal" }]
# Unnumbered group headings inside a chapter ("Seaward Limits of Jurisdiction", "Part Statewide Threat
# Notification System for Schools Statewide ...") end the previous section and its source note and stand
# as cross headings (they have no number to make a container id from).
# A centered "[Paragraph ... effective ...]" line inside the text is not a group heading: it stays in the
# section as a cross heading over the paragraph version it introduces. "[RSA ...]" lines (about the next
# section) do close the previous section.
close = [{ heading = true, match = '^(?:[^\[]|\[RSA)' }]

[NH.rsa.cite]
# "RSA 630:1, I(a)" (the N.H. courts' form), "N.H. Rev. Stat. Ann. § 630:1"; the chapter:section shape is the tell.
# The fetch item is the Roman title, which the number does not show: the item rule maps the chapter to its title
# (ranges from the title list, gaps given to the title before; 227-G..M, 361-A..E and 382-A are their own titles).
full    = ['N\.\s?H\.\s?Rev\.\s?Stat\.(?:\s?Ann\.)?', '(?:N\.\s?H\.\s?)?RSA', 'New\s+Hampshire\s+Revised\s+Statutes(?:\s+Annotated)?']
section = '\d+(?:-[A-Z]{1,2})?:\d+(?:-\d+)?(?:-[a-z]{1,2})?'
item = ['^(?:(?P<t_XIX_A>)227-[G-M]:|(?P<t_XXXIII_A>)361-[A-E]:|(?P<t_XXXIV_A>)382-A:|(?P<t_I>)(?:[1-9]|1[0-9]|2[0-1])(?:-[A-Z]+)?:|(?P<t_II>)(?:2[2-9]|30)(?:-[A-Z]+)?:|(?P<t_III>)(?:3[1-9]|4[0-9]|5[0-3])(?:-[A-Z]+)?:|(?P<t_IV>)(?:5[4-9]|6[0-9]|70)(?:-[A-Z]+)?:|(?P<t_V>)(?:7[1-9]|8[0-9]|90)(?:-[A-Z]+)?:|(?P<t_VI>)(?:9[1-9]|10[0-3])(?:-[A-Z]+)?:|(?P<t_VII>)(?:10[4-6])(?:-[A-Z]+)?:|(?P<t_VIII>)(?:10[7-9]|11[0-9])(?:-[A-Z]+)?:|(?P<t_IX>)(?:12[0-4])(?:-[A-Z]+)?:|(?P<t_X>)(?:12[5-9]|1[3-4]\d)(?:-[A-Z]+)?:|(?P<t_XI>)(?:15[0-2])(?:-[A-Z]+)?:|(?P<t_XII>)(?:15[3-9]|16[0-9]|17[0-4])(?:-[A-Z]+)?:|(?P<t_XIII>)(?:17[5-9]|18[0-2])(?:-[A-Z]+)?:|(?P<t_XIV>)(?:18[3-5])(?:-[A-Z]+)?:|(?P<t_XV>)(?:18[6-9]|19[0-9]|200)(?:-[A-Z]+)?:|(?P<t_XVI>)(?:20[1-2])(?:-[A-Z]+)?:|(?P<t_XVII>)(?:20[3-5])(?:-[A-Z]+)?:|(?P<t_XVIII>)(?:20[6-9]|21[0-5])(?:-[A-Z]+)?:|(?P<t_XIX>)(?:21[6-9]|22[0-7])(?:-[A-Z]+)?:|(?P<t_XX>)(?:22[8-9]|2[3-4]\d|25[0-8])(?:-[A-Z]+)?:|(?P<t_XXI>)(?:259|26[0-9])(?:-[A-Z]+)?:|(?P<t_XXII>)(?:27[0-2])(?:-[A-Z]+)?:|(?P<t_XXIII>)(?:27[3-9]|28[0-3])(?:-[A-Z]+)?:|(?P<t_XXIV>)(?:28[4-7])(?:-[A-Z]+)?:|(?P<t_XXV>)(?:288)(?:-[A-Z]+)?:|(?P<t_XXVI>)(?:289|29[0-1])(?:-[A-Z]+)?:|(?P<t_XXVII>)(?:29[2-9]|30[0-3])(?:-[A-Z]+)?:|(?P<t_XXVIII>)(?:30[4-5])(?:-[A-Z]+)?:|(?P<t_XXIX>)(?:30[6-8])(?:-[A-Z]+)?:|(?P<t_XXX>)(?:309|3[1-2]\d|33[0-2])(?:-[A-Z]+)?:|(?P<t_XXXI>)(?:33[3-9]|3[4-5]\d)(?:-[A-Z]+)?:|(?P<t_XXXII>)(?:360)(?:-[A-Z]+)?:|(?P<t_XXXIII>)(?:361)(?:-[A-Z]+)?:|(?P<t_XXXIV>)(?:36[2-9]|37[0-9]|38[0-2])(?:-[A-Z]+)?:|(?P<t_XXXV>)(?:38[3-9]|39[0-7])(?:-[A-Z]+)?:|(?P<t_XXXVI>)(?:39[8-9])(?:-[A-Z]+)?:|(?P<t_XXXVII>)(?:4[0-1]\d|420)(?:-[A-Z]+)?:|(?P<t_XXXVIII>)(?:421)(?:-[A-Z]+)?:|(?P<t_XXXIX>)(?:42[2-4])(?:-[A-Z]+)?:|(?P<t_XL>)(?:42[5-9]|43[0-9]|44[0-3])(?:-[A-Z]+)?:|(?P<t_XLI>)(?:44[4-9]|45[0-4])(?:-[A-Z]+)?:|(?P<t_XLII>)(?:45[5-6])(?:-[A-Z]+)?:|(?P<t_XLIII>)(?:45[7-9]|46[0-1])(?:-[A-Z]+)?:|(?P<t_XLIV>)(?:46[2-5])(?:-[A-Z]+)?:|(?P<t_XLV>)(?:46[6-9]|470)(?:-[A-Z]+)?:|(?P<t_XLVI>)(?:471)(?:-[A-Z]+)?:|(?P<t_XLVII>)(?:47[2-6])(?:-[A-Z]+)?:|(?P<t_XLVIII>)(?:47[7-9])(?:-[A-Z]+)?:|(?P<t_XLIX>)(?:480)(?:-[A-Z]+)?:|(?P<t_L>)(?:48[1-9])(?:-[A-Z]+)?:|(?P<t_LI>)(?:49[0-9]|50[0-5])(?:-[A-Z]+)?:|(?P<t_LII>)(?:50[6-9]|51[0-3])(?:-[A-Z]+)?:|(?P<t_LIII>)(?:51[4-9]|52[0-6])(?:-[A-Z]+)?:|(?P<t_LIV>)(?:52[7-9]|53[0-3])(?:-[A-Z]+)?:|(?P<t_LV>)(?:53[4-9]|54[0-6])(?:-[A-Z]+)?:|(?P<t_LVI>)(?:54[7-9]|55[0-9]|56[0-7])(?:-[A-Z]+)?:|(?P<t_LVII>)(?:56[8-9])(?:-[A-Z]+)?:|(?P<t_LVIII>)(?:5[7-8]\d|59[0-1])(?:-[A-Z]+)?:|(?P<t_LIX>)(?:59[2-9]|60[0-9]|61[0-4])(?:-[A-Z]+)?:|(?P<t_LX>)(?:61[5-9]|62[0-3])(?:-[A-Z]+)?:|(?P<t_LXI>)(?:624)(?:-[A-Z]+)?:|(?P<t_LXII>)(?:62[5-9]|6[3-4]\d|65[0-1])(?:-[A-Z]+)?:|(?P<t_LXIII>)(?:65[2-9]|66[0-9]|67[0-1])(?:-[A-Z]+)?:|(?P<t_LXIV>)(?:67[2-9])(?:-[A-Z]+)?:)',
        '[XIX-A{t_XIX_A}][XXXIII-A{t_XXXIII_A}][XXXIV-A{t_XXXIV_A}][I{t_I}][II{t_II}][III{t_III}][IV{t_IV}][V{t_V}][VI{t_VI}][VII{t_VII}][VIII{t_VIII}][IX{t_IX}][X{t_X}][XI{t_XI}][XII{t_XII}][XIII{t_XIII}][XIV{t_XIV}][XV{t_XV}][XVI{t_XVI}][XVII{t_XVII}][XVIII{t_XVIII}][XIX{t_XIX}][XX{t_XX}][XXI{t_XXI}][XXII{t_XXII}][XXIII{t_XXIII}][XXIV{t_XXIV}][XXV{t_XXV}][XXVI{t_XXVI}][XXVII{t_XXVII}][XXVIII{t_XXVIII}][XXIX{t_XXIX}][XXX{t_XXX}][XXXI{t_XXXI}][XXXII{t_XXXII}][XXXIII{t_XXXIII}][XXXIV{t_XXXIV}][XXXV{t_XXXV}][XXXVI{t_XXXVI}][XXXVII{t_XXXVII}][XXXVIII{t_XXXVIII}][XXXIX{t_XXXIX}][XL{t_XL}][XLI{t_XLI}][XLII{t_XLII}][XLIII{t_XLIII}][XLIV{t_XLIV}][XLV{t_XLV}][XLVI{t_XLVI}][XLVII{t_XLVII}][XLVIII{t_XLVIII}][XLIX{t_XLIX}][L{t_L}][LI{t_LI}][LII{t_LII}][LIII{t_LIII}][LIV{t_LIV}][LV{t_LV}][LVI{t_LVI}][LVII{t_LVII}][LVIII{t_LVIII}][LIX{t_LIX}][LX{t_LX}][LXI{t_LXI}][LXII{t_LXII}][LXIII{t_LXIII}][LXIV{t_LXIV}]']
label   = "N.H. Rev. Stat. Ann. § {sec}"
examples = [["RSA 625:1", "nh-rsa:625:1", "N.H. Rev. Stat. Ann. § 625:1"],
            ["N.H. Rev. Stat. Ann. § 151:2-a (2015)", "nh-rsa:151:2-a"],
            ["RSA 382-A:1-101", "nh-rsa:382-A:1-101"],
            ["RSA 227-G:1", "nh-rsa:227-G:1"],
            ["RSA 12-O:14, II", "nh-rsa:12-O:14"]]

# ---------------------------------------------------------------- New Hampshire Constitution (cite only)
# Cited by part and article: "N.H. Const. pt. I, art. 15" (also "N.H. CONST." in the court's own opinions)
[NH.const]
name    = "Constitution of New Hampshire"
source_error = "no source: www.nh.gov (the constitution's only official host) blocks non-browser clients"

[NH.const.cite]
full    = ['N\.\s?H\.\s?C(?:onst|ONST)\.?', 'New\s+Hampshire\s+Constitution']
tail    = ',?\s*(?:[Pp]t\.|[Pp]art)\s*(?P<pt>II|I)\b(?:,?\s*(?:[Aa]rt(?:icle)?s?\.?)\s*(?P<art>\d+(?:-[a-z])?))?'
key     = "pt-{pt}[:art-{art}]"
label   = "N.H. Const. pt. {pt}[, art. {art}]"
examples = [["N.H. Const. pt. I, art. 15", "nh-const:pt-I:art-15", "N.H. Const. pt. I, art. 15"],
            ["N.H. CONST. pt. II, art. 83", "nh-const:pt-II:art-83"]]
