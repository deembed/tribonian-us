[MN.stat.html]
root     = "div#xtend"                       # the law; the "Resources" box, header and footer are outside
# h1.shn section number + headnote; h1.fgh a first-grade heading; h2.subd_no "Subdivision 1.Scope.";
# h2 "History: " label; p text and history citations; tr one table-of-sections row; div.sr a repealed stub
blocks   = ["h1", "h2", "p", "tr", "caption", "div.sr"]
headings = ["h2.chapter_title", "h1.fgh"]
opening  = ["h1", "b"]                       # the section opening: h1.shn, the plain h1 of div.sr_by_subd ("116J.89 ":
                                             # a section whose subdivisions are all renumbered/repealed), or the
                                             # <b>1.14</b> of a stub; h1.fgh never matches the section regex
                                             # (table-of-sections rows have neither, so they never open a section)
loose    = ["div.col-sm"]                    # chapter 1: the first-grade heading "SOVEREIGNTY, JURISDICTION, ..." is
                                             # bare text after the table of sections (no h1.fgh): a block of its own
drop     = ["a.permalink"]                   # the "§" permalink before every subdivision number

[MN.stat.ladder]
# inside a subdivision (or a section without subdivisions): (a) paragraph, (1) clause, (i) item, (A) subitem
# Not a fixed order in practice: (a)(1)(i)(A) is the norm, but 609.52 subd. 3 runs (1)(a)(i) and 609.341-.347 run
# (a)(i) with no clause between. Each level takes the types seen there; the ladder picks by sequence.
types = [["lower", "num"], ["num", "roman_lower", "lower"], ["roman_lower", "upper"], "upper"]
tags  = ["paragraph", "clause", "subparagraph", "subclause"]

[MN.stat.containers]
chapter = { match = '^CHAPTER\s+(?P<num>\d+[A-Z]?)\.\s+(?P<heading>.+)$', tag = "chapter", rank = 2, id = "ch{num}" }   # "CHAPTER 1. NAME" in one line

[MN.stat.sections]
# "645.01 WORDS AND PHRASES." (h1.shn) or "1.14" (the stub's <b>; the rest "[Repealed, ...]" stays as body)
match   = '^(?P<num>\d+[A-Z]?\.\d+)(?:\s+(?P<heading>.*))?$'
bold    = true                               # matched on the opening run
decimal = true                               # 1.0431 sorts between 1.043 and 1.044
scope   = "title"
versions = '^MS \d{4}\b'                    # "648.39 MS 1969 [Repealed ...]" then "648.39 MS 1982 [Repealed ...]": two
                                             # historical sections of one number; the second is kept as a version
# Subdivisions: "Subdivision 1.Scope." / "Subd. 2a.Name." (h2.subd_no). A group opens a level inside the
# section; (a)(1)(i)(A) restart under it: /us-mn/stat/ch645/s645.44/subd5/a. (num + heading in one num text
# until the shared group heading split exists)
group    = '^(?:Subdivision|Subd\.)\s+(?P<num>\d+[a-z]?)\.'
group_id = "subd{num}"
outdent  = [{ class = "bl" }]                # p.bl: flush text after a list ("and shall declare ..." in 1.046) goes
                                             # back to the section (or subdivision), not into the last item
# the chapter's table of sections: caption, header row, section rows ("1.01 EXTENT.", "645.03 [Repealed, ...]"),
# all-caps group rows (tr.fgh "GENERAL PROVISIONS")
toc     = ['^Table of Sections$', '^Section\s*Headnote$', '^\d+[A-Z]?\.\d+\s*\S', "^[A-Z][A-Z0-9 ,;:&'()-]+$"]

[MN.stat.notes]
sourceCredit = '^History:\s*$'              # the h2 label; its p.first holds the session-law citations
# first-grade headings end the open History note and stand as cross headings between sections
close        = [{ class = "fgh", heading = true }, { class = "loose" }]

# ---------------------------------------------------------------- Constitution of the State of Minnesota
# /constitution/ : the whole constitution on one page. div#xtend.constitution holds:
#   p.ce "Adopted October 13, 1857" / "Generally Revised November 5, 1974"; a table of articles;
#   <h2>Preamble</h2><p class="in">...</p>
#   <div class="article"><h2>ARTICLE I</h2><h2 class="header">BILL OF RIGHTS</h2>
#     <div class="section"><h3 class="section_no">Section 1. <span class="headnote">Object of government.</span></h3>
#       <p class="first">..</p> <p class="in">(a) ..</p> <div class="note"><p class="first">[Amended, November 8, 1988]</p></div>
[MN.const]
name    = "Constitution of the State of Minnesota"
doc     = "/us-mn/const"                     # /us-mn/const/a1/s7
fetch   = "template"
url     = "https://www.revisor.mn.gov/constitution/"
items   = ["full"]                           # always the one page
file    = "constitution-{item}.htm"
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "Official publication of the State of Minnesota, Revisor of Statutes"

[MN.const.html]
root     = "div#xtend"
blocks   = ["p", "h2", "h3", "tr"]           # tr: one row of the article list at the top
loose    = ["div.article"]                   # art. X: "Sec. 7. " is bare text between two sections (the repealed
                                             # section's number; its p.first "[Repealed, November 5, 1974]" follows)
headings = ["h2"]                            # "Preamble", "ARTICLE I", and the article name (h2.header)
opening  = []

[MN.const.ladder]
types = ["lower", "num", "roman_lower", "upper"]   # art. XI sec. 5 (a)..(j)
tags  = ["paragraph", "subparagraph", "clause", "subclause"]

[MN.const.containers]
preamble = { match = '^(?P<heading>Preamble)$', tag = "level", rank = 2, id = "preamble" }   # "CHAPTER 1. NAME" in one line
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+)$', tag = "article", rank = 2, id = "a{num_arabic}" }

[MN.const.sections]
match = '^(?:Section|Sec\.)\s+(?P<num>\d+[a-z]?)\.\s*(?P<heading>.*)$'   # the h3: "Section 1. Object of government."
bold  = false
scope = "container"                          # numbers restart per article
# art. XI sec. 5: the closing sentence after items (a)..(j) is a p.in like the items; it belongs to the section
outdent = ['^As authorized by law political subdivisions may engage']

[MN.const.notes]
sourceCredit = '^\[(?:Amended|Adopted|Repealed|Renumbered)'   # "[Amended, November 8, 1988]" (div.note)
# Front matter before the preamble (no section open): "Adopted October 13, 1857" / "Generally Revised November 5,
# 1974" (p.ce) -> one enactment note; then the article list (one tr per article) -> one toc note. Each note opens
# on its first line only; the lines after it join the open note (notes run to the next container).
note         = [{ class = "ce", match = '^Adopted ', topic = "enactment" }, { match = '^Article 1\.', topic = "toc" }]
