# MN.toml -- Minnesota: Minnesota Statutes (MN.stat) and the Constitution of the State of Minnesota (MN.const).
#
# Source: www.revisor.mn.gov (Office of the Revisor of Statutes; "Official Publication of the State of
# Minnesota"). robots.txt allows /statutes/ and /constitution/.
#
# Statutes: 105 "parts" (/statutes/part/<NAME>) list the chapters (1, 2A, 3E, 116J, 609 ...). Each chapter has
#   /statutes/cite/<ch>        table of sections only (no text)
#   /statutes/cite/<ch>/full   "Full Chapter Text": every section of the chapter on one page  <- the item
#   /statutes/cite/<ch>.<sec>  one section
# The /full page (checked on chapters 1 and 645), inside div#xtend.statute > div.col-sm:
#   <h2 class="chapter_title">CHAPTER 645. INTERPRETATION OF STATUTES</h2>
#   <div id="chapter_analysis"><table><caption>Table of Sections</caption> header row, one tr per section,
#       tr.fgh "GENERAL PROVISIONS" group rows </table></div>
#   <h1 class="fgh">GENERAL PROVISIONS</h1>                     first-grade heading between sections (cross heading)
#   <div class="section"><h1 class="shn">645.01 WORDS AND PHRASES.</h1>
#      <div class="subd"><a class="permalink">§</a><h2 class="subd_no">Subdivision 1.<span class="headnote">Scope.</span></h2><p>..</p></div>
#      <p class="ce"> centered lines of a quoted compact; <p class="bl"> flush text after a list
#   </div>
#   <div class="history"><h2>History: </h2><p class="first">1981 c 253 s 35</p></div>
#   <div class="sr"><b>1.14</b> [Repealed, 1961 c 561 s 17]</div>     a repealed / renumbered section stub
#   <div class="sr_by_subd"><h1>116J.89 </h1><div class="subd">..[Renumbered 116M.06, subd 1]..</div>...</div>
# Numbering inside a section: Subdivision 1. / Subd. 2. -> (a) paragraph -> (1) clause -> (i) item -> (A) subitem.

[MN.stat]
name    = "Minnesota Statutes"
doc     = "/us-mn/stat"                      # /us-mn/stat/ch645/s645.44/subd5/a (section numbers are unique statewide)
fetch   = "template"
url     = "https://www.revisor.mn.gov/statutes/cite/{item}/full"
edition = 2025                               # the site shows the 2025 statutes
item    = "%s"                               # chapter as printed: 1, 2A, 116J, 609 (no padding)
file    = "chapter-{item}.htm"
encoding = "utf-8"
family  = "html-paragraphs"
terms   = "Official publication of the State of Minnesota, Revisor of Statutes"

