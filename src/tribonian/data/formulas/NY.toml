# The Constitution: law id CNS (lawType MISC). Current: A1S11 carries the 2024 Equal Rights Amendment (activeDate
# 2025-01-10); tree activeDate 2026-06-05. Articles docLevelId roman ("I"), sections "§ 11. a." (dotted lower).
[NY.const]
inherit = "NY.laws"
replace = ["cite"]                              # its own [cite], not the laws'
name    = "Constitution of the State of New York"
doc     = "/us-ny/const"                        # /us-ny/const/a1/s11
# item: CNS (same url template)

# catalog: every item (title/chapter/article) this code has, from the publisher's index (1) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "CNS"
]

[NY.const.containers]
preamble = { match = '^(?P<heading>PREAMBLE)$', tag = "level", rank = 2, id = "preamble", heading = "self" }
article  = { match = '^ARTICLE\s+(?P<num>[IVXL]+(?:-[A-Z])?)$', tag = "article", rank = 2, id = "a{num_arabic}" }

[NY.const.ladder]
types = ["lower.", "num.", "lower"]                   # § 11. a. ... -- refine on the CNS full sample
tags  = ["subsection", "paragraph", "subparagraph"]

[NY.const.cite]
# "N.Y. Const. art. I, § 6"; New York courts "NY Const, art I, § 6"; "article I, section 6 of the New York
# Constitution". One item (CNS); its build currently finds article I only (see the report), so later articles' sections
# may resolve to the wrong text until the CNS containers are fixed.
full    = ['N\.?\s?Y\.?\s*Const(?:itution|\.)?{tail}',
           'New\s+York\s+(?:State\s+)?Constitution{tail}',
           '[Aa]rt(?:icle|\.)?\s*(?P<art>[IVXL]+|\d+),?\s*(?:§|[Ss]ec(?:tion|\.))\s*(?P<sec>\d+[a-z]?(?:-[a-z](?![\w]))?)(?:\s?\([A-Za-z0-9]{1,4}\))*,?\s+of\s+the\s+New\s+York\s+(?:State\s+)?Constitution']
tail    = ',?\s*(?:[Aa]rt(?:icle)?\.?)\s*(?P<art>[IVXLC]+|\d+)(?![\w])(?:,?\s*(?:§§?|[Ss]ec(?:tion)?s?\.?)\s*(?P<sec>\d+[a-z]?(?:-[a-z](?![\w]))?))?(?:\s?\([A-Za-z0-9]{1,4}\))*'
item    = "CNS"
label   = "N.Y. Const. art. {roman}[, § {sec}]"
examples = [["N.Y. Const. art. I, § 6", "ny-const:art-1:6", "N.Y. Const. art. I, § 6"],
            ["NY Const, art I, § 12", "ny-const:art-1:12"],
            ["article I, section 11 of the New York Constitution", "ny-const:art-1:11"]]

# ---------------------------------------------------------------- cite-only: commonly cited, no source here
[NY.nycrr]
name    = "Official Compilation of Codes, Rules and Regulations of the State of New York"
source_error = "no source: the official NYCRR is hosted by Westlaw for the Department of State; no bulk download"

[NY.nycrr.cite]
full    = ['(?P<tit>\d{1,2})\s*N\.?\s?Y\.?\s?C\.?\s?R\.?\s?R\.?\s*(?:§§?\s*|[Pp]art\s+)?(?P<sec>\d+(?:\.\d+)*[a-z]?(?:-[a-z]{1,2})?)(?![\w])',
           'N\.?\s?Y\.?\s*Comp\.\s*Codes\s*R\.\s*(?:&|and)\s*Regs\.,?\s*tit\.\s*(?P<tit>\d{1,2}),?\s*(?:§§?\s*|[Pp]t\.\s*|[Pp]art\s+)?(?P<sec>\d+(?:\.\d+)*[a-z]?(?:-[a-z]{1,2})?)(?![\w])']
section = '\d+(?:\.\d+)*[a-z]?(?:-[a-z]{1,2})?'
key     = "{tit}/{sec}"
label   = "N.Y. Comp. Codes R. & Regs. tit. {tit}, § {sec}"
examples = [["22 NYCRR 202.8-g", "ny-nycrr:22/202.8-g", "N.Y. Comp. Codes R. & Regs. tit. 22, § 202.8-g"],
            ["N.Y. Comp. Codes R. & Regs. tit. 9, § 2520.6(d)", "ny-nycrr:9/2520.6"]]

[NY.nycadmin]
name    = "Administrative Code of the City of New York"
source_error = "local law (New York City), not a state code: American Legal Publishing hosts it; no formula"

[NY.nycadmin.cite]
full    = ['N\.?\s?Y\.?\s?C\.?\s*Admin(?:istrative|\.)\s*Code',
           'Administrative\s+Code\s+of\s+(?:the\s+)?City\s+of\s+(?:New\s+York|N\.?\s?Y\.?)',
           'New\s+York\s+City\s+Administrative\s+Code']
bare    = ['Admin(?:istrative|\.)\s*Code']
section = '\d{1,2}-\d{2,4}(?:\.\d+)?[a-z]?'
label   = "N.Y.C. Admin. Code § {sec}"
examples = [["N.Y.C. Admin. Code § 8-107(1)(a)", "ny-nycadmin:8-107", "N.Y.C. Admin. Code § 8-107"],
            ["Administrative Code of City of NY § 26-504", "ny-nycadmin:26-504"],
