# New York -- batch 3c. Source: NY Senate Open Legislation API v3 (JSON). nysenate.gov law pages 403 our client.
# Docs: https://legislation.nysenate.gov/static/docs/html/laws.html ; samples: build/probe/legislation.nysenate.gov/api_3_*
# Free API key (register at https://legislation.nysenate.gov/), passed as query parameter `key`, filled from the
# environment by the shared {env:NAME} URL feature (never stored).
#
# Fetch: one GET per law (template) returns the whole tree with every node's text as JSON (?full=true; GCN 137 KB,
# big laws several MB). transform = "nysenate-json" (src/tribonian/uslm/transforms/nysenate.py) turns it into HTML
# blocks before parsing. Item list: GET /api/3/laws?limit=1000 -> result.items[].lawId where lawType = CONSOLIDATED.

[NY.laws]
name    = "Consolidated Laws of New York"
doc     = "/us-ny/laws"                         # /us-ny/laws/gcn/a2/s11-a
fetch   = "template"
url     = "https://legislation.nysenate.gov/api/3/laws/{item}?full=true&key={env:NYSENATE_API_KEY}"   # key filled at request time
file    = "{item}.json"                         # law/ny/laws/GCN.json (raw JSON, kept as fetched)
transform = "nysenate-json"                     # JSON -> <div id="law"> HTML blocks (see the module docstring)
encoding = "utf-8"
family  = "html-paragraphs"

# catalog: every item (title/chapter/article) this code has, from the publisher's index (94) -- the browse index.
# Not fetched by default: `tribonian state fetch` still takes the items you name.
catalog = [
  "ABC", "ABP", "ACA", "ACG", "AGM", "BNK", "BSC", "BVO", "CAL", "CAN", "CCO", "CNT", "COM", "COR", "CPL", "CVP",
  "CVR", "CVS", "DCD", "DOM", "EDN", "EDP", "ELD", "ELN", "EML", "ENG", "ENV", "EPT", "EXC", "FIS", "GAS", "GBS",
  "GCN", "GCT", "GMU", "GOB", "HAY", "IND", "ISC", "JUD", "LAB", "LEG", "LFN", "LIE", "LLC", "MDW", "MHA", "MHR",
  "MHY", "MIL", "MRE", "NAV", "NPC", "PAR", "PBA", "PBB", "PBG", "PBH", "PBL", "PBO", "PBS", "PEN", "PEP", "PML",
  "PPD", "PTR", "PVH", "RAT", "RCO", "REL", "RPA", "RPP", "RPT", "RRD", "RSS", "SAP", "SCC", "SLG", "SOS", "STF",
  "STL", "STT", "SWC", "TAX", "TCP", "TRA", "TWN", "UCC", "VAT", "VAW", "VET", "VIL", "VOL", "WKC",
  # the court acts (lawType COURT_ACTS, same API), added for their cites: Family Court Act, SCPA, Court of Claims Act ...
  "CCA", "CTC", "FCT", "SCP", "UCT", "UDC", "UJC"
]

[NY.laws.html]
# extractor output: <div id="law"> <p align=center> heading lines, <p class="front-first"> + <p> front matter
# (enacting clause, tables of sections), <p><b>§ N. Title.</b> text</p> + <p> one per paragraph </div>
root     = "div#law"
blocks   = ["p"]
headings = ["p:centered"]
opening  = ["b"]

[NY.laws.containers]
# the article's own text starts "ARTICLE 2" / "MEANING OF TERMS" (centred lines); heading = the next centred line
title   = { match = '^TITLE\s+(?P<num>[\dA-Z]+(?:-[A-Za-z\d]+)*)$', tag = "title",   rank = 2, id = "t{num}" }
article = { match = '^ARTICLE\s+(?P<num>[\dA-Z]+(?:-[A-Za-z\d]+)*)$', tag = "article", rank = 3, id = "a{num}" }
part    = { match = '^PART\s+(?P<num>[\dA-Z]+(?:-[A-Za-z\d]+)*)$', tag = "part",    rank = 4, id = "p{num}" }
subpart = { match = '^SUBPART\s+(?P<num>[\dA-Z]+(?:-[A-Za-z\d]+)*)$', tag = "subpart", rank = 5, id = "sp{num}" }

[NY.laws.ladder]
# 1. (a) (i) (A); some sections open with "a." and number under it "1." (GCN § 65)
types = [["num.", "lower."], ["lower.", "lower", "num."], ["roman_lower", "lower"], ["upper", "roman_lower"]]
tags  = ["subsection", "paragraph", "subparagraph", "clause"]

[NY.laws.sections]
# opening run "§ 11-a.  Acquisition." (the extractor bolds "§ N. <node title>.")
match = '^§\s*(?P<num>\d+[A-Za-z]?(?:[-.]\d*[A-Za-z]*)*)\.\s*(?P<heading>.*)$'
bold  = true
scope = "title"

[NY.laws.notes]
# front matter of a container node: the chapter's enacting clause, an article's table of sections
note = [{ class = "front-first", topic = "toc" }]

[NY.laws.cite]
# how cases cite the consolidated laws (statecites.py): Bluebook "N.Y. Penal Law § 125.25 (McKinney 2009)",
# "N.Y. C.P.L.R. 3211(a)(7)"; "McKinney's Consolidated Laws of N.Y., Book 39, Penal Law § 125.25"; New York courts
# (Official Reports style) without the state: "Penal Law § 125.25 [1]", "CPLR 3211 [a] [7]", "Executive Law § 296",
# "EPTL 5-1.1", "section 240(1) of the Labor Law". The section is placed by each form so "CPLR article 78" or
# "Penal Law article 125" (articles, not sections) are not read as § 78 / § 125. Sub keys are the Senate API law ids.
full    = ['N\.?\s?Y\.?\s*{sub},?\s*(?:§§?\s*|[Ss]ec(?:tion|s?\.)\s*|[Ss]ections\s*|[Rr](?:ule|\.)\s*)?{section}(?![\w])',
           'New\s+York\s+(?:State\s+)?{sub},?\s*(?:§§?\s*|[Ss]ec(?:tion|s?\.)\s*|[Ss]ections\s*|[Rr](?:ule|\.)\s*)?{section}(?![\w])',
           'McKinney\x27?s\s+(?:Cons(?:olidated|\.)\s*Laws\s+of\s+N\.?\s?Y\.?,?\s*(?:Book\s+\d+[A-Z]?,?\s*)?)?{sub},?\s*(?:§§?\s*|[Ss]ec(?:tion|s?\.)\s*|[Ss]ections\s*|[Rr](?:ule|\.)\s*)?{section}(?![\w])',
           '(?:§|[Ss]ection)\s*(?P<sec>\d+[a-z]?(?:-[a-z]{1,2}(?![a-z])|-[A-Z](?![\w])|[.-]\d+[a-z]?)*)(?![\w])(?:\s?\([A-Za-z0-9]{1,4}\))*,?\s+of\s+the\s+New\s+York\s+(?:State\s+)?{sub}']
bare    = ['{sub},?\s*(?:§§?\s*|[Ss]ec(?:tion|s?\.)\s*|[Ss]ections\s*|[Rr](?:ule|\.)\s*)?{section}(?![\w])',
           '(?:§|[Ss]ection)\s*(?P<sec>\d+[a-z]?(?:-[a-z]{1,2}(?![a-z])|-[A-Z](?![\w])|[.-]\d+[a-z]?)*)(?![\w])(?:\s?\([A-Za-z0-9]{1,4}\))*,?\s+of\s+the\s+{sub}']
section = '\d+[a-z]?(?:-[a-z]{1,2}(?![a-z])|-[A-Z](?![\w])|[.-]\d+[a-z]?)*'
item    = "{sub}"
label   = "N.Y. {name} {sec}"
examples = [["N.Y. Gen. Constr. Law § 25-a (McKinney 2016)", "ny-laws:GCN/25-a", "N.Y. Gen. Constr. Law § 25-a"],
            ["Education Law § 3020-a(2)", "ny-laws:EDN/3020-a", "N.Y. Educ. Law § 3020-a"],
            ["N.Y. C.P.L.R. 3211(a)(7)", "ny-laws:CVP/3211", "N.Y. C.P.L.R. 3211"],
            ["CPLR 214-c", "ny-laws:CVP/214-c"],
            ["EPTL 5-1.1-A(a)(2)", "ny-laws:EPT/5-1.1-A", "N.Y. Est. Powers & Trusts Law § 5-1.1-A"],
            ["section 1310 of the Abandoned Property Law", "ny-laws:ABP/1310"],
            ["New York Penal Law § 125.25", "ny-laws:PEN/125.25", "N.Y. Penal Law § 125.25"],
            ["Family Ct Act § 1012(f)", "ny-laws:FCT/1012", "N.Y. Fam. Ct. Act § 1012"]]

