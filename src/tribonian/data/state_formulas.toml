# The Maryland Constitution: the same selector, articles c0 (Declaration of Rights) to c20
[MD.const]
inherit = "MD.code"
name    = "Constitution of Maryland"
doc     = "/us-md/const"                      # /us-md/const/c0/s24
items_match = 'c\d+[a-z]?'

[MD.const.cite]
# "Md. Const. art. IV, § 14"; articles XI-A ... XI-I are their own items (c11a ...): the letter is a sub ("-A" -> a),
# keyed art-11-a. The Declaration of Rights (item c0) is cited by its own articles: table MD.decl below.
full    = ['(?:Md\.\s?Const\.?|Maryland\s+Constitution|Constitution\s+of\s+Maryland),?\s*[Aa]rt(?:icle)?\.?\s*(?P<art>[IVXLC]+|\d+)(?:-{sub})?\b(?:,?\s*(?:§§?|[Ss]ec(?:tion)?s?\.?)\s*(?P<sec>\d+[A-Za-z]?(?:\.\d+)?))?']
key     = "art-{art}[-{sub}][:{sec}]"
item    = "c{art}[{sub}]"
label   = "Md. Const. art. {roman}[-{name}][, § {sec}]"
examples = [["Md. Const. art. IV, § 14", "md-const:art-4:14", "Md. Const. art. IV, § 14"],
            ["Md. Const. art. XI-A, § 3", "md-const:art-11-a:3", "Md. Const. art. XI-A, § 3"],
            ["Md. Const. art. XX", "md-const:art-20"]]

[MD.const.cite.sub]
a = ['A']
b = ['B']
c = ['C']
d = ['D']
e = ['E']
f = ['F']
g = ['G']
h = ['H']
i = ['I']

[MD.const.cite.names]
a = "A"
b = "B"
c = "C"
d = "D"
e = "E"
f = "F"
g = "G"
h = "H"
i = "I"

# The Maryland Declaration of Rights: the constitution's item c0, cited by its own articles ("Article 24 of the
# Maryland Declaration of Rights"). A cite table only (no fetch): its text is read from MD.const's built c0 (`also`).
[MD.decl]
name    = "Maryland Declaration of Rights"

[MD.decl.cite]
full    = ['Md\.\s?(?:Const\.,?\s*)?Decl(?:\.|aration)\s*of\s*R(?:ts?\.|ights),?\s*[Aa]rt(?:icle)?s?\.?\s*{section}',
           'Maryland\s+Declaration\s+of\s+Rights,?\s*[Aa]rt(?:icle)?s?\.?\s*{section}',
           '[Aa]rt(?:icle)?s?\.?\s*{section}\s+of\s+the\s+Maryland\s+Declaration\s+of\s+Rights']
bare    = ['Decl(?:\.|aration)\s*of\s*R(?:ts?\.|ights),?\s*[Aa]rt(?:icle)?s?\.?\s*{section}',
           '[Aa]rt(?:icle)?s?\.?\s*{section}\s+of\s+the\s+Declaration\s+of\s+Rights']
section = '\d+[A-Z]?'
item    = "c0"
also    = ["const"]
label   = "Md. Const. Decl. of Rts. art. {sec}"
examples = [["Article 24 of the Maryland Declaration of Rights", "md-decl:24", "Md. Const. Decl. of Rts. art. 24"],
            ["Md. Decl. of Rts. art. 26", "md-decl:26"],
            ["Md. Const. Declaration of Rights, Art. 40", "md-decl:40"]]
