# tribonian-us settings. Copy to ~/.config/tribonian-us/config.toml
# (native Windows: %APPDATA%\tribonian-us\config.toml; TRIBONIAN_CONFIG=/path overrides).
# Every key is optional. Order of precedence: the CL_* environment variable, then this file, then the
# default. tribonian check shows the value in effect for each and where it came from.
# Paths may start with ~. A relative path is relative to the work folder.
# Windows paths: single quotes ('D:\courtlistener') or forward slashes ("D:/courtlistener"); in double
# quotes a backslash is an escape and the file is rejected.

# Work folder: every input and output (xml/, cases/, md*/, pdf/, build/, state/, bulk/, db/); every
# command runs there. Default: the checkout, else ~/.local/share/tribonian-us   (TRIBONIAN_WORK)
# work_dir = "~/tribonian-data"

# Folder holding the CourtListener *.csv.bz2 downloads                        (CL_BULK)
# bulk_dir = "/path/to/courtlistener"

# The main database; default <bulk_dir>/courtlistener.sqlite          (CL_DB)
# main_db = "~/tribonian-us/db/courtlistener.sqlite"

# Opinion text, about 110 GB; default <work>/db/opinions.sqlite               (CL_OPS_DB)
# opinions_db = "/path/to/opinions.sqlite"

# Full-text index (tribonian db index); default beside main_db                   (CL_SEARCH_DB)
# search_db = "/path/to/ssd/search.sqlite"

# Co-citation results; views are cocite-<view>.sqlite beside it               (CL_COCITE_DB)
# cocite_db = "/path/to/courtlistener/cocite.sqlite"

# Downloaded C.F.R. titles and state law (tribonian cfr fetch); default <work>/law   (TRIBONIAN_LAW)
# law_dir = "/path/to/large/disk/law"

# Data mode: offline (local only, no API requests), full (the API only for what you ask for),
# complete (full, plus whatever is newer than the bulk data from the API), lite, api   (CL_DATA_MODE)
# tribonian --mode <mode> <command> overrides it for one command; the GUI has its own selector.
# The Sync page sets it on first setup and when the key or the bulk data changes; unset, it is full with a local
# database, else api with a token, else offline.
# data_mode = "full"

# How case citations are found in briefs, filings and slip opinions                 (CL_CITE_ENGINE)
#   patterns  our own regular expressions over the reporter list from reporters-db (no dependency)
#   eyecite   Free Law Project's eyecite, which makes CourtListener's own markup (pip install eyecite)
#   both      patterns, plus whatever eyecite finds that patterns did not
# cite_engine = "patterns"

# CourtListener API limits per minute, hour, day; members raise them          (CL_LIMITS)
# api_limits = "5,50,125"

# API token: the Sync page or `tribonian setup key set` puts it in the system key store. Only where there is
# none does it land here (the file then readable only by you). Don't share or commit this file.   (COURTLISTENER_TOKEN)
# courtlistener_token = "..."
# Written by the Sync page's Skip: no token on purpose (offline until one is added)
# token_skipped = true

[hidden]
# Hidden rulings (tribonian cocite hidden, and the Hidden ruling check on case builds):
# score = coupling x obscurity x court x status x record. Defaults shown; --set key=value overrides for one run.
# min_members = 2          # cites at least this many of the sub-cluster's members
# power = 1.0              # obscurity = (1 - rank among decisions of its filing year and court level) ^ power   (>= 0)
# settle_years = 3         # filed within this many years of the bulk data: the Not yet visible list, no obscurity
# later = true             # also decisions filed after the sub-cluster's slice (marked "after")
# max_inbound = 10         # leave out decisions cited more than this; unset = no cap
# top = 30
# no_cite = 0.25           # no reporter citation on file: CourtListener can't link later cites to it
# Court and status weights as dotted keys (works on every Python, no sub-tables needed):
# court.scotus = 3.0
# court.circuit = 2.0
# court.state-supreme = 1.5
# court.state-appellate = 1.0
# court.district = 0.7
# court.other = 0.3
# status.Published = 1.0
# status.Unpublished = 0.5
# status.Unknown = 0.8
# status.other = 0.3

[gui]
# View opened at start (a cocite*.sqlite file stem)
# default_view = "cocite-appellate-sentence-m0.2"
# Obsidian vault for "Open note"; leave out to open the .md file instead
# obsidian_vault = "usc-vault"
# obsidian_cases_dir = "08-Reference/Cases"
# Interpreter for the repo's scripts (Windows: "py")
# python = "python3"
