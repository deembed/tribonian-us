# Tests on Linux for every pull request. On Windows and macOS too when the repository is public (Actions are
# free there) or when started by hand (Actions tab > test > Run workflow): on a private repository those
# runners use the free monthly allowance fast (macOS costs about ten times Linux per minute).
# No data, no network beyond installing packages: tests that need xml/, cases/ or pdflatex skip themselves.
name: test

on:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || !github.event.repository.private) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
      - run: tribonian --help
      - run: tribonian check
        continue-on-error: true      # a bare runner has no token or databases: this only shows it runs

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || !github.event.repository.private) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - run: cargo test
