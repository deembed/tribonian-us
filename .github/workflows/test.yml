# Tests on Linux, macOS and Windows for every pull request and every push to main.
# No data, no network beyond installing packages: tests that need xml/, cases/ or pdflatex skip themselves.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
      - run: tribonian --help
      - run: tribonian check
        continue-on-error: true      # a bare runner has no token or databases: this only shows it runs

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - run: cargo test
      - run: cargo build --release
